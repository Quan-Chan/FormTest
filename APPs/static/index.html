                        buffer += decoder.decode(value, { stream: true });
                        const lines = buffer.split('\n');
                        buffer = lines.pop() || '';
                        for (const line of lines) {
                            if (line.startsWith('data: ')) {
                                try { const data = JSON.parse(line.slice(6)); this.handleStreamData(data); } catch (e) {}
                            }
                        }
                    }
                },

                async stopTests() {
                    try {
                        await fetch('/api/v1/test-job/hub', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({action: 'stop'})
                        });
                    } catch (e) {}
                },

                handleStreamData(data) {
                    const progressContainer = document.getElementById('progressContainer');
                    const progressFill = document.getElementById('progressFill');
                    const progressText = document.getElementById('progressText');
                    const progressPercent = document.getElementById('progressPercent');

                    if (data.type === 'stream_chunk') {
                        this.addOrUpdateAiStreamItem(data);
                    } else if (data.type === 'result') {
                        this.addOrUpdateAiStreamItem(data);
                        this._updateModelFilterOptions(data.model_id || '');
                    } else if (data.type === 'progress') {
                        const total = parseInt(progressContainer.dataset.total || data.total || 0);
                        const completed = data.completed || 0;
                        const percent = total > 0 ? Math.round(completed / total * 100) : 0;
                        progressFill.style.width = percent + '%';
                        progressPercent.textContent = percent + '%';
                        document.getElementById('resultCount').textContent = `${completed} 题`;
                        progressText.textContent = `已完成 ${completed}/${total}`;
                    } else if (data.type === 'done') {
                        progressText.textContent = data.message || '测试完成';
                        document.getElementById('runBtn').disabled = false;
                        document.getElementById('stopBtn').disabled = true;
                        document.getElementById('runBtn').innerHTML = '开始测试';
                        document.getElementById('aiStreamStatus').textContent = '完成';
                        document.getElementById('aiStreamStatus').classList.remove('active');
                        document.getElementById('progressContainer').style.display = 'none';
                        this.isRunning = false;

                        this.loadHistoryResults().then(() => {
                            const textEl = document.querySelector('#historySelectorWrap .custom-select-text');
                            if (textEl) textEl.textContent = '当前运行';
                        });
                    } else if (data.type === 'status') {
                        if (data.status === 'stopped') {
                            progressText.textContent = data.message || '已终止';
                            const runBtn = document.getElementById('runBtn');
                            const stopBtn2 = document.getElementById('stopBtn');
                            runBtn.disabled = false;
                            runBtn.classList.remove('btn-loading');
                            stopBtn2.disabled = true;
                            runBtn.innerHTML = '开始测试';
                            document.getElementById('aiStreamStatus').textContent = '已终止';
                            document.getElementById('aiStreamStatus').classList.remove('active');
                            document.getElementById('progressContainer').style.display = 'none';
                            this.isRunning = false;
                        }
                        if (data.status === 'completed') {
                            progressText.textContent = data.message || '完成';
                        }
                        if (data.message && data.message.includes('正在生成')) {
                            document.getElementById('aiStreamStatus').textContent = '生成中';
                            document.getElementById('aiStreamStatus').classList.add('active');
                        }
                    }
                },

                addOrUpdateAiStreamItem(data) {
                    const container = document.getElementById('aiStreamContent');
                    const empty = container.querySelector('.ai-empty');
                    if (empty) empty.remove();

                    const itemId = data.id;
                    let item = container.querySelector(`[data-item-id="${itemId}"]`);

                    if (!item) {
                        item = document.createElement('div');
                        item.className = 'result-item';
                        item.dataset.itemId = itemId;
                        item.dataset.seq = data.seq || '0';
                        item.dataset.promptId = data.prompt_id || '';
                        item.dataset.questionId = data.question_id || '';
                        item.dataset.testIndex = data.test_index || '1';
                        const modelId = data.model_id || data.model || '';
                        const hasError = data.error_type || data.ai_answer === null;
                        if (hasError) item.classList.add('result-error');
                        const promptTag = data.prompt_tag || '';
                        const expected = data.expected_answer || data.answer || '';
                        const aiReply = data.ai_answer || data.model_reply || '';
                        const reasoning = data.reasoning_content || '';
                        let aiContent = '';
                        if (reasoning) {
                            aiContent += '&lt;think&gt;\n' + this.escapeHtml(reasoning) + '\n&lt;/think&gt;\n';
                        }
                        if (aiReply) {
                            aiContent += (aiContent ? '\n' : '') + this.escapeHtml(aiReply);
                        } else if (!reasoning) {
                            aiContent += '<span style="color:var(--text-muted)">无回复</span>';
                        }
                        const displayId = (data.question_id || '?') + (data.test_count > 1 ? '-' + (data.test_index || 1) : '');
                        item.innerHTML = `
                        <div class="result-header">
                            <span class="result-id">${this.escapeHtml(promptTag)} / #${this.escapeHtml(displayId)}</span>
                            <span class="result-source">${this.escapeHtml(modelId)}</span>
                        </div>
                        <div class="result-row">
                            <div class="result-label">问题</div>
                            <div class="result-content" style="font-size:12px;background:var(--bg-card);">${this.escapeHtml(data.question || '')}</div>
                        </div>
                        <div style="display:flex;gap:8px;margin-top:6px;">
                            <div style="flex:1;">
                                <div class="result-label">期望答案</div>
                                <div class="result-content expected">${this.escapeHtml(expected) || '暂无'}</div>
                            </div>
                            <div style="flex:1;">
                                <div class="result-label">AI回复</div>
                                <div class="result-content ai">${aiContent}</div>
                            </div>
                        </div>`;
                        item.dataset.modelId = modelId;
                        item.dataset.hasError = hasError ? '1' : '0';
                        this._updateModelFilterOptions(modelId);
                        const insertIdx = this._liveItems.findIndex(
                            existing => this._compareByLogicalOrder(existing, data) > 0
                        );
                        if (insertIdx === -1) {
                            this._liveItems.push(item);
                            container.appendChild(item);
                        } else {
                            this._liveItems.splice(insertIdx, 0, item);
                            container.insertBefore(item, container.children[insertIdx]);
                        }
                        const filter = this._getStreamFilter();
                        if (!this._matchesFilter(item, filter)) item.style.display = 'none';
                    }

                    const aiDiv = item.querySelector('.result-content.ai');
                    if (aiDiv) {
                        let text = '';
                        if (data.reasoning_content) {
                            text += '<think>\n' + data.reasoning_content + '\n</think>\n';
                        }
                        if (data.ai_answer) {
                            text += (text ? '\n' : '') + data.ai_answer;
                        }
                        aiDiv.textContent = text || '无回复';
                    }
                    this._scheduleAutoScroll();
                    return item;
                },

                _getStreamFilter() {
                    return {
                        status: document.getElementById('resultFilterStatus')?.value || 'all',
                        model: document.getElementById('resultFilterModel')?.value || '',
                        text: (document.getElementById('resultFilterText')?.value || '').toLowerCase()
                    };
                },

                _matchesFilter(item, filter) {
                    if (filter.status === 'success' && item.dataset.hasError === '1') return false;
                    if (filter.status === 'error' && item.dataset.hasError === '0') return false;
                    if (filter.model && item.dataset.modelId !== filter.model) return false;
                    if (filter.text) {
                        const text = item.textContent.toLowerCase();
                        if (!text.includes(filter.text)) return false;
                    }
                    return true;
                },

                applyStreamFilter() {
                    const filter = this._getStreamFilter();
                    this._liveItems.forEach(item => {
                        item.style.display = this._matchesFilter(item, filter) ? '' : 'none';
                    });
                },

                _isAtBottom(container) {
                    return container.scrollTop + container.clientHeight >= container.scrollHeight - 30;
                },

                _scheduleAutoScroll() {
                    if (this._scrollPending) return;
                    this._scrollPending = true;
                    requestAnimationFrame(() => {
                        this._scrollPending = false;
                        if (this._userScrolledAway) return;
                        const container = document.getElementById('aiStreamContent');
                        if (container) container.scrollTop = container.scrollHeight;
                    });
                },

                _compareByLogicalOrder(a, b) {
                    const getVal = (obj, camelKey, snakeKey) => {
                        if (obj.dataset) {
                            const v = obj.dataset[camelKey];
                            if (v !== undefined) return v;
                        }
                        let v = obj[camelKey];
                        if (v !== undefined) return v;
                        v = obj[snakeKey];
                        if (v !== undefined) return v;
                        return undefined;
                    };
                    const getNum = (obj, camelKey, snakeKey) => {
                        const v = getVal(obj, camelKey, snakeKey);
                        if (v === undefined || v === null || v === '') return 0;
                        return Number(v);
                    };
                    const getStr = (obj, camelKey, snakeKey) => {
                        const v = getVal(obj, camelKey, snakeKey);
                        if (v === undefined || v === null) return '';
                        return String(v);
                    };
                    const pDiff = getNum(a, 'promptId', 'prompt_id') - getNum(b, 'promptId', 'prompt_id');
                    if (pDiff !== 0) return pDiff;
                    const qDiff = getNum(a, 'questionId', 'question_id') - getNum(b, 'questionId', 'question_id');
                    if (qDiff !== 0) return qDiff;
                    const tDiff = getNum(a, 'testIndex', 'test_index') - getNum(b, 'testIndex', 'test_index');
                    if (tDiff !== 0) return tDiff;
                    const mA = getStr(a, 'modelId', 'model_id');
                    const mB = getStr(b, 'modelId', 'model_id');
                    if (mA < mB) return -1;
                    if (mA > mB) return 1;
                    return 0;
                },

                _updateModelFilterOptions(modelId) {
                    if (!modelId) return;
                    const dropdown = document.getElementById('resultFilterModelDropdown');
                    if (!dropdown) return;
                    for (let i = 0; i < dropdown.children.length; i++) {
                        if (dropdown.children[i].dataset.value === modelId) return;
                    }
                    const opt = document.createElement('div');
                    opt.className = 'custom-select-option';
                    opt.dataset.value = modelId;
                    opt.textContent = modelId;
                    opt.addEventListener('click', () => this.selectDropdownOption('resultFilterModel', modelId, modelId));
                    dropdown.appendChild(opt);
                },

                async loadHistoryResults() {
                    if (!this.testSetNames.length) return;
                    try {
                        const results = await Promise.allSettled(this.testSetNames.map(async (name) => {
                            const resp = await fetchWithTimeout(
                                `/api/v1/test-set/results?test_set=${encodeURIComponent(name)}`);
                            if (!resp.ok) throw new Error(`API错误: ${resp.status}`);
                            const data = await resp.json();
                            return (data.results || []).map(r => ({ ...r, testSet: name }));
                        }));
                    this.historyResultsList = results
                        .filter(r => r.status === 'fulfilled')
                        .flatMap(r => r.value)
                        .sort((a, b) => (b.name || '').localeCompare(a.name || ''));
                    const dropdown = document.getElementById('historySelectorDropdown');
                    if (dropdown) {
                        dropdown.innerHTML = '<div class="custom-select-option selected" data-dropdown="historySelector" data-value="" data-label="当前运行">当前运行</div>' +
                            this.historyResultsList.map((r, idx) => {
                                const key = r.path || r.name || 'result_' + idx;
                                const text = `[${r.testSet}] ${r.name}`;
                                return `<div class="custom-select-option" data-dropdown="historySelector" data-value="${this.escapeHtml(key)}" data-label="${this.escapeHtml(text)}">${this.escapeHtml(text)}</div>`;
                            }).join('');
                    }
                    } catch (error) {
                        handleError('loadHistoryResults', error);
                        const retryBtn = document.getElementById('historyRetryBtn');
                        if (retryBtn) retryBtn.style.display = '';
                    }
                },

                async retryLoadHistory() {
                    const retryBtn = document.getElementById('historyRetryBtn');
                    if (retryBtn) retryBtn.style.display = 'none';
                    await this.loadHistoryResults();
                },

                async loadHistoryResult() {
                    const hidden = document.getElementById('historySelector');
                    const val = hidden ? hidden.value : '';
                    if (val === this._currentDisplay) return;
                    if (!val) {
                        this._liveItems = this._savedLiveItems || [];
                        this._userScrolledAway = false;
                        if (this._liveItems.length > 0) {
                            const container = document.getElementById('aiStreamContent');
                            container.innerHTML = '';
                            this._liveItems.forEach(item => container.appendChild(item));
                            document.getElementById('aiStreamStatus').textContent = this.isRunning ? '运行中' : '待机';
                            document.getElementById('resultCount').textContent = `${this._liveItems.length} 题`;
                            this.applyStreamFilter();
                        } else {
                            document.getElementById('aiStreamContent').innerHTML = '';
                            document.getElementById('aiStreamStatus').textContent = '等待中';
                            document.getElementById('resultCount').textContent = '0 题';
                        }
                        this._currentDisplay = val;
                        return;
                    }
                    const result = this.historyResultsList.find(r => (r.path || r.name) === val);
                    if (!result || !result.data) return;
                    const sorted = [...result.data].sort((a, b) => this._compareByLogicalOrder(a, b));
                    const container = document.getElementById('aiStreamContent');
                    container.innerHTML = '';
                    this._savedLiveItems = this._liveItems;
                    this._liveItems = [];
                    this._userScrolledAway = true;
                    document.getElementById('aiStreamStatus').textContent = '历史';
                    document.getElementById('resultCount').textContent = `${sorted.length} 题`;
                    for (const item of sorted) {
                        this.addOrUpdateAiStreamItem(item);
                    }
                    this._currentDisplay = val;
                },

                async init() {
                    await this.loadConfig();
                    await this.loadAllTestSets();
                    await this.loadCanvasState();

                    if (this.canvasState.selectedPrompts) {
                        this.selectedPrompts = new Set(this.canvasState.selectedPrompts);
                        this.selectedQuestions = new Set(this.canvasState.selectedQuestions);
                        if (this.canvasState.selectedModels) {
                            this.selectedModels = this.canvasState.selectedModels;
                        }
                    } else if (this.canvasState.nodes.some(n => (n.type === 'prompt' || n.type === 'question') && n.tag)) {
                        this.selectedPrompts.clear();
                        this.selectedQuestions.clear();
                        this.canvasState.nodes.forEach(n => {
                            if (n.type === 'prompt' && n.tag) {
                                this.prompts.filter(p => (p.testSet || '未分类') === n.tag).forEach(p =>
                                    this.selectedPrompts.add(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`));
                            }
                            if (n.type === 'question' && n.tag) {
                                this.questions.filter(q => (q.testSet || '未分类') === n.tag).forEach(q =>
                                    this.selectedQuestions.add(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`));
                            }
                        });
                    }

                    // localStorage中存有最新选择状态，用其覆盖画布的陈旧数据
                    this._loadSelectionFromLocalStorage();
                    // 清理localStorage中不再有效的选中项
                    const validPromptKeys = new Set(this.prompts.map(p =>
                        `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`));
                    const validQuestionKeys = new Set(this.questions.map(q =>
                        `q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`));
                    for (const key of this.selectedPrompts) {
                        if (!validPromptKeys.has(key)) this.selectedPrompts.delete(key);
                    }
                    for (const key of this.selectedQuestions) {
                        if (!validQuestionKeys.has(key)) this.selectedQuestions.delete(key);
                    }

                    this.syncCanvasFromSelection();

                    // Only sync model nodes when NOT loading a saved canvas
                    // (saved canvas already has model nodes with correct positions)
                    if (!this._hasSavedCanvas) {
                        this.syncModelNodesToCanvas();
                    } else {
                        // Just update the model count display without re-syncing
                        document.getElementById('selectedModelCount').textContent = this.selectedModels.length;
                    }

                    this.renderAssociationCanvas({ center: false });
                    this.renderPromptList();
                    this.renderQuestionList();
                    // Validate model nodes: auto-refresh if selected models not in availableModels
                    const modelNodes = this.canvasState.nodes.filter(n => n.type === 'model' && n.value);
                    const missingModels = modelNodes.filter(n => !this.availableModels.includes(n.value));
                    if (missingModels.length > 0) {
                        await this.loadModels();
                    }
                    this._markMissingModels();
                    this._markMissingPromptQuestions();
                    this.loadHistoryResults();
                    try {
                        const resp = await fetch('/api/v1/test-job/hub', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({action: 'status'})
                        });
                        const st = await resp.json();
                        if (st.status === 'running') {
                            this.isRunning = true;
                            this.allResults = {};
                            this._liveItems = [];
                            this._userScrolledAway = false;
                            document.getElementById('aiStreamContent').innerHTML = '';
                            document.getElementById('progressContainer').style.display = 'block';
                            document.getElementById('progressContainer').dataset.total = st.total;
                            document.getElementById('progressText').textContent = `已恢复 ${st.completed}/${st.total} 个任务...`;
                            document.getElementById('progressPercent').textContent = st.total > 0 ? Math.round(st.completed/st.total*100) + '%' : '0%';
                            document.getElementById('resultCount').textContent = `${st.completed} 题`;
                            document.getElementById('runBtn').disabled = true;
                            document.getElementById('stopBtn').disabled = false;
                            document.getElementById('runBtn').innerHTML = '测试中...';
                            document.getElementById('aiStreamStatus').textContent = '生成中';
                            document.getElementById('aiStreamStatus').classList.add('active');
                            this.abortController = new AbortController();
                            this._connectJobStream(st.job_id).catch(() => {});
                        } else if (st.status === 'completed') {
                            await this.loadHistoryResults();
                            const entries = this.historyResultsList;
                            if (entries.length > 0) {
                                const newest = entries[entries.length - 1];
                                const hs = document.getElementById('historySelector');
                                if (hs) {
                                    hs.value = newest.path || newest.name || '';
                                    const textEl = document.querySelector('#historySelectorWrap .custom-select-text');
                                    if (textEl) textEl.textContent = `[${newest.testSet}] ${newest.name}`;
                                }
                                this.loadHistoryResult();
                            }
                        }
                    } catch(e) {}
                    this.canvasState.history = [];
                    this.canvasHistoryIndex = -1;
                    this.saveCanvasSnapshot();
                    try { await this.renderArchiveSelector(); } catch (e) { console.error('加载存档失败', e); }
                    this.initDropdowns();
                    _bindEvents();
                    ['temperature', 'concurrency', 'testCount', 'maxRetries', 'contextSize', 'topP', 'minP', 'topK'].forEach(p => this.updateSliderVisual(p));
                    window.addEventListener('resize', this.debouncedCanvasResize.bind(this));
                },

                async loadConfig() {
                    try {
                        const response = await fetchWithTimeout('/api/v1/config');
                        const config = await response.json();
                        document.getElementById('testSetDir').value = config.test_set_dir || '';
                        this._lastTestSetDir = config.test_set_dir || '';
                        document.getElementById('apiKey').value = config.api_key || '';
                        document.getElementById('baseUrl').value = config.base_url || '';
                        const setSlider = (id, val) => {
                            const container = document.getElementById('modal-' + id);
                            const input = document.getElementById('modal-' + id + 'Input');
                            if (container) {
                                const native = container.querySelector('.slider-native');
                                if (native) {
                                    const min = input && input.min !== '' ? parseFloat(input.min) : parseFloat(native.min);
                                    const max = input && input.max !== '' ? parseFloat(input.max) : parseFloat(native.max);
                                    const num = isNaN(val) ? min : parseFloat(val);
                                    const clamped = Math.round(Math.min(max, Math.max(min, num)) / parseFloat(native.step)) * parseFloat(native.step);
                                    native.value = clamped;
                                    val = clamped;
                                }
                            }
                            if (input) input.value = val;
                            this.updateSliderVisual(id);
                        };
                        setSlider('temperature', config.temperature ?? 0.7);
                        setSlider('concurrency', config.concurrency ?? 1);
                        setSlider('testCount', config.test_count ?? 1);
                        setSlider('maxRetries', config.max_retries ?? 3);
                        setSlider('contextSize', config.context_size ?? 8192);
                        setSlider('topP', config.top_p ?? 1.0);
                        setSlider('topK', config.top_k ?? 40);
                        setSlider('minP', config.min_p ?? 0.05);
                        document.getElementById('modal-streaming').checked = config.streaming === true;
                        document.getElementById('autoAppendV1').checked = config.auto_append_v1 !== false;
                        document.getElementById('anthropicMode').checked = config.anthropic_mode === true;
                        document.getElementById('forceOpenAIEndpoint').checked = config.force_openai_endpoint === true;
                        document.getElementById('autoConnectToggle').checked = config.auto_connect !== false;
                        if (config.api_key) { this.loadModels(); }
                        if (config.models && Array.isArray(config.models)) {
                            this.selectedModels = config.models;
                            document.getElementById('selectedModelCount').textContent = this.selectedModels.length;
                        }
                        if (config.model_thinking_config) {
                            this._modelThinkingConfig = JSON.parse(JSON.stringify(config.model_thinking_config));
                        }
                        const disabled = config.disabled_params || ['contextSize', 'topP', 'minP', 'topK'];
                        ['temperature', 'contextSize', 'topP', 'minP', 'topK'].forEach(p => {
                            const dot = document.querySelector(`[data-dot="${p}"]`);
                            const group = dot?.closest('.slider-group');
                            if (disabled.includes(p)) {
                                if (dot) dot.classList.remove('on');
                                if (group) group.classList.add('disabled');
                                const native = group?.querySelector('.slider-native');
                                const input = group?.querySelector('.stepper-value');
                                if (native) native.disabled = true;
                                if (input) input.disabled = true;
                            } else {
                                if (dot) dot.classList.add('on');
                            }
                        });
                    } catch (error) {
                        handleError('loadConfig', error);
                    }
                },

                onCanvasResize() { this.renderLines(); },
                debouncedCanvasResize: debounce(function() { this.renderLines(); this.updateCoordDisplay(); }, 150),
                debouncedConfigChange: debounce(function() { this.onConfigChange(); }, 500),
                debouncedAutoSave: debounce(function() { this.saveCanvas(); }, 200)
            };

            function _bindEvents() {
                const byId = (id) => document.getElementById(id);
                const on = (el, ev, fn) => { if (el) el.addEventListener(ev, fn); };

                on(byId('setFilterBtn'), 'click', () => App.toggleSetFilterPanel());
                on(byId('promptSearch'), 'input', debounce(() => App.renderPromptList(), 300));
                on(byId('questionSearch'), 'input', debounce(() => App.renderQuestionList(), 300));
                on(byId('testSetDir'), 'blur', () => App.onTestSetDirChange());
                on(byId('baseUrl'), 'blur', () => App.onBaseUrlBlur());
                on(byId('resultFilterText'), 'input', debounce(() => App.applyStreamFilter(), 300));
                on(byId('paramsToggle'), 'click', () => App.toggleParamsModal());
                on(byId('openModelBtn'), 'click', () => App.openModelModal());
                on(byId('runBtn'), 'click', () => App.runTests());
                on(byId('stopBtn'), 'click', () => App.stopTests());
                on(byId('canvasUndoBtn'), 'click', () => App.canvasUndo());
                on(byId('canvasRedoBtn'), 'click', () => App.canvasRedo());
                on(byId('historyRetryBtn'), 'click', () => App.retryLoadHistory());
                on(byId('modal-streaming'), 'change', () => App.onConfigChange());
                on(byId('autoConnectToggle'), 'change', () => App.onConfigChange());

                const streamContent = byId('aiStreamContent');
                if (streamContent) {
                    on(streamContent, 'scroll', () => {
                        if (streamContent.scrollTop + streamContent.clientHeight >= streamContent.scrollHeight - 30) {
                            App._userScrolledAway = false;
                        } else {
                            App._userScrolledAway = true;
                        }
                    });
                }

                $$('[data-action]').forEach(el => {
                    const action = el.dataset.action;
                    const param = el.dataset.param;
                    if (typeof App[action] === 'function') {
                        on(el, 'click', (e) => param !== undefined ? App[action](param) : App[action](e));
                    }
                });

                $$('[data-dialog]').forEach(el => {
                    const dialog = el.dataset.dialog;
                    const result = el.dataset.result;
                    if (dialog === 'confirm') {
                        on(el, 'click', () => App._confirmResult(result === 'true'));
                    } else if (dialog === 'prompt') {
                        on(el, 'click', () => App._promptResult(result === 'true'));
                    }
                });

                $$('[data-stepper]').forEach(el => {
                    const param = el.dataset.stepper;
                    const delta = parseFloat(el.dataset.delta);
                    on(el, 'click', () => App.stepperChange(param, delta));
                });

                $$('.slider-native[data-slider]').forEach(el => {
                    const param = el.dataset.slider;
                    on(el, 'input', () => App.onModalSliderChange(param, el.value));
                    on(el, 'change', () => App.onModalSliderCommit(param, el.value));
                });

                $$('.stepper-value[id^="modal-"][id$="Input"]').forEach(el => {
                    const param = el.id.slice(6, -5);
                    on(el, 'change', () => App.onModalNumberChange(param, el.value));
                });

                on(byId('paramsExpandBar'), 'click', function() {
                    const content = byId('paramsExpandContent');
                    const bar = byId('paramsExpandBar');
                    if (content.classList.contains('open')) {
                        content.classList.remove('open');
                        bar.classList.remove('open');
                    } else {
                        content.classList.add('open');
                        bar.classList.add('open');
                    }
                });
                $$('.dot-toggle').forEach(el => {
                    on(el, 'click', function(e) {
                        e.stopPropagation();
                        const param = this.dataset.dot;
                        const group = this.closest('.slider-group');
                        this.classList.toggle('on');
                        group.classList.toggle('disabled');
                        const native = group.querySelector('.slider-native');
                        const input = group.querySelector('.stepper-value');
                        if (native) native.disabled = group.classList.contains('disabled');
                        if (input) input.disabled = group.classList.contains('disabled');
                        App.debouncedConfigChange();
                    });
                });
                on(byId('paramsModal'), 'click', function(e) {
                    if (e.target === this) App.toggleParamsModal();
                });
                const pm = byId('paramsModal');
                if (pm) {
                    const pmClose = pm.querySelector('.params-modal-close');
                    if (pmClose) on(pmClose, 'click', () => App.toggleParamsModal());
                }

                on(byId('ts-confirm'), 'click', () => App._confirmThinkingModal());
                on(byId('ts-cancel'), 'click', () => App._cancelThinkingModal());
                on(byId('thinkingSubmodalOverlay'), 'click', function(e) {
                    if (e.target === this) App._cancelThinkingModal();
                });

                on(byId('modelModal'), 'click', function(e) {
                    if (e.target === this) App.closeModelModal();
                });
                const mm = byId('modelModal');
                if (mm) {
                    const mmClose = mm.querySelector('.model-modal-close');
                    if (mmClose) on(mmClose, 'click', () => App.closeModelModal());
                    const mmBtns = mm.querySelectorAll('.model-modal-footer .btn');
                    if (mmBtns.length >= 2) {
                        on(mmBtns[0], 'click', () => App.closeModelModal());
                        on(mmBtns[1], 'click', () => App.confirmModelSelection());
                    }
                }

                document.addEventListener('mousemove', function(e) {
                    if (App.isDragging) return;
                    if (App.canvasBoxState) {
                        const wp = App.getWorldPos(e.clientX, e.clientY);
                        App.canvasBoxState.curX = wp.x;
                        App.canvasBoxState.curY = wp.y;
                        const lx = Math.min(App.canvasBoxState.startX, wp.x);
                        const ly = Math.min(App.canvasBoxState.startY, wp.y);
                        const rx = Math.max(App.canvasBoxState.startX, wp.x);
                        const ry = Math.max(App.canvasBoxState.startY, wp.y);
                        const overlay = document.getElementById('boxSelectOverlay');
                        if (overlay) {
                            overlay.style.left = (lx * App.scale + App.panX) + 'px';
                            overlay.style.top = (ly * App.scale + App.panY) + 'px';
                            overlay.style.width = ((rx - lx) * App.scale) + 'px';
                            overlay.style.height = ((ry - ly) * App.scale) + 'px';
                        }
                    }
                    if (App.canvasPanState) {
                        App.closeAllSelectors();
                        App.panX = App.canvasPanState.origPanX + (e.clientX - App.canvasPanState.startX);
                        App.panY = App.canvasPanState.origPanY + (e.clientY - App.canvasPanState.startY);
                        App.clampPan();
                        App.applyViewTransform();
                    }
                });

                document.addEventListener('mouseup', function() {
                    if (App.canvasPanState) {
                        const c = document.getElementById('comfyCanvasContainer');
                        if (c) c.classList.remove('grabbing');
                        App.canvasPanState = null;
                    }
                    if (App.canvasBoxState) {
                        App.finalizeBoxSelect();
                    }
                });

                document.addEventListener('click', function(e) {
                    const selLb = e.target.closest('[data-sel-lb]');
                    if (selLb) {
                        e.stopPropagation();
                        App._showSelectorThinkingPopup(selLb);
                        return;
                    }
                    const selItem = e.target.closest('.comfy-sel-item');
                    if (selItem) {
                        const nodeId = selItem.dataset.nodeId;
                        const type = selItem.dataset.type;
                        const idx = parseInt(selItem.dataset.index, 10);
                        App.onSelectorPick(nodeId, type, idx);
                        return;
                    }
                    const clearBtn = e.target.closest('[data-clear]');
                    if (clearBtn) {
                        e.stopPropagation();
                        App.clearNodeValue(clearBtn.dataset.clear);
                        return;
                    }
                    const removeBtn = e.target.closest('[data-remove]');
                    if (removeBtn) {
                        App.removeNode(removeBtn.dataset.remove);
                        return;
                    }
                    const selectorBody = e.target.closest('[data-selector]');
                    if (selectorBody) {
                        const nid = selectorBody.dataset.selector;
                        const ntype = selectorBody.dataset.selectorType;
                        App.openNodeSelector(nid, ntype);
                        return;
                    }
                    const setChip = e.target.closest('[data-ts]');
                    if (setChip) {
                        const name = setChip.dataset.ts;
                        if (name !== undefined) App.toggleSetFilter(name);
                        return;
                    }
                    const tagChip = e.target.closest('[data-tag]');
                    if (tagChip) {
                        const tag = tagChip.dataset.tag;
                        if (tag !== undefined) App.toggleTagFromFilter(tag);
                        return;
                    }
                    const dropOpt = e.target.closest('[data-dropdown]');
                    if (dropOpt) {
                        const id = dropOpt.dataset.dropdown;
                        const val = dropOpt.dataset.value;
                        const label = dropOpt.dataset.label || val;
                        App.selectDropdownOption(id, val, label);
                        return;
                    }
                    if (!e.target.closest('.comfy-sel-popup') && !e.target.closest('.comfy-node-body') && !e.target.closest('.comfy-socket') && !e.target.closest('.custom-select') && !e.target.closest('.thinking-popup')) {
                        App.closeAllSelectors();
                        document.querySelectorAll('.custom-select-dropdown.show').forEach(d => {
                            d.classList.remove('show');
                            d.previousElementSibling?.classList.remove('open');
                        });
                    }
                });

                document.addEventListener('mousedown', function(e) {
                    const dragHeader = e.target.closest('[data-drag]');
                    if (dragHeader) {
                        e.preventDefault();
                        App.startNodeDrag(e, dragHeader.dataset.drag);
                        return;
                    }
                    const socket = e.target.closest('.comfy-socket');
                    if (socket) {
                        e.stopPropagation();
                        const nodeId = socket.dataset.node;
                        const type = socket.dataset.type;
                        const dir = socket.dataset.dir;
                        const typeClass = socket.classList.contains('s-prompt') ? 'prompt' :
                            socket.classList.contains('s-question') ? 'question' : 'model';
                        App.startSocketDrag(e, nodeId, type, dir, typeClass);
                        return;
                    }
                });

                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                        e.preventDefault();
                        App.canvasUndo();
                    } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
                        e.preventDefault();
                        App.canvasRedo();
                    }
                });
            }

            App.init();
        })();
    </script>
</body>
</html>
