                            fragment.appendChild(nodeEl);
                        }
                        nodeEl.className = 'comfy-node' + (this.selectedNodeIds.has(node.id) ? ' selected' : '') + (node._notFound ? ' model-not-found' : '');

                        const typeClass = node.type;
                        const label = { prompt: '提示词', question: '问题', model: '模型' } [node.type] || node
                            .type;
                        const icon = {
                            prompt: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
                            question: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
                            model: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 2 17 12 22 22 17 22 7 12 2"/><line x1="12" y1="22" x2="12" y2="2"/><line x1="2" y1="7" x2="22" y2="7"/></svg>'
                        } [node.type] || '';
                        const isAggregate = !!node.tag;
                        let bodyHtml;
                        if (isAggregate) {
                            bodyHtml =
                                `<span class="comfy-node-val">${self.escapeHtml(node.display || node.value || '')}</span><span class="comfy-node-clear" data-clear="${node.id}">×</span>`;
                        } else if (!node.value) {
                            bodyHtml = `<span class="comfy-node-empty">点击选择…</span>`;
                        } else {
                            const warnIcon = node._notFound ? '<span class="comfy-node-warn" title="该文件已不存在">⚠</span>' : '';
                            bodyHtml =
                                `<span class="comfy-node-val">${self.escapeHtml(node.value)}</span>${warnIcon}<span class="comfy-node-clear" data-clear="${node.id}">×</span>`;
                        }

                        const hasSocketIn = node.type === 'question' || node.type === 'model';
                        const hasSocketOut = node.type === 'prompt' || node.type === 'question';
                        const socketOutClass = node.type === 'prompt' ? 's-question' : 
                                               node.type === 'question' ? 's-model' : `s-${typeClass}`;
                        const socketInHtml = hasSocketIn ?
                            `<div class="comfy-socket in s-${typeClass}" data-node="${node.id}" data-type="${node.type}" data-dir="in"><div class="comfy-socket-inner"></div></div>` :
                            '';
                        const socketOutHtml = hasSocketOut ?
                            `<div class="comfy-socket out ${socketOutClass}" data-node="${node.id}" data-type="${node.type}" data-dir="out"><div class="comfy-socket-inner"></div></div>` :
                            '';
                        const closeBtnHtml =
                            `<div class="comfy-node-close" data-remove="${node.id}">&times;</div>`;

                        const ownColor = { prompt: '#4F8CFF', question: '#20C997', model: '#FBBF24' } [typeClass];
                        const outSocketColor = hasSocketOut ? { prompt: '#20C997', question: '#FBBF24' } [typeClass] : null;
                        const headerGradient = outSocketColor
                            ? `background:linear-gradient(160deg, ${ownColor} 0%, ${ownColor} 50%, ${outSocketColor} 100%);`
                            : '';

                        nodeEl.innerHTML = `
                        ${closeBtnHtml}
                        <div class="comfy-node-header ${typeClass}" ${headerGradient ? `style="${headerGradient}"` : ''} data-drag="${node.id}">${icon}${label}</div>
                        <div class="comfy-node-body" data-selector="${node.id}" data-selector-type="${node.type}">
                            ${bodyHtml}
                        </div>
                        ${socketInHtml}
                        ${socketOutHtml}
                    `;
                        nodesContainer.appendChild(nodeEl);
                    });

                    this.updateNodePositions();
                    this.renderLines();
                    if (center) {
                        if (this.canvasState.nodes.length > 0) {
                            requestAnimationFrame(() => this.centerCanvasOnNodes());
                        } else {
                            requestAnimationFrame(() => this.centerCanvasOnOrigin());
                        }
                    }

                    container.onmousedown = (e) => this.onCanvasMouseDown(e);
                    container.onwheel = (e) => this.onCanvasWheel(e);
                    container.oncontextmenu = () => false;
                    this.updateCoordDisplay();
                },

                onCanvasMouseDown(e) {
                    const container = document.getElementById('comfyCanvasContainer');
                    if (e.button === 0 && e.shiftKey) {
                        e.preventDefault();
                        if (this.canvasBoxState) {
                            this.finalizeBoxSelect();
                            return;
                        }
                        const wp = this.getWorldPos(e.clientX, e.clientY);
                        this.canvasBoxState = { startX: wp.x, startY: wp.y, curX: wp.x, curY: wp.y };
                        const overlay = document.getElementById('boxSelectOverlay');
                        overlay.style.display = 'block';
                    } else if (e.button === 0) {
                        this.canvasPanState = { startX: e.clientX, startY: e.clientY, origPanX: this.panX,
                            origPanY: this.panY };
                        container.classList.add('grabbing');
                    } else if (e.button === 1) {
                        e.preventDefault();
                        this.canvasPanState = { startX: e.clientX, startY: e.clientY, origPanX: this.panX,
                            origPanY: this.panY };
                        container.classList.add('grabbing');
                    }
                },

                finalizeBoxSelect() {
                    if (!this.canvasBoxState) return;
                    const lx = Math.min(this.canvasBoxState.startX, this.canvasBoxState.curX);
                    const ly = Math.min(this.canvasBoxState.startY, this.canvasBoxState.curY);
                    const rx = Math.max(this.canvasBoxState.startX, this.canvasBoxState.curX);
                    const ry = Math.max(this.canvasBoxState.startY, this.canvasBoxState.curY);
                    this.selectedNodeIds.clear();
                    this.canvasState.nodes.forEach(n => {
                        const nx = n.x || 0;
                        const ny = n.y || 0;
                        if (nx + this.NODE_W >= lx && nx <= rx && ny + 80 >= ly && ny <= ry) {
                            this.selectedNodeIds.add(n.id);
                        }
                    });
                    this.canvasBoxState = null;
                    const overlay = document.getElementById('boxSelectOverlay');
                    if (overlay) overlay.style.display = 'none';
                    this.renderAssociationCanvas({ center: false });
                },

                onCanvasWheel(e) {
                    e.preventDefault();
                    this.closeAllSelectors();
                    const container = document.getElementById('comfyCanvasContainer');
                    const rect = container.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    const oldScale = this.scale;
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    const newS = this.scale * delta;
                    if (newS < 0.15 || newS > 5) return;
                    this.scale = newS;
                    const worldMouseX = (mouseX - this.panX) / oldScale;
                    const worldMouseY = (mouseY - this.panY) / oldScale;
                    this.panX = mouseX - worldMouseX * this.scale;
                    this.panY = mouseY - worldMouseY * this.scale;
                    this.clampPan();
                    if (this.canvasPanState) {
                        this.canvasPanState.origPanX = this.panX;
                        this.canvasPanState.origPanY = this.panY;
                        this.canvasPanState.startX = e.clientX;
                        this.canvasPanState.startY = e.clientY;
                    }
                    if (this.dragState) {
                        const wp = this.getWorldPos(e.clientX, e.clientY);
                        this.dragState.startWorldX = wp.x;
                        this.dragState.startWorldY = wp.y;
                        for (const n of this.dragState.nodes) {
                            const cur = this.canvasState.nodes.find(nn => nn.id === n.id);
                            if (cur) { n.origX = cur.x; n.origY = cur.y; }
                        }
                    }
                    this.applyViewTransform();
                    this.renderLines();
                },

                _cancelSnapAnim(el) {
                    if (!el._snapAnim) return;
                    const anim = el._snapAnim;
                    anim.cancelled = true;
                    this._activeSnapAnims.delete(anim);
                    el._snapAnim = null;
                },

                // ── Frame-sequence snap animation ──
                _animateNodeToGrid(el, node, worldX, worldY) {
                    this._cancelSnapAnim(el);

                    const currentTransform = el.style.transform;
                    const match = currentTransform.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
                    const currentX = match ? parseFloat(match[1]) : worldX;
                    const currentY = match ? parseFloat(match[2]) : worldY;

                    if (node) { node.x = currentX; node.y = currentY; }

                    if (Math.abs(worldX - currentX) < 0.01 && Math.abs(worldY - currentY) < 0.01) {
                        el.style.transform = 'translate(' + worldX + 'px,' + worldY + 'px)';
                        if (node) { node.x = worldX; node.y = worldY; }
                        this.renderLines();
                        return;
                    }

                    const baseMs = 100;
                    const tailMs = 50;
                    const totalMs = baseMs + tailMs;
                    const sampleStepMs = 1;
                    const dx = worldX - currentX;
                    const dy = worldY - currentY;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const ux = dx / dist;
                    const uy = dy / dist;
                    const overshootAmount = 0.15;
                    const peakX = worldX + ux * dist * overshootAmount;
                    const peakY = worldY + uy * dist * overshootAmount;
                    const peakRatio = 0.5;

                    const frames = [];
                    for (let tMs = 0; tMs <= totalMs; tMs += sampleStepMs) {
                        let x, y;
                        if (tMs < baseMs) {
                            const t = tMs / baseMs;
                            x = currentX + dx * t;
                            y = currentY + dy * t;
                        } else if (tMs < totalMs) {
                            const tailT = (tMs - baseMs) / tailMs;
                            if (tailT <= peakRatio) {
                                const t = tailT / peakRatio;
                                x = worldX + (peakX - worldX) * t;
                                y = worldY + (peakY - worldY) * t;
                            } else {
                                const t = (tailT - peakRatio) / (1 - peakRatio);
                                x = peakX + (worldX - peakX) * t;
                                y = peakY + (worldY - peakY) * t;
                            }
                        } else {
                            x = worldX;
                            y = worldY;
                        }
                        frames.push({ x: x, y: y });
                    }

                    const animState = {
                        frames: frames,
                        frameIndex: 0,
                        startTime: null,
                        totalMs: totalMs,
                        targetX: worldX,
                        targetY: worldY,
                        cancelled: false,
                        node: node,
                        el: el,
                        dirty: false
                    };
                    el._snapAnim = animState;

                    this._activeSnapAnims.add(animState);
                    if (this._snapDataInterval === null) {
                        const intervalMs = 1000 / this._snapDataHz;
                        this._snapDataInterval = setInterval(this._snapDataTick, intervalMs);
                    }
                    if (this._snapRenderRaf === null) {
                        this._snapRenderRaf = requestAnimationFrame(this._snapRenderTick);
                    }
                },

                _snapDataTick: function() {
                    const self = window.App;
                    if (self._activeSnapAnims.size === 0) {
                        clearInterval(self._snapDataInterval);
                        self._snapDataInterval = null;
                        return;
                    }
                    const now = performance.now();
                    const sampleStepMs = 1;
                    const snapshot = Array.from(self._activeSnapAnims);
                    for (const anim of snapshot) {
                        if (anim.cancelled) {
                            self._activeSnapAnims.delete(anim);
                            continue;
                        }
                        if (anim.startTime === null) {
                            anim.startTime = now;
                        }
                        const elapsed = now - anim.startTime;
                        const idx = Math.floor(elapsed / sampleStepMs);
                        if (idx >= anim.frames.length) {
                            if (anim.node) {
                                anim.node.x = anim.targetX;
                                anim.node.y = anim.targetY;
                            }
                            anim.frameIndex = anim.frames.length;
                            anim.dirty = true;
                            anim.el._snapAnim = null;
                            self._activeSnapAnims.delete(anim);
                            continue;
                        }
                        const f = anim.frames[idx];
                        if (anim.node) {
                            anim.node.x = f.x;
                            anim.node.y = f.y;
                        }
                        anim.frameIndex = idx;
                        anim.dirty = true;
                    }
                },

                _snapRenderTick: function() {
                    const self = window.App;
                    self._snapRenderRaf = null;
                    let anyDirty = false;
                    const snapshot = Array.from(self._activeSnapAnims);
                    for (const anim of snapshot) {
                        if (anim.cancelled) continue;
                        if (!anim.dirty) continue;
                        const el = anim.el;
                        const x = anim.node ? anim.node.x : anim.targetX;
                        const y = anim.node ? anim.node.y : anim.targetY;
                        el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
                        anim.dirty = false;
                        anyDirty = true;
                    }
                    if (anyDirty || self._activeSnapAnims.size > 0) {
                        self.renderLines();
                    }
                    if (self._activeSnapAnims.size > 0) {
                        self._snapRenderRaf = requestAnimationFrame(self._snapRenderTick);
                    }
                },

                startNodeDrag(e, nodeId) {
                    e.preventDefault();
                    e.stopPropagation();
                    this.canvasPanState = null;

                    if (!this.selectedNodeIds.has(nodeId)) this.selectedNodeIds.clear();

                    const nodeEl = document.querySelector(`.comfy-node[data-node-id="${nodeId}"]`);
                    if (!nodeEl) return;
                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;

                    document.querySelectorAll('.comfy-node').forEach(el => {
                        el.style.transition = 'none';
                        this._cancelSnapAnim(el);
                    });

                    const wp = this.getWorldPos(e.clientX, e.clientY);

                    const nodesToDrag = [];
                    if (this.selectedNodeIds.size > 1 && this.selectedNodeIds.has(nodeId)) {
                        this.selectedNodeIds.forEach(sid => {
                            const sn = this.canvasState.nodes.find(nn => nn.id === sid);
                            if (sn) nodesToDrag.push({ id: sid, origX: sn.x || 0, origY: sn.y || 0 });
                        });
                    } else {
                        nodesToDrag.push({ id: nodeId, origX: node.x || 0, origY: node.y || 0 });
                    }

                    this.dragState = { nodeId, startWorldX: wp.x, startWorldY: wp.y, nodes: nodesToDrag };
                    this.isDragging = true;
                    nodeEl.classList.add('dragging');
                    const self = this;
                    let dragRafId = null;

                    function onMove(e2) {
                        if (!self.dragState) return;
                        if (dragRafId) return;
                        dragRafId = requestAnimationFrame(() => {
                            dragRafId = null;
                            const wp2 = self.getWorldPos(e2.clientX, e2.clientY);
                            const dx = wp2.x - self.dragState.startWorldX;
                            const dy = wp2.y - self.dragState.startWorldY;
                            for (const n of self.dragState.nodes) {
                                const nodeObj = self.canvasState.nodes.find(nn => nn.id === n.id);
                                const newX = n.origX + dx, newY = n.origY + dy;
                                if (nodeObj) { nodeObj.x = newX; nodeObj.y = newY; }
                                const el = document.querySelector(`.comfy-node[data-node-id="${n.id}"]`);
                                if (el) el.style.transform = 'translate(' + newX + 'px,' + newY + 'px)';
                            }
                            self.renderLines();
                        });
                    }

                    function onUp() {
                        let positionChanged = false;
                        if (dragRafId) { cancelAnimationFrame(dragRafId); dragRafId = null; }
                        // Phase 1: compute snapped positions, update data model for all nodes
                        const snapInfos = [];
                        if (self.dragState && self.dragState.nodes) {
                            for (const n of self.dragState.nodes) {
                                const nodeObj = self.canvasState.nodes.find(nn => nn.id === n.id);
                                if (!nodeObj) continue;
                                const visualX = nodeObj.x;
                                const visualY = nodeObj.y;
                                const snappedX = nodeObj.type === 'model'
                                    ? Math.round((visualX + self.NODE_W) / self.GRID) * self.GRID - self.NODE_W
                                    : nodeObj.type === 'question'
                                    ? Math.round((visualX - 0.25 * self.GRID) / self.GRID) * self.GRID + 0.25 * self.GRID
                                    : Math.round(visualX / self.GRID) * self.GRID;
                                const snappedY = Math.round(visualY / self.GRID) * self.GRID;
                                const nodeChanged = snappedX !== visualX || snappedY !== visualY;
                                if (nodeChanged) positionChanged = true;
                                nodeObj.x = snappedX;
                                nodeObj.y = snappedY;
                                const el = document.querySelector(`.comfy-node[data-node-id="${n.id}"]`);
                                if (el) el.classList.remove('dragging');
                                snapInfos.push({ el, nodeObj, snappedX, snappedY, changed: nodeChanged });
                            }
                        }
                        // Phase 2: save snapshot with all nodes at consistent snapped positions
                        if (positionChanged) {
                            self.saveCanvasSnapshot();
                        }
                        // Phase 3: update DOM / start animations
                        for (const info of snapInfos) {
                            if (!info.el) continue;
                            if (info.changed) {
                                self._animateNodeToGrid(info.el, info.nodeObj, info.snappedX, info.snappedY);
                            } else {
                                info.el.style.transform = 'translate(' + info.snappedX + 'px,' + info.snappedY + 'px)';
                            }
                        }
                        self.dragState = null;
                        self.isDragging = false;
                        document.querySelectorAll('.comfy-node').forEach(el => { el.style.transition = ''; });
                        self.renderLines();
                        if (positionChanged) {
                            self.debouncedAutoSave();
                        }
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                    }

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                },

                startSocketDrag(e, nodeId, type, dir, typeClass) {
                    e.preventDefault();
                    const container = document.getElementById('comfyCanvasContainer');
                    const nodeEl = container.querySelector(`.comfy-node[data-node-id="${nodeId}"]`);
                    if (!nodeEl) return;
                    const fromSocket = nodeEl.querySelector(`.comfy-socket.${dir}`);
                    if (fromSocket) fromSocket.classList.add('dragging');

                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    this.socketDragState = { nodeId, type, dir, typeClass };
                    const self = this;
                    let rafId = null;

                    function onMove(e2) {
                        if (!self.socketDragState) return;
                        if (rafId) cancelAnimationFrame(rafId);
                        rafId = requestAnimationFrame(() => {
                            const x1 = (node.x || 0) + (dir === 'out' ? self.NODE_W : 0);
                            const y1 = (node.y || 0) + 40;
                            const wp = self.getWorldPos(e2.clientX, e2.clientY);
                            const dx2 = Math.abs(wp.x - x1) * 0.5;
                            self.socketDragState.tempLine =
                                `M${x1},${y1} C${x1 + dx2},${y1} ${wp.x - dx2},${wp.y} ${wp.x},${wp.y}`;
                            self.renderLines();
                            rafId = null;
                        });
                    }

                    function onUp(e2) {
                        let connectionAdded = false;
                        const target = document.elementFromPoint(e2.clientX, e2.clientY);
                        const socket = target ? target.closest('.comfy-socket') : null;
                        if (socket) {
                            const toNodeId = socket.dataset.node;
                            const toDir = socket.dataset.dir;
                            if (toNodeId !== nodeId && dir !== toDir) {
                                let fromId, toId;
                                if (dir === 'out' && toDir === 'in') {
                                    fromId = nodeId; toId = toNodeId;
                                } else if (dir === 'in' && toDir === 'out') {
                                    fromId = toNodeId; toId = nodeId;
                                } else {
                                    fromId = null;
                                }
                                if (fromId) {
                                    const fromNode = self.canvasState.nodes.find(n => n.id === fromId);
                                    const toNode = self.canvasState.nodes.find(n => n.id === toId);
                                    const fromType = fromNode ? fromNode.type : null;
                                    const toType = toNode ? toNode.type : null;

                                    const isValid = 
                                        (fromType === 'prompt' && toType === 'question') ||
                                        (fromType === 'question' && toType === 'model');

                                    if (!isValid) {
                                        showToast('无效连接：' + 
                                            (fromType === 'prompt' ? '提示词' : '问题') + ' → ' + 
                                            (toType === 'model' ? '模型' : '问题') + ' 不被允许', 'warning');
                                    } else {
                                        if (self.selectedNodeIds.size > 0 && self.selectedNodeIds.has(fromId)) {
                                            self.selectedNodeIds.forEach(sid => {
                                                const sNode = self.canvasState.nodes.find(n => n.id === sid);
                                                if (!sNode) return;
                                                const pairValid = 
                                                    (sNode.type === 'prompt' && toType === 'question') ||
                                                    (sNode.type === 'question' && toType === 'model');
                                                if (!pairValid) return;
                                                const exists = self.canvasState.connections.some(c => c.from === sid && c.to === toId);
                                                if (!exists) {
                                                    self.canvasState.connections.push({ from: sid, to: toId, _manual: true });
                                                    connectionAdded = true;
                                                }
                                            });
                                        } else {
                                            const exists = self.canvasState.connections.some(c => c.from === fromId && c.to === toId);
                                            if (!exists) {
                                                self.canvasState.connections.push({ from: fromId, to: toId, _manual: true });
                                                connectionAdded = true;
                                            }
                                        }
                                    }
                                }
                            }
                        }
                        if (fromSocket) fromSocket.classList.remove('dragging');
                        self.socketDragState = null;
                        self.renderLines();
                        if (connectionAdded) self.saveCanvasSnapshot();
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                    }

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                },

                async openNodeSelector(nodeId, type) {
                    this.closeAllSelectors();
                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;

                    let items = [], groupData, groupKeyList;
                    if (type === 'prompt') {
                        this._markMissingPromptQuestions();
                        this.renderAssociationCanvas({ center: false });
                        const prompts = node.tag ? this.prompts.filter(p => (p.testSet || '未分类') === node.tag) : this.prompts;
                        const groups = {};
                        const allByTestSet = {};
                        for (const p of prompts) {
                            const ts = p.testSet || '未知';
                            const tag = p.tag || '未分类';
                            const key = `${ts} - ${tag}`;
                            if (!groups[key]) groups[key] = { testSet: ts, tag, items: [] };
                            groups[key].items.push(p);
                            if (!allByTestSet[ts]) allByTestSet[ts] = [];
                            allByTestSet[ts].push(p);
                        }
                        for (const [ts, items] of Object.entries(allByTestSet)) {
                            const allKey = `${ts} - 全部`;
                            if (!groups[allKey]) groups[allKey] = { testSet: ts, tag: '全部', items };
                        }
                        const groupKeys = Object.keys(groups).sort((a, b) => {
                            const [tsA, tagA] = a.split(' - ');
                            const [tsB, tagB] = b.split(' - ');
                            const aIsAll = tagA === '全部';
                            const bIsAll = tagB === '全部';
                            if (aIsAll && !bIsAll) return -1;
                            if (!aIsAll && bIsAll) return 1;
                            if (tsA !== tsB) return tsA.localeCompare(tsB);
                            return tagA.localeCompare(tagB);
                        });
                        groupData = groups;
                        groupKeyList = groupKeys;
                        items = groupKeys.map(key => `${key} (${groups[key].items.length}个)`);
                    } else if (type === 'question') {
                        this._markMissingPromptQuestions();
                        this.renderAssociationCanvas({ center: false });
                        const questions = node.tag ? this.questions.filter(q => (q.testSet || '未分类') === node.tag) : this.questions;
                        const groups = {};
                        const allByTestSet = {};
                        for (const q of questions) {
                            const ts = q.testSet || '未知';
                            const tag = q.tag || '未分类';
                            const key = `${ts} - ${tag}`;
                            if (!groups[key]) groups[key] = { testSet: ts, tag, items: [] };
                            groups[key].items.push(q);
                            if (!allByTestSet[ts]) allByTestSet[ts] = [];
                            allByTestSet[ts].push(q);
                        }
                        for (const [ts, items] of Object.entries(allByTestSet)) {
                            const allKey = `${ts} - 全部`;
                            if (!groups[allKey]) groups[allKey] = { testSet: ts, tag: '全部', items };
                        }
                        const groupKeys = Object.keys(groups).sort((a, b) => {
                            const [tsA, tagA] = a.split(' - ');
                            const [tsB, tagB] = b.split(' - ');
                            const aIsAll = tagA === '全部';
                            const bIsAll = tagB === '全部';
                            if (aIsAll && !bIsAll) return -1;
                            if (!aIsAll && bIsAll) return 1;
                            if (tsA !== tsB) return tsA.localeCompare(tsB);
                            return tagA.localeCompare(tagB);
                        });
                        groupData = groups;
                        groupKeyList = groupKeys;
                        items = groupKeys.map(key => `${key} (${groups[key].items.length}个)`);
                    } else if (type === 'model') {
                        if (this.availableModels.length === 0 || (node.value && !this.availableModels.includes(node.value))) {
                            await this.loadModels();
                        }
                        this._markMissingModels();
                        this.renderAssociationCanvas({ center: false });
                        items = this.availableModels;
                    }

                    const block = document.querySelector(`.comfy-node[data-node-id="${nodeId}"] .comfy-node-body`);
                    if (!block) return;

                    const popup = document.createElement('div');
                    if (groupData) {
                        popup._groups = groupData;
                        popup._groupKeys = groupKeyList;
                    }
                    popup.className = 'comfy-sel-popup';
                    if (items.length === 0) {
                        popup.innerHTML =
                            '<div style="padding:10px;color:#bbb;font-size:11px;text-align:center">暂无可用选项</div>';
                    } else {
                        popup.innerHTML = items.map((item, idx) => {
                            const sel = node.value === item;
                            const lbActive = type === 'model' && this._modelThinkingConfig[item]?.thinking?.type === 'enabled';
                            const lb = type === 'model' ? `<button class="model-lightbulb-btn ${lbActive ? 'active' : ''}" data-sel-lb="${nodeId}" data-sel-model="${this.escapeHtml(item)}" title="推理设置">
                                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
                            </button>` : '';
                            return `<div class="comfy-sel-item ${sel ? 'picked' : ''}" data-node-id="${nodeId}" data-type="${type}" data-index="${idx}"><span>${this.escapeHtml(item)}</span>${lb}</div>`;
                        }).join('');
                        popup._items = items;
                    }
                    const rect = block.getBoundingClientRect();
                    popup.style.position = 'fixed';
                    let top = rect.bottom + 4;
                    let left = rect.left;
                    const popupH = Math.min(220, items.length * 32 + 8);
                    const popupW = Math.max(180, rect.width);
                    if (top + popupH > window.innerHeight) {
                        top = rect.top - popupH - 4;
                    }
                    if (left + popupW > window.innerWidth) {
                        left = window.innerWidth - popupW - 8;
                    }
                    popup.style.top = top + 'px';
                    popup.style.left = left + 'px';
                    popup.style.minWidth = popupW + 'px';
                    document.body.appendChild(popup);
                },

                onSelectorPick(nodeId, type, index) {
                    const popup = document.querySelector('.comfy-sel-popup');
                    const groups = popup._groups;
                    const groupKeys = popup._groupKeys;
                    if (groups && groupKeys && index < groupKeys.length) {
                        const key = groupKeys[index];
                        const group = groups[key];
                        this.saveUndoSnapshot();
                        if (type === 'prompt') {
                            const anySelected = group.items.some(p => this.selectedPrompts.has(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`));
                            if (anySelected) {
                                group.items.forEach(p => {
                                    this.selectedPrompts.delete(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                                    this.autoDeselectQuestions(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                                });
                            } else {
                                group.items.forEach(p => {
                                    const pk = `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`;
                                    this.selectedPrompts.add(pk);
                                    this.autoSelectQuestions(pk);
                                });
                            }
                        } else if (type === 'question') {
                            const anySelected = group.items.some(q => this.selectedQuestions.has(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`));
                            if (anySelected) {
                                group.items.forEach(q => this.selectedQuestions.delete(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`));
                            } else {
                                group.items.forEach(q => this.selectedQuestions.add(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`));
                            }
                        }
                        this.renderPromptList();
                        this.renderQuestionList();
                        this.syncCanvasFromSelection();
                        this._saveSelectionToLocalStorage();
                        this.closeAllSelectors();
                        this.renderAssociationCanvas({ center: false });
                        this.saveCanvasSnapshot();
                        return;
                    }
                    const items = popup._items;
                    if (!items || index >= items.length) return;
                    const value = items[index];
                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    const oldValue = node.value;
                    if (oldValue === value) return;
                    node.value = value;
                    if (type === 'model') {
                        if (oldValue) {
                            const oldIdx = this.selectedModels.indexOf(oldValue);
                            if (oldIdx !== -1) this.selectedModels.splice(oldIdx, 1);
                        }
                        if (!this.selectedModels.includes(value)) {
                            this.selectedModels.push(value);
                        }
                        this.persistSelectedModels();
                        this.updateSelectedModelCount();
                        this.autoConnectCanvas();
                    }
                    this.closeAllSelectors();
                    this.renderAssociationCanvas({ center: false });
                    this.saveCanvasSnapshot();
                },

                clearNodeValue(nodeId) {
                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    if (node.tag) {
                        const tag = node.tag;
                        if (node.type === 'prompt') {
                            this.prompts.forEach(p => {
                                if ((p.testSet || '未分类') === tag) {
                                    const pk = `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`;
                                    this.selectedPrompts.delete(pk);
                                    this.autoDeselectQuestions(pk);
                                }
                            });
                            this._saveSelectionToLocalStorage();
                            this.renderPromptList();
                            this.renderQuestionList();
                        } else if (node.type === 'question') {
                            this.questions.forEach(q => {
                                if ((q.testSet || '未分类') === tag) {
                                    this.selectedQuestions.delete(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`);
                                }
                            });
                            this._saveSelectionToLocalStorage();
                            this.renderQuestionList();
                        }
                        // 转为普通空节点，保留在画布上
                        delete node.tag;
                        delete node.testSet;
                        delete node.count;
                        delete node.display;
                        node.value = '';
                        this.autoConnectCanvas();
                        this.renderAssociationCanvas({ center: false });
                        this.saveCanvasSnapshot();
                        return;
                    }
                    if (node.type === 'prompt') {
                        if (node.value) {
                            const p = this.prompts.find(pr => `${pr.testSet || ''} ${pr.tag || ''} #${pr.id}` === node.value);
                            if (p) this.selectedPrompts.delete(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                        }
                        this.selectedPrompts.delete(nodeId);
                        this._saveSelectionToLocalStorage();
                        this.renderPromptList();
                        node.value = '';
                        this.autoConnectCanvas();
                        this.renderAssociationCanvas({ center: false });
                        this.saveCanvasSnapshot();
                    } else if (node.type === 'question') {
                        if (node.value) {
                            const q = this.questions.find(qu => `${qu.testSet || ''} ${qu.tag || ''} #${qu.id}` === node.value);
                            if (q) this.selectedQuestions.delete(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`);
                        }
                        this.selectedQuestions.delete(nodeId);
                        this._saveSelectionToLocalStorage();
                        this.renderQuestionList();
                        node.value = '';
                        this.autoConnectCanvas();
                        this.renderAssociationCanvas({ center: false });
                        this.saveCanvasSnapshot();
                    } else if (node.type === 'model' && node.value) {
                        const idx = this.selectedModels.indexOf(node.value);
                        if (idx !== -1) { this.selectedModels.splice(idx, 1); }
                        node.value = '';
                        this.persistSelectedModels();
                        this.updateSelectedModelCount();
                        this.autoConnectCanvas();
                        this.renderAssociationCanvas({ center: false });
                        this.saveCanvasSnapshot();
                    }
                },

                closeAllSelectors() {
                    document.querySelectorAll('.comfy-sel-popup').forEach(el => el.remove());
                    document.querySelectorAll('.thinking-popup').forEach(el => el.remove());
                    document.querySelectorAll('.custom-select-dropdown').forEach(el => {
                        el.classList.remove('show');
                        el.style.display = '';
                    });
                    document.querySelectorAll('.custom-select-trigger.open').forEach(el => el.classList.remove('open'));
                },

                async _fetchModels() {
                    const response = await fetchWithTimeout('/api/v1/models', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ api_key: document.getElementById('apiKey').value })
                    });
                    if (!response.ok) {
                        const text = await response.text();
                        throw new Error('API错误: ' + response.status + ' - ' + text);
                    }
                    const models = await response.json();
                    this.availableModels = models.map(m => m.id);
                    return this.availableModels;
                },

                async loadModels() {
                    try {
                        await this._fetchModels();
                    } catch (e) { handleError('loadModels', e); }
                },

                openModelModal() {
                    const btn = document.getElementById('openModelBtn');
                    if (btn.disabled) return;
                    btn.disabled = true;
                    btn.classList.add('btn-loading');
                    this._fetchModels()
                        .then(() => {
                            this.selectedModels = this.selectedModels.filter(m => this.availableModels.includes(m));
                            Object.keys(this._modelThinkingConfig).forEach(k => {
                                if (!this.availableModels.includes(k)) delete this._modelThinkingConfig[k];
                            });
                            this._markMissingModels();
                            this.renderAssociationCanvas({ center: false });
                            this._savedSelectedModels = JSON.parse(JSON.stringify(this.selectedModels));
                            this._savedModelThinkingConfig = JSON.parse(JSON.stringify(this._modelThinkingConfig));
                            this.renderModelCheckboxList();
                            document.getElementById('modelModal').classList.add('show');
                        })
                        .catch(error => { handleError('openModelModal', error); })
                        .finally(() => {
                            btn.disabled = false;
                            btn.classList.remove('btn-loading');
                        });
                },

                async refreshModels() {
                    const btn = document.querySelector('[data-action="refreshModels"]');
                    if (btn && btn.disabled) return;
                    if (btn) { btn.disabled = true; btn.classList.add('btn-loading'); }
                    await this.onBaseUrlBlur();
                    this._fetchModels()
                        .then(() => {
                            this.selectedModels = this.selectedModels.filter(m => this.availableModels.includes(m));
                            Object.keys(this._modelThinkingConfig).forEach(k => {
                                if (!this.availableModels.includes(k)) delete this._modelThinkingConfig[k];
                            });
                            this._markMissingModels();
                            this.renderAssociationCanvas({ center: false });
                            showToast('模型列表已刷新，共 ' + this.availableModels.length + ' 个模型', 'success');
                        })
                        .catch(error => { handleError('refreshModels', error); })
                        .finally(() => {
                            if (btn) { btn.disabled = false; btn.classList.remove('btn-loading'); }
                        });
                },

                async persistSelectedModels() {
                    try {
                        await fetchWithTimeout('/api/v1/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ models: this.selectedModels })
                        });
                    } catch (e) { handleError('persistModels', e); }
                },

                confirmModelSelection() {
                    this.updateSelectedModelCount();
                    this._savedSelectedModels = null;
                    this._savedModelThinkingConfig = null;
                    document.getElementById('modelModal').classList.remove('show');
                    this.onConfigChange();
                },

                closeModelModal() {
                    if (this._savedSelectedModels) {
                        this.selectedModels = JSON.parse(JSON.stringify(this._savedSelectedModels));
                        this._savedSelectedModels = null;
                        if (this._savedModelThinkingConfig) {
                            this._modelThinkingConfig = JSON.parse(JSON.stringify(this._savedModelThinkingConfig));
                            this._savedModelThinkingConfig = null;
                        }
                        this.renderModelCheckboxList();
                    }
                    document.getElementById('modelModal').classList.remove('show');
                },

                renderModelCheckboxList() {
                    const container = document.getElementById('modelCheckboxList');
                    const missingSelected = this.selectedModels.filter(m => !this.availableModels.includes(m));
                    const warningHtml = missingSelected.length > 0
                        ? `<div style="padding:8px 12px;font-size:12px;color:#ef4444;background:#fef2f2;border-radius:6px;margin-bottom:8px;">${missingSelected.length} 个已选模型在当前 API 中不可用</div>`
                        : '';
                    container.innerHTML = warningHtml + this.availableModels.map(model => {
                        const index = this.selectedModels.indexOf(model);
                        const orderNum = index !== -1 ? index + 1 : null;
                        const thinkingActive = this._modelThinkingConfig[model]?.thinking?.type === 'enabled';
                        return `<div class="model-checkbox-item" data-model="${this.escapeHtml(model)}">
                        <span class="model-order-badge ${orderNum ? 'active' : ''}">${orderNum || ''}</span>
                        <span class="model-name">${this.escapeHtml(model)}</span>
                        <button class="model-lightbulb-btn ${thinkingActive ? 'active' : ''}" data-lb="${this.escapeHtml(model)}" title="推理设置">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/></svg>
                        </button>
                    </div>`;
                    }).join('');
                    container.querySelectorAll('.model-checkbox-item').forEach(el => {
                        el.addEventListener('click', (e) => {
                            if (e.target.closest('.model-lightbulb-btn')) return;
                            App.toggleModelSelection(el.dataset.model);
                        });
                    });
                    container.querySelectorAll('.model-lightbulb-btn').forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            App._openThinkingModal(btn.dataset.lb);
                        });
                    });
                },

                _openThinkingModal(model) {
                    this._thinkingModalModel = model;
                    const overlay = document.getElementById('thinkingSubmodalOverlay');
                    if (!overlay) return;
                    const cfg = this._modelThinkingConfig[model] || {};
                    const thinkingOn = cfg.thinking?.type === 'enabled';
                    const effortOn = !!cfg.reasoning_effort;
                    const effortVal = cfg.reasoning_effort || 'medium';
                    const showCustom = effortOn && !['low', 'medium', 'high', 'max'].includes(effortVal);
                    const presetValues = ['low', 'medium', 'high', 'max'];
                    const disabled = thinkingOn ? '' : 'disabled';
                    const effortStyle = thinkingOn ? '' : 'opacity:0.4;pointer-events:none;';
                    const body = overlay.querySelector('.thinking-submodal-body');
                    body.innerHTML = `<div style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text-primary)">推理设置 — ${this.escapeHtml(model)}</div>
                        <div class="thinking-row" style="margin-bottom:10px">
                            <span class="thinking-label">开启推理</span>
                            <label class="toggle-switch">
                                <input type="checkbox" id="ts-thinking" ${thinkingOn ? 'checked' : ''}>
                                <span class="toggle-track"></span>
                            </label>
                        </div>
                        <div class="thinking-row" style="margin-bottom:6px;${effortStyle}">
                            <span class="thinking-label">推理强度</span>
                        </div>
                        <div class="effort-options" id="ts-effort-options" style="${effortStyle}">
                            ${presetValues.map(v => `<button class="effort-option${effortOn && effortVal === v && !showCustom ? ' active' : ''}" data-value="${v}" ${disabled}>${v}</button>`).join('')}
                            <button class="effort-option${showCustom ? ' active' : ''}" data-value="__custom__" ${disabled}>自定义</button>
                        </div>
                        <input type="text" class="effort-custom-input" id="ts-custom-input" placeholder="输入自定义推理强度" style="margin-top:8px;${showCustom && thinkingOn ? '' : 'display:none'}" value="${showCustom ? this.escapeHtml(effortVal) : ''}">`;
                    this._bindThinkingSubmodalEvents(model);
                    overlay.classList.add('show');
                },

                _bindThinkingSubmodalEvents(model) {
                    const tgThinking = document.getElementById('ts-thinking');
                    const effortOptions = document.querySelectorAll('.effort-option');
                    const customInput = document.getElementById('ts-custom-input');
                    const effortRow = document.querySelector('.thinking-row:nth-child(3)');
                    const effortOptionsDiv = document.getElementById('ts-effort-options');

                    if (tgThinking) {
                        tgThinking.addEventListener('change', () => {
                            const on = tgThinking.checked;
                            if (effortRow) {
                                effortRow.style.opacity = on ? '' : '0.4';
                                effortRow.style.pointerEvents = on ? '' : 'none';
                            }
                            if (effortOptionsDiv) {
                                effortOptionsDiv.style.opacity = on ? '' : '0.4';
                                effortOptionsDiv.style.pointerEvents = on ? '' : 'none';
                            }
                            effortOptions.forEach(btn => btn.disabled = !on);
                            if (!on && customInput) customInput.style.display = 'none';
                        });
                    }

                    effortOptions.forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isActive = btn.classList.contains('active');
                            effortOptions.forEach(b => b.classList.remove('active'));
                            if (isActive) {
                                if (customInput) customInput.style.display = 'none';
                            } else {
                                btn.classList.add('active');
                                if (btn.dataset.value === '__custom__') {
                                    if (customInput) {
                                        customInput.style.display = '';
                                        customInput.focus();
                                    }
                                } else {
                                    if (customInput) customInput.style.display = 'none';
                                }
                            }
                        });
                    });

                    if (customInput) {
                        customInput.addEventListener('blur', () => {
                            if (!customInput.value.trim()) {
                                document.querySelector('.effort-option[data-value="__custom__"]')?.classList.remove('active');
                                customInput.style.display = 'none';
                            }
                        });
                        customInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') customInput.blur();
                        });
                    }
                },

                _confirmThinkingModal() {
                    const overlay = document.getElementById('thinkingSubmodalOverlay');
                    if (!overlay) return;
                    const model = this._thinkingModalModel;
                    if (!model) { overlay.classList.remove('show'); return; }
                    const tgThinking = document.getElementById('ts-thinking');
                    const activeOption = document.querySelector('.effort-option.active');
                    const customInput = document.getElementById('ts-custom-input');
                    if (!this._modelThinkingConfig[model]) this._modelThinkingConfig[model] = {};
                    if (tgThinking?.checked) {
                        this._modelThinkingConfig[model].thinking = { type: 'enabled' };
                        if (activeOption) {
                            if (activeOption.dataset.value === '__custom__') {
                                const val = customInput?.value.trim() || '';
                                if (val) {
                                    this._modelThinkingConfig[model].reasoning_effort = val;
                                } else {
                                    delete this._modelThinkingConfig[model].reasoning_effort;
                                }
                            } else {
                                this._modelThinkingConfig[model].reasoning_effort = activeOption.dataset.value;
                            }
                        } else {
                            delete this._modelThinkingConfig[model].reasoning_effort;
                        }
                    } else {
                        this._modelThinkingConfig[model].thinking = { type: 'disabled' };
                        delete this._modelThinkingConfig[model].reasoning_effort;
                    }
                    overlay.classList.remove('show');
                    this.renderModelCheckboxList();
                    this.onConfigChange();
                    if (this._savedModelThinkingConfig) {
                        this._savedModelThinkingConfig[model] = JSON.parse(JSON.stringify(this._modelThinkingConfig[model]));
                    }
                },

                _cancelThinkingModal() {
                    const overlay = document.getElementById('thinkingSubmodalOverlay');
                    if (overlay) overlay.classList.remove('show');
                },

                _showSelectorThinkingPopup(btnEl) {
                    const popupId = btnEl.dataset.selLb;
                    const model = btnEl.dataset.selModel;
                    const existing = document.querySelector(`.thinking-popup[data-sel-lb-id="${popupId}"]`);
                    if (existing) { existing.remove(); return; }
                    document.querySelectorAll('.thinking-popup').forEach(el => el.remove());
                    const rect = btnEl.getBoundingClientRect();
                    const popup = document.createElement('div');
                    popup.className = 'thinking-popup';
                    popup.dataset.selLbId = popupId;
                    popup.innerHTML = this._renderCanvasThinkingHtml(model);
                    document.body.appendChild(popup);
                    let left = rect.left - popup.offsetWidth - 4;
                    let top = rect.top - 4;
                    if (left < 0) left = rect.right + 4;
                    if (top + popup.offsetHeight > window.innerHeight) {
                        top = window.innerHeight - popup.offsetHeight - 6;
                    }
                    if (top < 0) top = 6;
                    popup.style.left = left + 'px';
                    popup.style.top = top + 'px';
                    this._bindCanvasThinkingEvents(popup, model);
                },

                _renderCanvasThinkingHtml(model) {
                    const cfg = this._modelThinkingConfig[model] || {};
                    const thinkingOn = cfg.thinking?.type === 'enabled';
                    const effortOn = !!cfg.reasoning_effort;
                    const effortVal = cfg.reasoning_effort || 'medium';
                    const showCustom = effortOn && !['low', 'medium', 'high', 'max'].includes(effortVal);
                    const presetValues = ['low', 'medium', 'high', 'max'];
                    const disabled = thinkingOn ? '' : 'disabled';
                    const effortStyle = thinkingOn ? '' : 'opacity:0.4;pointer-events:none;';
                    return `<div style="display:flex;flex-direction:column;gap:8px" data-tm="${this.escapeHtml(model)}">
                        <div style="font-size:12px;font-weight:500;color:var(--text-secondary)">${this.escapeHtml(model)}</div>
                        <div class="thinking-row">
                            <span class="thinking-label">开启推理</span>
                            <label class="toggle-switch">
                                <input type="checkbox" class="tg-thinking" ${thinkingOn ? 'checked' : ''}>
                                <span class="toggle-track"></span>
                            </label>
                        </div>
                        <div class="thinking-row" style="${effortStyle};margin-bottom:4px">
                            <span class="thinking-label">推理强度</span>
                        </div>
                        <div class="effort-options" style="${effortStyle}">
                            ${presetValues.map(v => `<button class="effort-option${effortOn && effortVal === v && !showCustom ? ' active' : ''}" data-value="${v}" ${disabled}>${v}</button>`).join('')}
                            <button class="effort-option${showCustom ? ' active' : ''}" data-value="__custom__" ${disabled}>自定义</button>
                        </div>
                        <input type="text" class="effort-custom-input" placeholder="输入自定义推理强度" style="margin-top:4px;${showCustom && thinkingOn ? '' : 'display:none'}" value="${showCustom ? this.escapeHtml(effortVal) : ''}">
                    </div>`;
                },

                _bindCanvasThinkingEvents(popup, model) {
                    const container = popup.querySelector('[data-tm]');
                    if (!container) return;
                    const tgThinking = container.querySelector('.tg-thinking');
                    const effortOptions = container.querySelectorAll('.effort-option');
                    const customInput = container.querySelector('.effort-custom-input');
                    const effortRow = container.querySelector('.thinking-row:nth-child(3)');
                    const effortOptionsDiv = container.querySelector('.effort-options');

                    if (tgThinking) {
                        tgThinking.addEventListener('change', () => {
                            if (!this._modelThinkingConfig[model]) this._modelThinkingConfig[model] = {};
                            const on = tgThinking.checked;
                            this._modelThinkingConfig[model].thinking = {
                                type: on ? 'enabled' : 'disabled'
                            };
                            if (!on) {
                                delete this._modelThinkingConfig[model].reasoning_effort;
                            }
                            if (effortRow) {
                                effortRow.style.opacity = on ? '1' : '0.4';
                                effortRow.style.pointerEvents = on ? 'auto' : 'none';
                            }
                            if (effortOptionsDiv) {
                                effortOptionsDiv.style.opacity = on ? '' : '0.4';
                                effortOptionsDiv.style.pointerEvents = on ? '' : 'none';
                            }
                            effortOptions.forEach(btn => btn.disabled = !on);
                            if (!on && customInput) customInput.style.display = 'none';
                            this.onConfigChange();
                        });
                    }

                    effortOptions.forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isActive = btn.classList.contains('active');
                            effortOptions.forEach(b => b.classList.remove('active'));
                            if (isActive) {
                                if (customInput) customInput.style.display = 'none';
                                delete this._modelThinkingConfig[model]?.reasoning_effort;
                            } else {
                                btn.classList.add('active');
                                if (btn.dataset.value === '__custom__') {
                                    if (customInput) customInput.style.display = '';
                                } else {
                                    if (customInput) customInput.style.display = 'none';
                                    this._modelThinkingConfig[model].reasoning_effort = btn.dataset.value;
                                }
                            }
                            this.onConfigChange();
                        });
                    });

                    if (customInput) {
                        customInput.addEventListener('blur', () => {
                            if (!customInput.value.trim()) {
                                container.querySelector('.effort-option[data-value="__custom__"]')?.classList.remove('active');
                                customInput.style.display = 'none';
                            }
                        });
                        customInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') customInput.blur();
                        });
                    }
                },

                _repositionCanvasPopup(popup) {
                    const nodeId = popup.dataset.cvLb || popup.dataset.selLbId;
                    const btnEl = document.querySelector(`[data-cv-lb="${nodeId}"]`) || document.querySelector(`[data-sel-lb="${nodeId}"]`);
                    if (!btnEl) return;
                    const rect = btnEl.getBoundingClientRect();
                    let left = rect.left - popup.offsetWidth - 4;
                    let top = rect.top - 4;
                    if (left < 0) left = rect.right + 4;
                    if (top + popup.offsetHeight > window.innerHeight) {
                        top = window.innerHeight - popup.offsetHeight - 6;
                    }
                    if (top < 0) top = 6;
                    popup.style.left = left + 'px';
                    popup.style.top = top + 'px';
                },

                toggleModelSelection(model) {
                    const idx = this.selectedModels.indexOf(model);
                    if (idx !== -1) { this.selectedModels.splice(idx, 1); } else { this.selectedModels.push(
                    model); }
                    this.renderModelCheckboxList();
                },

                updateSelectedModelCount() {
                    document.getElementById('selectedModelCount').textContent = this.selectedModels.length;
                    this.syncModelNodesToCanvas();
                },

                syncModelNodesToCanvas() {
                    const snap = v => Math.round(v / this.GRID) * this.GRID;
                    const existing = this.canvasState.nodes.filter(n => n.type === 'model' && n.value);
                    const existingModels = new Set(existing.map(n => n.value));
                    const newModels = this.selectedModels.filter(m => !existingModels.has(m));
                    // Calculate starting Y: place below existing model nodes
                    let y = existing.length > 0
                        ? snap(Math.max(...existing.map(n => n.y || 0)) + NODE_GAP_Y)
                        : START_Y;
                    newModels.forEach(m => {
                        const id = 'n_m_' + generateId();
                        this.canvasState.nodes.push({ id, type: 'model', value: m, x: this.getColumnX('model'), y: y,
                            autoLayout: false });
                        y += NODE_GAP_Y;
                    });
                    this.canvasState.nodes = this.canvasState.nodes.filter(n => {
                        if (n.type !== 'model' || !n.value) return true;
                        return this.selectedModels.includes(n.value);
                    });
                    this.autoConnectCanvas();
                    this.renderAssociationCanvas({ center: false });
                    this.saveCanvasSnapshot();
                    this.debouncedAutoSave();
                },

                canvasToSelectedModels() {
                    this.selectedModels = this.canvasState.nodes
                        .filter(n => n.type === 'model' && n.value)
                        .map(n => n.value);
                    this.updateSelectedModelCount();
                },

                _markMissingModels() {
                    this.canvasState.nodes.forEach(n => {
                        if (n.type !== 'model' || !n.value) return;
                        n._notFound = this.availableModels.length > 0 && !this.availableModels.includes(n.value);
                    });
                },

                _markMissingPromptQuestions() {
                    this.canvasState.nodes.forEach(n => {
                        if (!n.value || n.tag) return;
                        if (n.type === 'prompt') {
                            n._notFound = !this.prompts.some(p => `${p.testSet || ''} ${p.tag || ''} #${p.id}` === n.value);
                        } else if (n.type === 'question') {
                            n._notFound = !this.questions.some(q => `${q.testSet || ''} ${q.tag || ''} #${q.id}` === n.value);
                        }
                    });
                },

                getSelectedPromptItems() {
                    const items = [];
                    this.selectedPrompts.forEach(key => {
                        const p = this.prompts.find(pr => `p_${pr.testSet || '未分类'}_${pr.id}_${pr.file || ''}` === key);
                        if (p) items.push(p);
                    });
                    return items;
                },

                getSelectedQuestionItems() {
                    const items = [];
                    this.selectedQuestions.forEach(key => {
                        const q = this.questions.find(qu => `q_${qu.testSet || '未分类'}_${qu.id}_${qu.file || ''}` === key);
                        if (q) items.push(q);
                    });
                    return items;
                },

                async runTests() {
                    const selPrompts = this.getSelectedPromptItems();
                    const selQuestions = this.getSelectedQuestionItems();

                    const missing = [];
                    if (selPrompts.length === 0) missing.push('提示词');
                    if (selQuestions.length === 0) missing.push('测试问题');
                    if (this.selectedModels.length === 0) missing.push('模型');
                    if (missing.length > 0) {
                        showToast('请至少选择' + missing.join('、'), 'warning');
                        return;
                    }

                    const btn = document.getElementById('runBtn');
                    const stopBtn = document.getElementById('stopBtn');
                    btn.disabled = true;
                    btn.classList.add('btn-loading');
                    stopBtn.disabled = false;
                    btn.innerHTML = '测试中...';
                    this.isRunning = true;

                    const bySet = {};
                    selPrompts.forEach(p => {
                        const ts = p.testSet || 'default';
                        if (!bySet[ts]) bySet[ts] = { prompts: [], questions: new Set() };
                        bySet[ts].prompts.push(p);
                    });
                    selQuestions.forEach(q => {
                        const ts = q.testSet || 'default';
                        if (!bySet[ts]) bySet[ts] = { prompts: [], questions: new Set() };
                        bySet[ts].questions.add(q);
                    });

                    const testSetNames = Object.keys(bySet).filter(ts =>
                        bySet[ts].prompts.length > 0 && bySet[ts].questions.size > 0
                    );

                    if (testSetNames.length === 0) {
                        showToast('没有可执行的测试组合：提示词和问题需属于同一测试集', 'warning');
                        btn.disabled = false;
                        btn.classList.remove('btn-loading');
                        stopBtn.disabled = true;
                        btn.innerHTML = '开始测试';
                        this.isRunning = false;
                        return;
                    }

                    const testSetsPayload = testSetNames.map(ts => ({
                        name: ts,
                        prompts: bySet[ts].prompts,
                        questions: Array.from(bySet[ts].questions)
                    }));

                    try {
                        const hubResp = await fetch('/api/v1/test-job/hub', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({action: 'start', test_sets: testSetsPayload, models: this.selectedModels})
                        });
                        if (hubResp.status === 409) {
                            const err = await hubResp.json();
                            showToast(err.message || '已有测试任务在运行', 'warning');
                            btn.disabled = false;
                            btn.classList.remove('btn-loading');
                            stopBtn.disabled = true;
                            btn.innerHTML = '开始测试';
                            this.isRunning = false;
                            return;
                        }
                        if (!hubResp.ok) {
                            const err = await hubResp.json();
                            throw new Error(err.error || '启动测试失败');
                        }
                        const { job_id, total_tasks } = await hubResp.json();
                        this.allResults = {};
                        this._liveItems = [];
                        this._userScrolledAway = false;
                        document.getElementById('aiStreamContent').innerHTML = '';
                        document.getElementById('aiStreamStatus').textContent = '生成中';
                        document.getElementById('aiStreamStatus').classList.add('active');
                        document.getElementById('resultCount').textContent = '0 题';
                        document.getElementById('progressContainer').style.display = 'block';
                        document.getElementById('progressContainer').dataset.total = total_tasks;
                        document.getElementById('progressText').textContent = '正在连接...';
                        document.getElementById('progressPercent').textContent = '0%';

                        const hs = document.getElementById('historySelector');
                        if (hs && hs.value) {
                            hs.value = '';
                            const textEl = document.querySelector('#historySelectorWrap .custom-select-text');
                            if (textEl) textEl.textContent = '当前运行';
                        }

                        this.abortController = new AbortController();
                        await this._connectJobStream(job_id);
                    } catch (error) {
                        if (error.name === 'AbortError') { showToast('测试已终止', 'warning'); }
                        else { showToast('测试失败: ' + friendlyError(error.message), 'error'); }
                    } finally {
                        btn.disabled = false;
                        btn.classList.remove('btn-loading');
                        stopBtn.disabled = true;
                        btn.innerHTML = '开始测试';
                        this.isRunning = false;
                        this.abortController = null;
                        document.getElementById('progressContainer').style.display = 'none';
                        const st = document.getElementById('aiStreamStatus');
                        if (st && st.textContent === '生成中') {
                            st.textContent = '空闲';
                            st.classList.remove('active');
                        }
                    }
                },

                async _connectJobStream(jobId) {
                    const response = await fetch(`/api/v1/test-job/stream/${jobId}`, {
                        signal: this.abortController.signal
                    });
                    if (!response.ok) throw new Error('连接任务流失败');
                    if (!response.body) throw new Error('服务器返回空响应体');
                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = '';
                    while (true) {
                        const readPromise = reader.read();
                        const timeoutPromise = new Promise((_, reject) =>
                            this._sseTimer = setTimeout(() => reject(new Error('SSE读取超时')), this._sseChunkTimeout)
                        );
                        let result;
                        try {
                            result = await Promise.race([readPromise, timeoutPromise]);
                            clearTimeout(this._sseTimer);
                        } catch (e) {
                            clearTimeout(this._sseTimer);
                            this.abortController?.abort();
                            throw e;
                        }
                        const { done, value } = result;
                        if (done) break;
