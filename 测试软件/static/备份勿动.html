                        if (newQ) this.selectedQuestions.add(`q_${newQ.testSet || '未分类'}_${newQ.id}_${newQ.file || ''}`);
                        this._saveSelectionToLocalStorage();
                    }
                    this.closeAllSelectors();
                    this.renderAssociationCanvas({ center: false });
                    this.saveCanvasSnapshot();
                },

                clearNodeValue(nodeId) {
                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    if (node.tag) {
                        const tag = node.tag;
                        if (node.type === 'prompt') {
                            this.prompts.forEach(p => {
                                if ((p.testSet || '未分类') === tag) {
                                    this.selectedPrompts.delete(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                                }
                            });
                            this._saveSelectionToLocalStorage();
                            this.renderPromptList();
                        } else if (node.type === 'question') {
                            this.questions.forEach(q => {
                                if ((q.testSet || '未分类') === tag) {
                                    this.selectedQuestions.delete(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`);
                                }
                            });
                            this._saveSelectionToLocalStorage();
                            this.renderQuestionList();
                        }
                        // 转为普通空节点，保留在画布上
                        delete node.tag;
                        delete node.testSet;
                        delete node.count;
                        delete node.display;
                        node.value = '';
                        this.autoConnectCanvas();
                        this.renderAssociationCanvas({ center: false });
                        this.saveCanvasSnapshot();
                        return;
                    }
                    if (node.type === 'prompt') {
                        if (node.value) {
                            const p = this.prompts.find(pr => `${pr.testSet || ''} ${pr.tag || ''} #${pr.id}` === node.value);
                            if (p) this.selectedPrompts.delete(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                        }
                        this.selectedPrompts.delete(nodeId);
                        this._saveSelectionToLocalStorage();
                        this.renderPromptList();
                        node.value = '';
                        this.autoConnectCanvas();
                        this.renderAssociationCanvas({ center: false });
                        this.saveCanvasSnapshot();
                    } else if (node.type === 'question') {
                        if (node.value) {
                            const q = this.questions.find(qu => `${qu.testSet || ''} ${qu.tag || ''} #${qu.id}` === node.value);
                            if (q) this.selectedQuestions.delete(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`);
                        }
                        this.selectedQuestions.delete(nodeId);
                        this._saveSelectionToLocalStorage();
                        this.renderQuestionList();
                        node.value = '';
                        this.autoConnectCanvas();
                        this.renderAssociationCanvas({ center: false });
                        this.saveCanvasSnapshot();
                    } else if (node.type === 'model' && node.value) {
                        const idx = this.selectedModels.indexOf(node.value);
                        if (idx !== -1) { this.selectedModels.splice(idx, 1); }
                        node.value = '';
                        this.persistSelectedModels();
                        this.updateSelectedModelCount();
                        this.autoConnectCanvas();
                        this.renderAssociationCanvas({ center: false });
                        this.saveCanvasSnapshot();
                    }
                },

                closeAllSelectors() {
                    document.querySelectorAll('.comfy-sel-popup').forEach(el => el.remove());
                },

                async loadModels() {
                    try {
                        const apiKey = document.getElementById('apiKey').value;
                        const response = await fetchWithTimeout('/api/v1/models', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ api_key: apiKey })
                        });
                        if (response.ok) {
                            const models = await response.json();
                            this.availableModels = models.map(m => m.id);
                        }
                    } catch (e) { console.error('Failed to load models:', e); this.showToast('加载模型列表失败: ' + friendlyError(e.message), 'error'); }
                },

                openModelModal() {
                    const btn = document.getElementById('openModelBtn');
                    if (btn.disabled) return;
                    btn.disabled = true;
                    btn.classList.add('btn-loading');
                    fetchWithTimeout('/api/v1/models', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ api_key: document.getElementById('apiKey').value })
                        })
                        .then(res => {
                            if (!res.ok) return res.text().then(text => { throw new Error('API错误: ' + res
                                    .status + ' - ' + text); });
                            return res.json();
                        })
                        .then(models => {
                            this.availableModels = models.map(m => m.id);
                            this._savedSelectedModels = JSON.parse(JSON.stringify(this.selectedModels));
                            this.renderModelCheckboxList();
                            document.getElementById('modelModal').classList.add('show');
                        })
                        .catch(error => { showToast('加载模型失败: ' + friendlyError(error.message), 'error'); })
                        .finally(() => {
                            btn.disabled = false;
                            btn.classList.remove('btn-loading');
                        });
                },

                async refreshModels() {
                    const btn = document.querySelector('[onclick*="refreshModels"]');
                    if (btn && btn.disabled) return;
                    if (btn) { btn.disabled = true; btn.classList.add('btn-loading'); }
                    await this.onBaseUrlBlur();
                    fetchWithTimeout('/api/v1/models', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ api_key: document.getElementById('apiKey').value })
                        })
                        .then(res => {
                            if (!res.ok) return res.text().then(text => { throw new Error('API错误: ' + res
                                    .status + ' - ' + text); });
                            return res.json();
                        })
                        .then(models => {
                            this.availableModels = models.map(m => m.id);
                            showToast('模型列表已刷新，共 ' + this.availableModels.length + ' 个模型', 'success');
                        })
                        .catch(error => { showToast('刷新模型失败: ' + friendlyError(error.message), 'error'); })
                        .finally(() => {
                            if (btn) { btn.disabled = false; btn.classList.remove('btn-loading'); }
                        });
                },

                async persistSelectedModels() {
                    try {
                        await fetchWithTimeout('/api/v1/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ models: this.selectedModels })
                        });
                    } catch (e) { console.error('Failed to persist models:', e); this.showToast('保存模型选择失败', 'error'); }
                },

                confirmModelSelection() {
                    this.updateSelectedModelCount();
                    this._savedSelectedModels = null;
                    document.getElementById('modelModal').classList.remove('show');
                    this.onConfigChange();
                },

                closeModelModal() {
                    if (this._savedSelectedModels) {
                        this.selectedModels = JSON.parse(JSON.stringify(this._savedSelectedModels));
                        this._savedSelectedModels = null;
                        this.renderModelCheckboxList();
                    }
                    document.getElementById('modelModal').classList.remove('show');
                },

                renderModelCheckboxList() {
                    const container = document.getElementById('modelCheckboxList');
                    container.innerHTML = this.availableModels.map(model => {
                        const index = this.selectedModels.indexOf(model);
                        const orderNum = index !== -1 ? index + 1 : null;
                        return `<div class="model-checkbox-item" data-model="${this.escapeHtml(model)}">
                        <span class="model-order-badge ${orderNum ? 'active' : ''}">${orderNum || ''}</span>
                        <span class="model-name">${this.escapeHtml(model)}</span>
                    </div>`;
                    }).join('');
                    container.querySelectorAll('.model-checkbox-item').forEach(el => {
                        el.addEventListener('click', () => App.toggleModelSelection(el.dataset.model));
                    });
                },

                toggleModelSelection(model) {
                    const idx = this.selectedModels.indexOf(model);
                    if (idx !== -1) { this.selectedModels.splice(idx, 1); } else { this.selectedModels.push(
                    model); }
                    this.renderModelCheckboxList();
                },

                updateSelectedModelCount() {
                    document.getElementById('selectedModelCount').textContent = this.selectedModels.length;
                    this.syncModelNodesToCanvas();
                },

                syncModelNodesToCanvas() {
                    const snap = v => Math.round(v / this.GRID) * this.GRID;
                    const existing = this.canvasState.nodes.filter(n => n.type === 'model' && n.value);
                    const existingModels = new Set(existing.map(n => n.value));
                    const newModels = this.selectedModels.filter(m => !existingModels.has(m));
                    // Calculate starting Y: place below existing model nodes
                    let y = existing.length > 0
                        ? snap(Math.max(...existing.map(n => n.y || 0)) + NODE_GAP_Y)
                        : START_Y;
                    newModels.forEach(m => {
                        const id = 'n_m_' + generateId();
                        this.canvasState.nodes.push({ id, type: 'model', value: m, x: this.getColumnX('model'), y: y,
                            autoLayout: false });
                        y += NODE_GAP_Y;
                    });
                    this.canvasState.nodes = this.canvasState.nodes.filter(n => {
                        if (n.type !== 'model' || !n.value) return true;
                        return this.selectedModels.includes(n.value);
                    });
                    this.autoConnectCanvas();
                    this.renderAssociationCanvas({ center: false });
                    this.saveCanvasSnapshot();
                    this.debouncedAutoSave();
                },

                canvasToSelectedModels() {
                    this.selectedModels = this.canvasState.nodes
                        .filter(n => n.type === 'model' && n.value)
                        .map(n => n.value);
                    this.updateSelectedModelCount();
                },

                _markMissingModels() {
                    this.canvasState.nodes.forEach(n => {
                        if (n.type !== 'model' || !n.value) return;
                        n._notFound = this.availableModels.length > 0 && !this.availableModels.includes(n.value);
                    });
                },

                _markMissingPromptQuestions() {
                    this.canvasState.nodes.forEach(n => {
                        if (!n.value || n.tag) return;
                        if (n.type === 'prompt') {
                            n._notFound = !this.prompts.some(p => `${p.testSet || ''} ${p.tag || ''} #${p.id}` === n.value);
                        } else if (n.type === 'question') {
                            n._notFound = !this.questions.some(q => `${q.testSet || ''} ${q.tag || ''} #${q.id}` === n.value);
                        }
                    });
                },

                getSelectedPromptItems() {
                    const items = [];
                    this.selectedPrompts.forEach(key => {
                        const p = this.prompts.find(pr => `p_${pr.testSet || '未分类'}_${pr.id}_${pr.file || ''}` === key);
                        if (p) items.push(p);
                    });
                    return items;
                },

                getSelectedQuestionItems() {
                    const items = [];
                    this.selectedQuestions.forEach(key => {
                        const q = this.questions.find(qu => `q_${qu.testSet || '未分类'}_${qu.id}_${qu.file || ''}` === key);
                        if (q) items.push(q);
                    });
                    return items;
                },

                async runTests() {
                    const selPrompts = this.getSelectedPromptItems();
                    const selQuestions = this.getSelectedQuestionItems();

                    const missing = [];
                    if (selPrompts.length === 0) missing.push('提示词');
                    if (selQuestions.length === 0) missing.push('测试问题');
                    if (this.selectedModels.length === 0) missing.push('模型');
                    if (missing.length > 0) {
                        showToast('请至少选择' + missing.join('、'), 'warning');
                        return;
                    }

                    const btn = document.getElementById('runBtn');
                    const stopBtn = document.getElementById('stopBtn');
                    btn.disabled = true;
                    btn.classList.add('btn-loading');
                    stopBtn.disabled = false;
                    btn.innerHTML = '测试中...';
                    this.isRunning = true;
                    this.abortController = new AbortController();

                    document.getElementById('progressContainer').style.display = 'block';
                    document.getElementById('progressText').textContent = '正在连接...';
                    document.getElementById('progressPercent').textContent = '0%';
                    this.allResults = {};
                    document.getElementById('aiStreamContent').innerHTML = '';
                    document.getElementById('aiStreamStatus').textContent = '等待中';
                    this._testSetsCompleted = 0;
                    this._totalTestSets = 0;
                    this._allStreamItems = [];
                    document.getElementById('resultCount').textContent = '0 题';
                    const hs = document.getElementById('historySelector');
                    if (hs && hs.value) {
                        hs.value = '';
                        const textEl = document.querySelector('#historySelectorWrap .custom-select-text');
                        if (textEl) textEl.textContent = '当前运行';
                    }
                    const modelFilter = document.getElementById('resultFilterModel');
                    if (modelFilter) { modelFilter.value = ''; }
                    const modelDropdown = document.getElementById('resultFilterModelDropdown');
                    if (modelDropdown) { modelDropdown.innerHTML = '<div class="custom-select-option selected" data-value="" onclick="App.selectDropdownOption(\'resultFilterModel\', \'\', \'所有模型\')">所有模型</div>'; }

                    const bySet = {};
                    selPrompts.forEach(p => {
                        const ts = p.testSet || 'default';
                        if (!bySet[ts]) bySet[ts] = { prompts: [], questions: new Set() };
                        bySet[ts].prompts.push(p);
                    });
                    selQuestions.forEach(q => {
                        const ts = q.testSet || 'default';
                        if (!bySet[ts]) bySet[ts] = { prompts: [], questions: new Set() };
                        bySet[ts].questions.add(q);
                    });

                    const testSetNames = Object.keys(bySet).filter(ts =>
                        bySet[ts].prompts.length > 0 && bySet[ts].questions.size > 0
                    );

                    if (testSetNames.length === 0) {
                        showToast('没有可执行的测试组合：提示词和问题需属于同一测试集', 'warning');
                        btn.disabled = false;
                        btn.classList.remove('btn-loading');
                        stopBtn.disabled = true;
                        btn.innerHTML = '开始测试';
                        this.isRunning = false;
                        this.abortController = null;
                        return;
                    }

                    const testCount = parseInt(document.getElementById('modal-testCountInput').value) || 1;
                    this._totalTestSets = 1;
                    let totalTasks = 0;
                    testSetNames.forEach(ts => {
                        const group = bySet[ts];
                        totalTasks += group.prompts.length * Array.from(group.questions).length * this.selectedModels.length * testCount;
                    });
                    document.getElementById('progressContainer').dataset.total = totalTasks;
                    try {
                        const testSetsPayload = testSetNames.map(ts => ({
                            name: ts,
                            prompts: bySet[ts].prompts,
                            questions: Array.from(bySet[ts].questions)
                        }));
                        const payload = {
                            test_sets: testSetsPayload,
                            models: this.selectedModels
                        };
                        const connTimer = setTimeout(() => {
                            try { this.abortController.abort(new DOMException('连接服务器超时')); } catch (e) {}
                        }, 60000);
                        const response = await fetch('/api/v1/run-tests', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload),
                            signal: this.abortController.signal
                        });
                        clearTimeout(connTimer);
                        if (!response.ok) {
                            let errMsg = response.statusText;
                            try { const errBody = await response.json(); errMsg = errBody.error || errBody.message || errMsg; } catch (e) {}
                            throw new Error(errMsg);
                        }
                        if (!response.body) throw new Error('服务器返回空响应体');
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        let sseTimeout = null;
                        while (true) {
                            const readPromise = reader.read();
                            const timeoutPromise = new Promise((_, reject) =>
                                sseTimeout = setTimeout(() => reject(new Error('SSE读取超时')), this._sseChunkTimeout)
                            );
                            const { done, value } = await Promise.race([readPromise, timeoutPromise]);
                            clearTimeout(sseTimeout);
                            sseTimeout = null;
                            if (done) break;
                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || '';
                            for (const line of lines) {
                                if (line.startsWith('data: ')) {
                                    try { const data = JSON.parse(line.slice(6));
                                        this.handleStreamData(data); } catch (e) { console.warn(
                                            'SSE parse error:', e, line.slice(0, 200)); }
                                } else if (line.startsWith('data:')) {
                                    try { const data = JSON.parse(line.slice(5));
                                        this.handleStreamData(data); } catch (e) { console.warn(
                                            'SSE parse error:', e, line.slice(0, 200)); }
                                }
                            }
                        }
                    } catch (error) {
                        if (error.name === 'AbortError') { showToast('测试已终止', 'warning'); } else { showToast(
                            '测试失败: ' + friendlyError(error.message), 'error'); }
                    } finally {
                        btn.disabled = false;
                        btn.classList.remove('btn-loading');
                        stopBtn.disabled = true;
                        btn.innerHTML = '开始测试';
                        this.isRunning = false;
                        this.abortController = null;
                    }
                },

                async stopTests() {
                    let backendStopped = false;
                    try {
                        const resp = await fetchWithTimeout('/api/v1/stop-tests', { method: 'POST' }, 10000);
                        backendStopped = resp.ok;
                    } catch (err) {
                        console.error('stop-tests failed:', err);
                        showToast('向后端发送停止信号失败', 'error');
                    }
                    if (this.abortController) {
                        this.abortController.abort();
                    }
                    if (backendStopped) {
                        showToast('测试已终止', 'warning');
                    } else {
                        showToast('已断开前端连接，但后端可能仍在运行', 'warning');
                    }
                },

                handleStreamData(data) {
                    const progressContainer = document.getElementById('progressContainer');
                    const progressFill = document.getElementById('progressFill');
                    const progressText = document.getElementById('progressText');
                    const progressPercent = document.getElementById('progressPercent');

                    if (data.type === 'result') {
                        const key = `${data.model_id || '?'}_${data.prompt_id || '?'}_${data.question_id || '?'}_${data.test_index || 0}`;
                        if (!this.allResults[key]) { this.allResults[key] = []; }
                        this.allResults[key].push(data);
                        this.addAiStreamItem(data);
                        const total = parseInt(progressContainer.dataset.total || 0);
                        const completed = data.completed || Object.values(this.allResults).flat().length;
                        const percent = total > 0 ? Math.round(completed / total * 100) : 0;
                        progressFill.style.width = percent + '%';
                        progressPercent.textContent = percent + '%';
                        document.getElementById('resultCount').textContent = `${completed} 题`;
                    } else if (data.type === 'done') {
                        progressText.textContent = data.message;
                        this._testSetsCompleted = (this._testSetsCompleted || 0) + 1;
                        if (this._testSetsCompleted >= this._totalTestSets) {
                            document.getElementById('runBtn').disabled = false;
                            document.getElementById('stopBtn').disabled = true;
                            document.getElementById('runBtn').innerHTML = '开始测试';
                        }
                        document.getElementById('aiStreamStatus').textContent = '完成';
                        document.getElementById('aiStreamStatus').classList.remove('active');
                    } else if (data.type === 'error') {
                        const errorMsg = data.error_msg || '未知错误';
                        showToast(`任务出错: ${errorMsg}`, 'error');
                        const total = parseInt(progressContainer.dataset.total || 0);
                        const completed = data.completed || 0;
                        const percent = total > 0 ? Math.round(completed / total * 100) : 0;
                        progressFill.style.width = percent + '%';
                        progressPercent.textContent = percent + '%';
                        document.getElementById('resultCount').textContent = `${completed} 题`;
                    } else if (data.type === 'status') {
                        progressText.textContent = data.message;
                        if (data.message.includes('正在生成')) {
                            document.getElementById('aiStreamStatus').textContent = '生成中';
                            document.getElementById('aiStreamStatus').classList.add('active');
                        }
                        if (data.message.includes('已终止')) {
                            document.getElementById('runBtn').disabled = false;
                            document.getElementById('stopBtn').disabled = true;
                            document.getElementById('runBtn').innerHTML = '开始测试';
                        }
                    }
                },

                addAiStreamItem(data) {
                    const container = document.getElementById('aiStreamContent');
                    const empty = container.querySelector('.ai-empty');
                    if (empty) empty.remove();
                    const item = document.createElement('div');
                    item.className = 'result-item';
                    const modelId = data.model_id || data.model || '';
                    const hasError = data.error_type || data.ai_answer === null;
                    if (hasError) item.classList.add('result-error');
                    const promptTag = data.prompt_tag || '';
                    const expected = data.expected_answer || data.answer || '';
                    const aiReply = data.ai_answer || data.model_reply || '';
                    item.innerHTML = `
                    <div class="result-header">
                        <span class="result-id">${this.escapeHtml(promptTag)} / #${this.escapeHtml(data.question_id || data.id || '')}</span>
                        <span class="result-source">${this.escapeHtml(modelId)}</span>
                    </div>
                    <div class="result-row">
                        <div class="result-label">问题</div>
                        <div class="result-content" style="font-size:12px;background:var(--bg-card);">${this.escapeHtml(data.question || '')}</div>
                    </div>
                    <div style="display:flex;gap:8px;margin-top:6px;">
                        <div style="flex:1;">
                            <div class="result-label">期望答案</div>
                            <div class="result-content expected">${this.escapeHtml(expected) || '暂无'}</div>
                        </div>
                        <div style="flex:1;">
                            <div class="result-label">AI回复</div>
                            <div class="result-content ai">${this.escapeHtml(aiReply) || '<span style="color:var(--text-muted)">无回复</span>'}</div>
                        </div>
                    </div>`;
                    item.dataset.modelId = modelId;
                    item.dataset.hasError = hasError ? '1' : '0';
                    this._allStreamItems.push(item);
                    this._updateModelFilterOptions(modelId);
                    container.appendChild(item);
                    const filter = this._getStreamFilter();
                    if (!this._matchesFilter(item, filter)) item.style.display = 'none';
                },

                _getStreamFilter() {
                    return {
                        status: document.getElementById('resultFilterStatus')?.value || 'all',
                        model: document.getElementById('resultFilterModel')?.value || '',
                        text: (document.getElementById('resultFilterText')?.value || '').toLowerCase()
                    };
                },

                _matchesFilter(item, filter) {
                    if (filter.status === 'success' && item.dataset.hasError === '1') return false;
                    if (filter.status === 'error' && item.dataset.hasError === '0') return false;
                    if (filter.model && item.dataset.modelId !== filter.model) return false;
                    if (filter.text) {
                        const text = item.textContent.toLowerCase();
                        if (!text.includes(filter.text)) return false;
                    }
                    return true;
                },

                applyStreamFilter() {
                    const filter = this._getStreamFilter();
                    this._allStreamItems.forEach(item => {
                        item.style.display = this._matchesFilter(item, filter) ? '' : 'none';
                    });
                },

                _updateModelFilterOptions(modelId) {
                    if (!modelId) return;
                    const dropdown = document.getElementById('resultFilterModelDropdown');
                    if (!dropdown) return;
                    for (let i = 0; i < dropdown.children.length; i++) {
                        if (dropdown.children[i].dataset.value === modelId) return;
                    }
                    const opt = document.createElement('div');
                    opt.className = 'custom-select-option';
                    opt.dataset.value = modelId;
                    opt.textContent = modelId;
                    opt.onclick = () => this.selectDropdownOption('resultFilterModel', modelId, modelId);
                    dropdown.appendChild(opt);
                },

                async loadHistoryResults() {
                    if (!this.testSetNames.length) return;
                    try {
                        const results = await Promise.allSettled(this.testSetNames.map(async (name) => {
                            const resp = await fetchWithTimeout(
                                `/api/v1/test-set/results?test_set=${encodeURIComponent(name)}`);
                            if (!resp.ok) throw new Error(`API错误: ${resp.status}`);
                            const data = await resp.json();
                            return (data.results || []).map(r => ({ ...r, testSet: name }));
                        }));
                    this.historyResultsList = results
                        .filter(r => r.status === 'fulfilled')
                        .flatMap(r => r.value);
                    const dropdown = document.getElementById('historySelectorDropdown');
                    if (dropdown) {
                        dropdown.innerHTML = '<div class="custom-select-option selected" data-value="" onclick="App.selectDropdownOption(\'historySelector\', \'\', \'当前运行\')">当前运行</div>' +
                            this.historyResultsList.map((r, idx) => {
                                const key = r.path || r.name || 'result_' + idx;
                                const text = `[${r.testSet}] ${r.name}`;
                                return `<div class="custom-select-option" data-value="${this.escapeHtml(key)}" onclick="App.selectDropdownOption('historySelector', '${this.escapeHtml(key)}', '${this.escapeHtml(text)}')">${this.escapeHtml(text)}</div>`;
                            }).join('');
                    }
                    } catch (error) {
                        console.error('Failed to load history results:', error);
                        this.showToast('加载历史结果失败', 'error');
                        const retryBtn = document.getElementById('historyRetryBtn');
                        if (retryBtn) retryBtn.style.display = '';
                    }
                },

                async retryLoadHistory() {
                    const retryBtn = document.getElementById('historyRetryBtn');
                    if (retryBtn) retryBtn.style.display = 'none';
                    await this.loadHistoryResults();
                },

                async loadHistoryResult() {
                    const hidden = document.getElementById('historySelector');
                    const val = hidden ? hidden.value : '';
                    if (!val) {
                        document.getElementById('aiStreamContent').innerHTML = '';
                        document.getElementById('aiStreamStatus').textContent = '等待中';
                        document.getElementById('resultCount').textContent = '0 题';
                        this._allStreamItems = [];
                        return;
                    }
                    const result = this.historyResultsList.find(r => (r.path || r.name) === val);
                    if (!result || !result.data) return;
                    const container = document.getElementById('aiStreamContent');
                    container.innerHTML = '';
                    this._allStreamItems = [];
                    document.getElementById('aiStreamStatus').textContent = '历史';
                    document.getElementById('resultCount').textContent = `${result.data.length} 题`;
                    for (const item of result.data) {
                        this.addAiStreamItem({
                            model_id: item.model_id,
                            prompt_tag: item.prompt_tag,
                            question_id: item.question_id,
                            question: item.question,
                            expected_answer: item.answer,
                            ai_answer: item.model_reply
                        });
                    }
                },

                setLoadingPhase(text) {
                    const el = document.getElementById('loadingPhase');
                    if (el) el.textContent = text;
                },

                async init() {
                    this.setLoadingPhase('正在加载配置…');
                    await this.loadConfig();
                    this.setLoadingPhase('正在加载测试集…');
                    await this.loadAllTestSets();
                    this.setLoadingPhase('正在加载画布…');
                    await this.loadCanvasState();

                    if (this.canvasState.selectedPrompts) {
                        this.selectedPrompts = new Set(this.canvasState.selectedPrompts);
                        this.selectedQuestions = new Set(this.canvasState.selectedQuestions);
                        if (this.canvasState.selectedModels) {
                            this.selectedModels = this.canvasState.selectedModels;
                        }
                    } else if (this.canvasState.nodes.some(n => (n.type === 'prompt' || n.type === 'question') && n.tag)) {
                        this.selectedPrompts.clear();
                        this.selectedQuestions.clear();
                        this.canvasState.nodes.forEach(n => {
                            if (n.type === 'prompt' && n.tag) {
                                this.prompts.filter(p => (p.testSet || '未分类') === n.tag).forEach(p =>
                                    this.selectedPrompts.add(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`));
                            }
                            if (n.type === 'question' && n.tag) {
                                this.questions.filter(q => (q.testSet || '未分类') === n.tag).forEach(q =>
                                    this.selectedQuestions.add(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`));
                            }
                        });
                    }

                    // localStorage中存有最新选择状态，用其覆盖画布的陈旧数据
                    this._loadSelectionFromLocalStorage();
                    // 清理localStorage中不再有效的选中项
                    const validPromptKeys = new Set(this.prompts.map(p =>
                        `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`));
                    const validQuestionKeys = new Set(this.questions.map(q =>
                        `q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`));
                    for (const key of this.selectedPrompts) {
                        if (!validPromptKeys.has(key)) this.selectedPrompts.delete(key);
                    }
                    for (const key of this.selectedQuestions) {
                        if (!validQuestionKeys.has(key)) this.selectedQuestions.delete(key);
                    }

                    this.syncCanvasFromSelection();

                    // Only sync model nodes when NOT loading a saved canvas
                    // (saved canvas already has model nodes with correct positions)
                    if (!this._hasSavedCanvas) {
                        this.syncModelNodesToCanvas();
                    } else {
                        // Just update the model count display without re-syncing
                        document.getElementById('selectedModelCount').textContent = this.selectedModels.length;
                    }

                    // Validate model nodes: auto-refresh if selected models not in availableModels
                    const modelNodes = this.canvasState.nodes.filter(n => n.type === 'model' && n.value);
                    const missingModels = modelNodes.filter(n => !this.availableModels.includes(n.value));
                    if (missingModels.length > 0) {
                        await this.loadModels();
                    }
                    this._markMissingModels();
                    this._markMissingPromptQuestions();

                    this.renderAssociationCanvas({ center: false });
                    this.renderPromptList();
                    this.renderQuestionList();
                    this.loadHistoryResults();
                    this.canvasState.history = [];
                    this.canvasHistoryIndex = -1;
                    this.saveCanvasSnapshot();
                    try { await this.renderArchiveSelector(); } catch (e) { console.error('加载存档失败', e); }
                    this.initDropdowns();
                    ['temperature', 'concurrency', 'testCount', 'maxRetries', 'contextSize', 'topP', 'minP', 'topK'].forEach(p => this.updateSliderVisual(p));
                    const overlay = document.getElementById('loadingOverlay');
                    if (overlay) {
                        overlay.classList.add('hidden');
                        setTimeout(() => { if (overlay.parentNode) overlay.remove(); }, 500);
                    }
                    window.addEventListener('resize', this.debouncedCanvasResize.bind(this));
                },

                async loadConfig() {
                    try {
                        const response = await fetchWithTimeout('/api/v1/config');
                        const config = await response.json();
                        document.getElementById('testSetDir').value = config.test_set_dir || '';
                        this._lastTestSetDir = config.test_set_dir || '';
                        document.getElementById('apiKey').value = config.api_key || '';
                        document.getElementById('baseUrl').value = config.base_url || '';
                        const setSlider = (id, val) => {
                            const container = document.getElementById('modal-' + id);
                            const input = document.getElementById('modal-' + id + 'Input');
                            if (container) {
                                const native = container.querySelector('.slider-native');
                                if (native) native.value = val;
                            }
                            if (input) input.value = val;
                            this.updateSliderVisual(id);
                        };
                        setSlider('temperature', config.temperature ?? 0.7);
                        setSlider('concurrency', config.concurrency ?? 1);
                        setSlider('testCount', config.test_count ?? 1);
                        setSlider('maxRetries', config.max_retries ?? 3);
                        setSlider('contextSize', config.context_size ?? 8192);
                        setSlider('topP', config.top_p ?? 1.0);
                        setSlider('topK', config.top_k ?? 40);
                        setSlider('minP', config.min_p ?? 0.05);
                        document.getElementById('modal-streaming').checked = config.streaming === true;
                        document.getElementById('autoAppendV1').checked = config.auto_append_v1 !== false;
                        document.getElementById('autoConnectToggle').checked = config.auto_connect !== false;
                        if (config.api_key) { await this.loadModels(); }
                        if (config.models && Array.isArray(config.models)) {
                            this.selectedModels = config.models;
                            document.getElementById('selectedModelCount').textContent = this.selectedModels.length;
                        }
                    } catch (error) {
                        console.error('Failed to load config:', error);
                        showToast('无法连接服务器，请检查后端', 'error');
                    }
                },

                onCanvasResize() { this.renderLines(); },
                debouncedCanvasResize: debounce(function() { this.renderLines(); this.updateCoordDisplay(); }, 150),
                debouncedConfigChange: debounce(function() { this.onConfigChange(); }, 500),
                debouncedAutoSave: debounce(function() { this.saveCanvas(); }, 500)
            };

            document.addEventListener('mousemove', function(e) {
                if (App.isDragging) return;
                if (App.canvasBoxState) {
                    const wp = App.getWorldPos(e.clientX, e.clientY);
                    App.canvasBoxState.curX = wp.x;
                    App.canvasBoxState.curY = wp.y;
                    const lx = Math.min(App.canvasBoxState.startX, wp.x);
                    const ly = Math.min(App.canvasBoxState.startY, wp.y);
                    const rx = Math.max(App.canvasBoxState.startX, wp.x);
                    const ry = Math.max(App.canvasBoxState.startY, wp.y);
                    const overlay = document.getElementById('boxSelectOverlay');
                    if (overlay) {
                        overlay.style.left = (lx * App.scale + App.panX) + 'px';
                        overlay.style.top = (ly * App.scale + App.panY) + 'px';
                        overlay.style.width = ((rx - lx) * App.scale) + 'px';
                        overlay.style.height = ((ry - ly) * App.scale) + 'px';
                    }
                }
                if (App.canvasPanState) {
                    App.closeAllSelectors();
                    App.panX = App.canvasPanState.origPanX + (e.clientX - App.canvasPanState.startX);
                    App.panY = App.canvasPanState.origPanY + (e.clientY - App.canvasPanState.startY);
                    App.clampPan();
                    App.applyViewTransform();
                }
            });

            document.addEventListener('mouseup', function() {
                if (App.canvasPanState) {
                    const c = document.getElementById('comfyCanvasContainer');
                    if (c) c.classList.remove('grabbing');
                    App.canvasPanState = null;
                    App.debouncedAutoSave();
                }
                if (App.canvasBoxState) {
                    App.finalizeBoxSelect();
                }
            });

            document.getElementById('paramsModal').addEventListener('click', function(e) {
                if (e.target === this) App.toggleParamsModal();
            });

            document.addEventListener('click', function(e) {
                const selItem = e.target.closest('.comfy-sel-item');
                if (selItem) {
                    const nodeId = selItem.dataset.nodeId;
                    const type = selItem.dataset.type;
                    const index = parseInt(selItem.dataset.index, 10);
                    App.onSelectorPick(nodeId, type, index);
                    return;
                }
                if (!e.target.closest('.comfy-sel-popup') && !e.target.closest('.comfy-node-body') && !e.target.closest(
                        '.comfy-socket')) {
                    App.closeAllSelectors();
                }
            });

            document.addEventListener('keydown', function(e) {
                if ((e.ctrlKey || e.metaKey) && e.key === 'z' && !e.shiftKey) {
                    e.preventDefault();
                    App.canvasUndo();
                } else if ((e.ctrlKey || e.metaKey) && (e.key === 'y' || (e.key === 'z' && e.shiftKey))) {
                    e.preventDefault();
                    App.canvasRedo();
                }
            });

            App.init();
        })();
    </script>
</body>
</html>
