                    this.renderAssociationCanvas({ center: true });
                    this._saveSelectionToLocalStorage();
                    this.saveCanvasSnapshot();
                },

                togglePromptByTestSetTag(testSet, tag) {
                    this.saveUndoSnapshot();
                    const matching = this.prompts.filter(p => p.testSet === testSet && (p.tag || '未分类') === tag);
                    console.log('[togglePromptByTestSetTag] testSet:', testSet, 'tag:', tag, 'matching prompts:', matching.length);
                    if (matching.length === 0) {
                        console.log('[togglePromptByTestSetTag] No matching prompts for testSet:', testSet, 'tag:', tag);
                        return;
                    }
                    const anySelected = matching.some(p => this.selectedPrompts.has(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`));
                    if (anySelected) {
                        matching.forEach(p => {
                            this.selectedPrompts.delete(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                            this.autoDeselectQuestions(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                        });
                    } else {
                        matching.forEach(p => {
                            const key = `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`;
                            this.selectedPrompts.add(key);
                            this.autoSelectQuestions(key);
                        });
                    }
                    this.renderPromptList();
                    this.renderQuestionList();
                    this.syncCanvasFromSelection();
                    this._saveSelectionToLocalStorage();
                },

                autoSelectQuestions(promptKey) {
                    const prompt = this.prompts.find(p => `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}` === promptKey);
                    if (!prompt) {
                        console.log('[autoSelectQuestions] prompt not found for key:', promptKey);
                        return;
                    }
                    const defaultFiles = prompt.default_questions || [];
                    console.log('[autoSelectQuestions] promptKey:', promptKey, 'prompt.testSet:', prompt.testSet, 'defaultFiles:', JSON.stringify(defaultFiles));
                    if (defaultFiles.length === 0) return;
                    this.questions.forEach(q => {
                        console.log('[autoSelectQuestions]   q.testSet:', q.testSet, 'q.file:', q.file, 'q.id:', q.id, 'prompt.testSet:', prompt.testSet);
                        if (!q.testSet || !prompt.testSet || q.testSet !== prompt.testSet) {
                            console.log('[autoSelectQuestions]     SKIP - testSet mismatch');
                            return;
                        }
                        const match = defaultFiles.some(df => {
                            const dfName = df.replace(/\\/g, '/').split('/').pop();
                            return dfName === q.file;
                        });
                        console.log('[autoSelectQuestions]     match:', match);
                        if (match) {
                            this.selectedQuestions.add(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`);
                        }
                    });
                },

                autoDeselectQuestions(promptKey) {
                    const prompt = this.prompts.find(p => `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}` === promptKey);
                    if (!prompt) return;
                    const defaultFiles = prompt.default_questions || [];
                    if (defaultFiles.length === 0) return;
                    this.questions.forEach(q => {
                        if (!q.testSet || !prompt.testSet || q.testSet !== prompt.testSet) return;
                        const match = defaultFiles.some(df => {
                            const dfName = df.replace(/\\/g, '/').split('/').pop();
                            return dfName === q.file;
                        });
                        if (!match) return;
                        const qKey = `q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`;
                        const stillNeeded = this.prompts.some(otherP => {
                            if (otherP.testSet !== prompt.testSet) return false;
                            if (!this.selectedPrompts.has(`p_${otherP.testSet || '未分类'}_${otherP.id}_${otherP.file || ''}`)) return false;
                            if (otherP === prompt) return false;
                            return (otherP.default_questions || []).some(df => {
                                const dfName = df.replace(/\\/g, '/').split('/').pop();
                                return dfName === q.file;
                            });
                        });
                        if (!stillNeeded) {
                            this.selectedQuestions.delete(qKey);
                        }
                    });
                },

                toggleQuestion(key) {
                    this.saveUndoSnapshot();
                    if (this.selectedQuestions.has(key)) this.selectedQuestions.delete(key);
                    else this.selectedQuestions.add(key);
                    this.renderQuestionList();
                    this.syncCanvasFromSelection();
                    this._saveSelectionToLocalStorage();
                },

                selectAllPrompts() {
                    this.saveUndoSnapshot();
                    const searchText = document.getElementById('promptSearch').value.toLowerCase();
                    this.prompts.filter(p => this.matchesTestSet(p) && this.matchesTag(p) && this.matchesSearch(p,
                        searchText)).forEach(p => {
                        this.selectedPrompts.add(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                        this.autoSelectQuestions(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                    });
                    this.renderPromptList();
                    this.renderQuestionList();
                    this.syncCanvasFromSelection();
                    this._saveSelectionToLocalStorage();
                },

                selectNonePrompts() {
                    this.saveUndoSnapshot();
                    const searchText = document.getElementById('promptSearch').value.toLowerCase();
                    this.prompts
                        .filter(p => this.matchesTestSet(p) && this.matchesTag(p) && this.matchesSearch(p, searchText))
                        .forEach(p => {
                            this.selectedPrompts.delete(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                            this.autoDeselectQuestions(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                        });
                    this.renderPromptList();
                    this.renderQuestionList();
                    this.syncCanvasFromSelection();
                    this._saveSelectionToLocalStorage();
                },

                selectAllQuestions() {
                    this.saveUndoSnapshot();
                    const searchText = document.getElementById('questionSearch').value.toLowerCase();
                    this.questions.filter(q => this.matchesTestSet(q) && this.matchesTag(q) && this.matchesSearch(q,
                        searchText)).forEach(q => {
                        this.selectedQuestions.add(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`);
                    });
                    this.renderQuestionList();
                    this.syncCanvasFromSelection();
                    this._saveSelectionToLocalStorage();
                },

                selectNoneQuestions() {
                    this.saveUndoSnapshot();
                    const searchText = document.getElementById('questionSearch').value.toLowerCase();
                    this.questions
                        .filter(q => this.matchesTestSet(q) && this.matchesTag(q) && this.matchesSearch(q, searchText))
                        .forEach(q => this.selectedQuestions.delete(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`));
                    this.renderQuestionList();
                    this.syncCanvasFromSelection();
                    this._saveSelectionToLocalStorage();
                },

                createAggregateNode(type, tag, testSet, count, x, y) {
                    const id = 'n_' + type + '_' + generateId();
                    return {
                        id,
                        type,
                        tag: tag,  // 对于聚合节点，tag是聚合键值（可能为testSet值或语义tag，见computeTagAggregation）
                        testSet,
                        value: tag,
                        display: tag || '',
                        count: count || 0,
                        x,
                        y,
                        autoLayout: false,
                        _v: 2
                    };
                },

                computeTagAggregation(selectedSet, sourceArray, keyFn, groupBy) {
                    const agg = {};
                    sourceArray.forEach(item => {
                        const key = keyFn(item);
                        if (!selectedSet.has(key)) return;
                        const ts = item.testSet || '未分类';
                        if (groupBy === 'testSet') {
                            // 注意：此处的tag字段实际存储的是testSet值（聚合键），而非语义上的tag，但在下游被用作node.tag以维持画布节点匹配逻辑
                            if (!agg[ts]) agg[ts] = { tag: ts, testSet: ts, count: 0 };
                            agg[ts].count++;
                        } else {
                            const tag = item.tag || '未分类';
                            if (!agg[tag]) agg[tag] = { tag, testSet: ts, count: 0 };
                            agg[tag].count++;
                        }
                    });
                    return agg;
                },

                syncCanvasFromSelection() {
                    if (this._canvasSyncDisabled) return;
                    const promptAgg = this.computeTagAggregation(this.selectedPrompts, this.prompts, p =>
                        `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`, 'testSet');
                    const questionAgg = this.computeTagAggregation(this.selectedQuestions, this.questions, q =>
                        `q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`, 'testSet');

                    const tagIndex = {};
                    this.canvasState.nodes.forEach(n => {
                        if (n.tag && n.type !== 'model') {
                            if (!tagIndex[n.type]) tagIndex[n.type] = {};
                            tagIndex[n.type][n.tag] = n.id;
                        }
                    });

                    Object.entries(promptAgg).forEach(([tag, agg]) => {
                        const existingId = tagIndex.prompt?.[tag];
                        if (existingId) {
                            const node = this.canvasState.nodes.find(n => n.id === existingId);
                            if (node) { node.count = agg.count; node.display = tag; }
                        } else {
                            const node = this.createAggregateNode('prompt', tag, agg.testSet, agg.count, this.getColumnX('prompt'), 0);
                            this.canvasState.nodes.push(node);
                        }
                    });

                    Object.entries(questionAgg).forEach(([tag, agg]) => {
                        const existingId = tagIndex.question?.[tag];
                        if (existingId) {
                            const node = this.canvasState.nodes.find(n => n.id === existingId);
                            if (node) { node.count = agg.count; node.display = tag; }
                        } else {
                            const node = this.createAggregateNode('question', tag, agg.testSet, agg.count, this.getColumnX('question'), 0);
                            this.canvasState.nodes.push(node);
                        }
                    });

                    this.canvasState.nodes = this.canvasState.nodes.filter(n => {
                        if (n.type === 'model') return true;
                        if (!n.tag) return true;
                        if (n.type === 'prompt') return !!promptAgg[n.tag];
                        if (n.type === 'question') return !!questionAgg[n.tag];
                        return true;
                    });

                    this.reorderNodesByTag('prompt');
                    this.reorderNodesByTag('question');
                    this.autoConnectCanvas();
                    this.renderAssociationCanvas({ center: false });
                    this.saveCanvasSnapshot();
                    this.debouncedAutoSave();
                },

                reorderNodesByTag(type) {
                    const allNodes = this.canvasState.nodes.filter(n => n.type === type && n.tag);
                    allNodes.sort((a, b) => (a.tag || '').localeCompare(b.tag || ''));
                    const unpositioned = allNodes.filter(n => n.y === 0);
                    if (unpositioned.length === 0) return;
                    const positioned = allNodes.filter(n => n.y !== 0);
                    let y = positioned.length > 0
                        ? Math.max(...positioned.map(n => n.y)) + NODE_GAP_Y
                        : START_Y;
                    unpositioned.forEach(n => { n.y = y; y += NODE_GAP_Y; });
                },

                findAnchorNode() {
                    const nodes = this.canvasState.nodes;
                    let anchor = nodes.find(n => n.type === 'prompt');
                    if (anchor) return anchor;
                    anchor = nodes.find(n => n.type === 'question');
                    if (anchor) return anchor;
                    anchor = nodes.find(n => n.type === 'model');
                    return anchor || null;
                },

                getColumnX(type) {
                    const anchor = this.findAnchorNode();
                    const c = document.getElementById('comfyCanvasContainer');
                    const maxGap = 32 * this.GRID;
                    const minGap = this.NODE_W + 2.5 * this.GRID;
                    const colGap = Math.max(minGap, Math.min(maxGap, (c && c.clientWidth > 0)
                        ? c.clientWidth * 0.25
                        : 450));
                    const snap = v => Math.round(v / this.GRID) * this.GRID;
                    const snapRight = v => Math.round((v + this.NODE_W) / this.GRID) * this.GRID - this.NODE_W;
                    const snapCenter = v => Math.round((v - 0.25 * this.GRID) / this.GRID) * this.GRID + 0.25 * this.GRID;
                    const offset = this.NODE_W / 2;
                    const defaultX = (t) => t === 'prompt' ? snap(WORLD_CENTER_X - colGap - offset) :
                                          t === 'question' ? snapCenter(WORLD_CENTER_X - offset) :
                                          snapRight(WORLD_CENTER_X + colGap - offset + this.GRID);
                    if (!anchor) {
                        return defaultX(type);
                    }
                    return anchor.x + (defaultX(type) - defaultX(anchor.type));
                },

                repositionNodesRelative() {
                    const snap = v => Math.round(v / this.GRID) * this.GRID;
                    const c = document.getElementById('comfyCanvasContainer');
                    const maxGap = 32 * this.GRID;
                    const minGap = this.NODE_W + 2.5 * this.GRID;
                    const colGap = Math.max(minGap, Math.min(maxGap, (c && c.clientWidth > 0)
                        ? c.clientWidth * 0.25
                        : 450));
                    const offset = this.NODE_W / 2;
                    const snapRight = v => Math.round((v + this.NODE_W) / this.GRID) * this.GRID - this.NODE_W;
                    const snapCenter = v => Math.round((v - 0.25 * this.GRID) / this.GRID) * this.GRID + 0.25 * this.GRID;
                    this.canvasState.nodes.forEach(n => {
                        if (n.type === 'prompt') n.x = snap(WORLD_CENTER_X - colGap - offset);
                        else if (n.type === 'question') n.x = snapCenter(WORLD_CENTER_X - offset);
                        else if (n.type === 'model') n.x = snapRight(WORLD_CENTER_X + colGap - offset + this.GRID);
                    });
                },

                autoConnectCanvas() {
                    const manualConns = this.canvasState.connections.filter(c => c._manual);
                    this.canvasState.connections = [...manualConns];
                    const autoConnect = document.getElementById('autoConnectToggle')?.checked;
                    if (autoConnect === false) return;
                    const pNodes = this.canvasState.nodes.filter(n => n.type === 'prompt' && n.value);
                    const qNodes = this.canvasState.nodes.filter(n => n.type === 'question' && n.value);
                    const mNodes = this.canvasState.nodes.filter(n => n.type === 'model' && n.value);
                    const newConns = [];
                    for (const p of pNodes) {
                        for (const q of qNodes) {
                            if (p.tag && q.tag && p.tag !== q.tag) continue;
                            const exists = this.canvasState.connections.some(c => c.from === p.id && c.to === q.id);
                            if (!exists) newConns.push({ from: p.id, to: q.id });
                        }
                    }
                    for (const q of qNodes) {
                        for (const m of mNodes) {
                            const exists = this.canvasState.connections.some(c => c.from === q.id && c.to === m.id);
                            if (!exists) newConns.push({ from: q.id, to: m.id });
                        }
                    }
                    this.canvasState.connections.push(...newConns);
                },

                addNode(type) {
                    const snap = v => Math.round(v / this.GRID) * this.GRID;
                    const x = this.getColumnX(type);
                    const sameTypeNodes = this.canvasState.nodes.filter(n => n.type === type);
                    let y = sameTypeNodes.length > 0 ?
                        snap(Math.max(...sameTypeNodes.map(n => n.y || 0)) + NODE_GAP_Y) :
                        START_Y;
                    while (this.canvasState.nodes.some(n =>
                        Math.abs(n.x - x) < 10 && Math.abs(n.y - y) < NODE_GAP_Y
                    )) {
                        y += NODE_GAP_Y;
                    }
                    const id = 'n_' + type + '_' + generateId();
                    this.canvasState.nodes.push({ id, type, value: '', x, y, autoLayout: false });
                    this.autoConnectCanvas();
                    this.renderAssociationCanvas({ center: true });
                    this.syncModelNodesToCanvas();
                    this.saveCanvasSnapshot();
                    this.debouncedAutoSave();
                },

                async removeNode(nodeId) {
                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    if (!(await this.showConfirm('确定删除该节点？相关连线也会被删除。'))) return;
                    if (node.type === 'prompt') {
                        if (node.value) {
                            const p = this.prompts.find(pr => `${pr.testSet || ''} ${pr.tag || ''} #${pr.id}` === node.value);
                            if (p) this.selectedPrompts.delete(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`);
                        }
                        this.selectedPrompts.delete(nodeId);
                        this._saveSelectionToLocalStorage();
                        this.renderPromptList();
                    } else if (node.type === 'question') {
                        if (node.value) {
                            const q = this.questions.find(qu => `${qu.testSet || ''} ${qu.tag || ''} #${qu.id}` === node.value);
                            if (q) this.selectedQuestions.delete(`q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`);
                        }
                        this.selectedQuestions.delete(nodeId);
                        this._saveSelectionToLocalStorage();
                        this.renderQuestionList();
                    } else if (node.type === 'model' && node.value) {
                        const idx = this.selectedModels.indexOf(node.value);
                        if (idx !== -1) { this.selectedModels.splice(idx, 1); this.persistSelectedModels(); }
                    }
                    this.canvasState.nodes = this.canvasState.nodes.filter(n => n.id !== nodeId);
                    this.canvasState.connections = this.canvasState.connections.filter(c => c.from !== nodeId && c.to !=
                        nodeId);
                    this.autoConnectCanvas();
                    this.renderAssociationCanvas({ center: false });
                    this.saveCanvasSnapshot();
                    this.debouncedAutoSave();
                },

                async saveCanvas() {
                    try {
                        const cleanNodes = this.canvasState.nodes.map(n => {
                            const { autoLayout, _notFound, ...rest } = n;
                            return { ...rest, x: n.x || 0, y: n.y || 0, _v: 2 };
                        });
                        await fetchWithTimeout('/api/v1/canvas-state', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                nodes: cleanNodes,
                                connections: this.canvasState.connections,
                                selectedPrompts: Array.from(this.selectedPrompts),
                                selectedQuestions: Array.from(this.selectedQuestions),
                                selectedModels: this.selectedModels,
                                viewport: { panX: this.panX, panY: this.panY, scale: this.scale }
                            })
                        });
                        showToast('画布状态已保存', 'success');
                    } catch (error) {
                        showToast('保存失败: ' + friendlyError(error.message), 'error');
                    }
                },

                async _getLinkSaves() {
                    try {
                        const res = await fetchWithTimeout('/api/v1/archives');
                        const data = await res.json();
                        return Array.isArray(data) ? data : [];
                    } catch (e) {
                        return [];
                    }
                },

                async _setLinkSaves(saves) {
                    const res = await fetchWithTimeout('/api/v1/archives', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(saves)
                    });
                    if (!res.ok) throw new Error('服务器返回 ' + res.status);
                },

                async saveArchive() {
                    const name = await this.showPrompt('请输入存档名称：', '存档 ' + new Date().toLocaleString('zh-CN'));
                    if (!name) return;
                    const selectedPromptItems = [];
                    this.selectedPrompts.forEach(key => {
                        const p = this.prompts.find(pr => `p_${pr.testSet || '未分类'}_${pr.id}_${pr.file || ''}` === key);
                        if (p) selectedPromptItems.push({ id: p.id, file: p.file, testSet: p.testSet, tag: p.tag });
                    });
                    const selectedQuestionItems = [];
                    this.selectedQuestions.forEach(key => {
                        const q = this.questions.find(qu => `q_${qu.testSet || '未分类'}_${qu.id}_${qu.file || ''}` === key);
                        if (q) selectedQuestionItems.push({ id: q.id, file: q.file, testSet: q.testSet, tag: q.tag, question: q.question });
                    });
                    const archive = {
                        id: generateId(),
                        name: name,
                        timestamp: Date.now(),
                        nodes: this.canvasState.nodes.map(n => {
                            const { autoLayout, _notFound, ...rest } = n;
                            return { ...rest, x: n.x || 0, y: n.y || 0, _v: 2 };
                        }),
                        connections: JSON.parse(JSON.stringify(this.canvasState.connections)),
                        selectedPrompts: selectedPromptItems,
                        selectedQuestions: selectedQuestionItems,
                        selectedModels: [...this.selectedModels],
                        viewport: { panX: this.panX, panY: this.panY, scale: this.scale }
                    };
                    const saves = await this._getLinkSaves();
                    saves.push(archive);
                    try {
                        await this._setLinkSaves(saves);
                        await this.renderArchiveSelector();
                        showToast('存档已保存: ' + name, 'success');
                    } catch (e) {
                        showToast('存档保存失败: ' + friendlyError(e.message), 'error');
                    }
                },

                async loadArchive(archiveId) {
                    if (!archiveId) return;
                    const saves = await this._getLinkSaves();
                    const archive = saves.find(s => s.id === archiveId);
                    if (!archive) {
                        showToast('存档不存在', 'error');
                        return;
                    }
                    this._canvasSyncDisabled = true;
                    this.canvasState.nodes = JSON.parse(JSON.stringify(archive.nodes || []));
                    this.canvasState.connections = JSON.parse(JSON.stringify(archive.connections || []));
                    this.selectedPrompts = new Set();
                    this.selectedQuestions = new Set();
                    if (archive.selectedPrompts && archive.selectedPrompts.length > 0) {
                        archive.selectedPrompts.forEach(p => {
                            const key = `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`;
                            this.selectedPrompts.add(key);
                        });
                    }
                    if (archive.selectedQuestions && archive.selectedQuestions.length > 0) {
                        archive.selectedQuestions.forEach(q => {
                            const key = `q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`;
                            this.selectedQuestions.add(key);
                        });
                    }
                    if (archive.selectedModels) {
                        this.selectedModels = [...archive.selectedModels];
                    }
                    this.updateSelectedModelCount();
                    this.canvasToSelectedModels();
                    this._markMissingModels();
                    this._markMissingPromptQuestions();
                    this.renderPromptList();
                    this.renderQuestionList();
                    this.renderAssociationCanvas({ center: false });
                    if (archive.viewport) {
                        this.panX = archive.viewport.panX || 0;
                        this.panY = archive.viewport.panY || 0;
                        this.scale = archive.viewport.scale || 1;
                        this.applyViewTransform();
                    }
                    this.canvasState.history = [];
                    this.canvasHistoryIndex = -1;
                    this.saveCanvasSnapshot();
                    this._canvasSyncDisabled = false;
                    this.syncCanvasFromSelection();
                    document.getElementById('archiveSelector').value = '';
                    showToast('已加载存档: ' + archive.name, 'success');
                },

                async deleteArchive(archiveId) {
                    if (!archiveId) {
                        showToast('请先选择一个存档', 'warning');
                        return;
                    }
                    if (!(await this.showConfirm('确定删除此存档？'))) return;
                    const saves = await this._getLinkSaves();
                    const idx = saves.findIndex(s => s.id === archiveId);
                    if (idx !== -1) {
                        saves.splice(idx, 1);
                        try {
                            await this._setLinkSaves(saves);
                            await this.renderArchiveSelector();
                            showToast('存档已删除', 'success');
                        } catch (e) {
                            showToast('存档删除失败: ' + friendlyError(e.message), 'error');
                        }
                    }
                },

                async renderArchiveSelector() {
                    const dropdown = document.getElementById('archiveSelectorDropdown');
                    if (!dropdown) return;
                    const saves = await this._getLinkSaves();
                    let html = '<div class="custom-select-option selected" data-value="" onclick="App.selectDropdownOption(\'archiveSelector\', \'\', \'读取存档\')">读取存档</div>';
                    saves.forEach(s => {
                        const date = new Date(s.timestamp).toLocaleString('zh-CN');
                        html += `<div class="custom-select-option" data-value="${this.escapeHtml(s.id)}" onclick="App.selectDropdownOption('archiveSelector', '${this.escapeHtml(s.id)}', '${this.escapeHtml(s.name)}')">${this.escapeHtml(s.name)} (${date})</div>`;
                    });
                    dropdown.innerHTML = html;
                },

                async loadCanvasState() {
                    this._hasSavedCanvas = false;
                    try {
                        const response = await fetchWithTimeout('/api/v1/canvas-state');
                        const data = await response.json();
                        if (data.nodes && data.nodes.length > 0) {
                            const isV2 = data.nodes.some(n => n._v === 2);
                            if (isV2) {
                                this._hasSavedCanvas = true;
                                this.canvasState.nodes = data.nodes;
                                this.canvasState.connections = data.connections || [];
                                this.canvasState.selectedPrompts = data.selectedPrompts || null;
                                this.canvasState.selectedQuestions = data.selectedQuestions || null;
                                this.canvasState.selectedModels = data.selectedModels || null;
                            } else {
                                this.canvasState.nodes = [];
                                this.canvasState.connections = [];
                                this.initDefaultCanvas();
                                return;
                            }
                            if (data.selectedModels && Array.isArray(data.selectedModels)) {
                                this.selectedModels = data.selectedModels;
                            }
                            if (this.selectedModels.length === 0) {
                                this.selectedModels = this.canvasState.nodes
                                    .filter(n => n.type === 'model' && n.value)
                                    .map(n => n.value);
                            }
                            // Don't call updateSelectedModelCount() here - it triggers syncModelNodesToCanvas()
                            // which would recreate model nodes and lose their positions.
                            // Just update the display count.
                            document.getElementById('selectedModelCount').textContent = this.selectedModels.length;
                            if (data.viewport) {
                                this.panX = data.viewport.panX || 0;
                                this.panY = data.viewport.panY || 0;
                                this.scale = data.viewport.scale || 1;
                            }
                            this.renderAssociationCanvas({ center: false });
                            if (data.viewport) {
                                this.applyViewTransform();
                            } else {
                                setTimeout(() => this.centerCanvasOnNodes(), 0);
                            }
                        } else {
                            this.initDefaultCanvas();
                        }
                    } catch (error) {
                        console.error('Failed to load canvas state:', error);
                        this.showToast('加载画布状态失败，已使用默认布局', 'warning');
                        this.initDefaultCanvas();
                    }
                },

                initDefaultCanvas() {
                    this.canvasState.nodes = [];
                    this.canvasState.connections = [];

                    const promptAgg = this.computeTagAggregation(this.selectedPrompts, this.prompts, p =>
                        `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`, 'testSet');
                    let y = START_Y;
                    Object.keys(promptAgg).sort().forEach(key => {
                        const { testSet, count } = promptAgg[key];
                        const node = this.createAggregateNode('prompt', key, testSet, count, this.getColumnX('prompt'), y);
                        this.canvasState.nodes.push(node);
                        y += NODE_GAP_Y;
                    });

                    const questionAgg = this.computeTagAggregation(this.selectedQuestions, this.questions, q =>
                        `q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`, 'testSet');
                    let qy = START_Y;
                    Object.keys(questionAgg).sort().forEach(key => {
                        const { tag, testSet, count } = questionAgg[key];
                        const node = this.createAggregateNode('question', tag, testSet, count, this.getColumnX('question'), qy);
                        this.canvasState.nodes.push(node);
                        qy += NODE_GAP_Y;
                    });

                    this.repositionNodesRelative();
                    const c = document.getElementById('comfyCanvasContainer');
                    if (c && c.clientWidth > 0) {
                        this.scale = 1;
                        this.panX = c.clientWidth / 2 - WORLD_CENTER_X * this.scale;
                        this.panY = c.clientHeight * 0.35 - WORLD_CENTER_Y * this.scale;
                    }
                    this.renderAssociationCanvas({ center: false });
                },

                renderLines() {
                    if (this._linesRaf) return;
                    this._linesRaf = requestAnimationFrame(() => {
                        this._linesRaf = null;
                        this._doRenderLines();
                    });
                },

                _doRenderLines() {
                    const svg = document.getElementById('comfyLinesSvg');
                    if (!svg) return;
                    if (!svg.getAttribute('width')) {
                        svg.setAttribute('width', '10000');
                        svg.setAttribute('height', '10000');
                        svg.style.width = '10000px';
                        svg.style.height = '10000px';
                        this._renderGrid(svg);
                    }

                    const connKey = (c) => `${c.from}_${c.to}`;
                    const activeKeys = new Set(this.canvasState.connections.map(connKey));
                    let connGroup = svg.querySelector('.comfy-conn-group:not(.temp)');
                    if (!connGroup) {
                        connGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                        connGroup.setAttribute('class', 'comfy-conn-group');
                        svg.appendChild(connGroup);
                    }

                    const pathByKey = new Map();
                    connGroup.querySelectorAll('path').forEach(p => {
                        const k = p.dataset.connKey;
                        if (k) pathByKey.set(k, p);
                    });

                    this.canvasState.connections.forEach(conn => {
                        const k = connKey(conn);
                        const fromNode = this.canvasState.nodes.find(n => n.id === conn.from);
                        const toNode = this.canvasState.nodes.find(n => n.id === conn.to);
                        if (!fromNode || !toNode) return;
                        const x1 = (fromNode.x || 0) + this.NODE_W;
                        const y1 = (fromNode.y || 0) + 40;
                        const x2 = (toNode.x || 0);
                        const y2 = (toNode.y || 0) + 40;
                        const dx = Math.abs(x2 - x1) * 0.5;
                        const d = `M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}`;
                        const lineClass = fromNode.type === 'prompt' ? 's-question' : 
                                          fromNode.type === 'question' ? 's-model' : `s-${fromNode.type}`;

                        let path = pathByKey.get(k);
                        if (path) {
                            path.setAttribute('d', d);
                            path.setAttribute('class', `comfy-line ${lineClass}`);
                            pathByKey.delete(k);
                        } else {
                            path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                            path.dataset.connKey = k;
                            path.setAttribute('d', d);
                            path.setAttribute('class', `comfy-line ${lineClass}`);
                            path.onclick = () => {
                                App.showConfirm('删除此连线？').then(ok => {
                                    if (ok) {
                                        this.canvasState.connections = this.canvasState.connections.filter(c => c
                                            .from !== conn.from || c.to !== conn.to);
                                        this.renderLines();
                                        this.saveCanvasSnapshot();
                                    }
                                });
                            };
                            connGroup.appendChild(path);
                        }
                    });

                    pathByKey.forEach(p => p.remove());

                    const existingTemp = svg.querySelector('.comfy-conn-group.temp');
                    if (existingTemp) existingTemp.remove();

                    if (this.socketDragState && this.socketDragState.tempLine) {
                        const tempGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                        tempGroup.setAttribute('class', 'comfy-conn-group temp');
                        const tempLine = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        tempLine.setAttribute('d', this.socketDragState.tempLine);
                        tempLine.setAttribute('class', `comfy-line temp s-${this.socketDragState.typeClass}`);
                        tempGroup.appendChild(tempLine);
                        svg.appendChild(tempGroup);
                    }
                },

                _renderGrid(svg) {
                    const ns = 'http://www.w3.org/2000/svg';
                    const step = 20;
                    const w = parseFloat(svg.getAttribute('width')) || 400;
                    const h = parseFloat(svg.getAttribute('height')) || 400;
                    let g = svg.querySelector('.comfy-grid-group');
                    if (!g) {
                        g = document.createElementNS(ns, 'g');
                        g.setAttribute('class', 'comfy-grid-group');
                        svg.insertBefore(g, svg.firstChild);
                    }
                    g.innerHTML = '';
                    const lines = [];
                    for (let x = step; x < w; x += step) {
                        const line = document.createElementNS(ns, 'line');
                        line.setAttribute('x1', x);
                        line.setAttribute('y1', 0);
                        line.setAttribute('x2', x);
                        line.setAttribute('y2', h);
                        line.setAttribute('class', 'comfy-grid-line');
                        lines.push(line);
                    }
                    for (let y = step; y < h; y += step) {
                        const line = document.createElementNS(ns, 'line');
                        line.setAttribute('x1', 0);
                        line.setAttribute('y1', y);
                        line.setAttribute('x2', w);
                        line.setAttribute('y2', y);
                        line.setAttribute('class', 'comfy-grid-line');
                        lines.push(line);
                    }
                    const fragment = document.createDocumentFragment();
                    lines.forEach(l => fragment.appendChild(l));
                    g.appendChild(fragment);
                },

                _lastRenderScale: 1,
                applyViewTransform() {
                    const world = document.getElementById('comfyCanvasWorld');
                    if (world) world.style.transform = `translate(${this.panX}px,${this.panY}px)`;
                    const svg = document.getElementById('comfyLinesSvg');
                    if (svg) svg.style.transform = `scale(${this.scale})`;
                    const nodes = document.getElementById('comfyCanvasNodes');
                    if (nodes) nodes.style.transform = `scale(${this.scale})`;
                    const scaleDiff = Math.abs(this.scale - this._lastRenderScale);
                    if (scaleDiff > 0.1) {
                        this._lastRenderScale = this.scale;
                        this._forceRerender();
                    }
                    this.updateNodePositions();
                    this.updateCoordDisplay();
                },

                updateCoordDisplay() {
                    const el = document.getElementById('comfyCoord');
                    if (!el) return;
                    const c = document.getElementById('comfyCanvasContainer');
                    if (!c) return;
                    const cx = Math.round((-this.panX + c.clientWidth / 2) / this.scale);
                    const cy = Math.round((-this.panY + c.clientHeight / 2) / this.scale);
                    el.textContent = `${cx}, ${cy}`;
                },


                _forceRerender() {
                    const nodes = document.getElementById('comfyCanvasNodes');
                    if (!nodes) return;
                    const parent = nodes.parentNode;
                    const next = nodes.nextSibling;
                    parent.removeChild(nodes);
                    parent.insertBefore(nodes, next);
                },

                updateNodePositions() {
                    const nodesContainer = document.getElementById('comfyCanvasNodes');
                    if (!nodesContainer) return;
                    const nodeEls = nodesContainer.querySelectorAll('.comfy-node');
                    for (const el of nodeEls) {
                        const nodeId = el.dataset.nodeId;
                        const node = this.canvasState.nodes.find(n => n.id === nodeId);
                        if (!node) continue;
                        el.style.transform = `translate(${node.x || 0}px, ${node.y || 0}px)`;
                    }
                },

                clampPan() {
                    const c = document.getElementById('comfyCanvasContainer');
                    if (!c) return;
                    const cw = c.clientWidth,
                        ch = c.clientHeight;
                    const ws = 10000 * this.scale;
                    const hs = 10000 * this.scale;
                    const minX = cw > ws ? (cw - ws) / 2 : -(ws - cw);
                    const maxX = cw > ws ? (cw - ws) / 2 : 0;
                    const minY = ch > hs ? (ch - hs) / 2 : -(hs - ch);
                    const maxY = ch > hs ? (ch - hs) / 2 : 0;
                    this.panX = Math.min(maxX, Math.max(minX, this.panX));
                    this.panY = Math.min(maxY, Math.max(minY, this.panY));
                },

                centerCanvasOnNodes() {
                    const c = document.getElementById('comfyCanvasContainer');
                    if (!c || this.canvasState.nodes.length === 0) {
                        this.centerCanvasOnOrigin();
                        return;
                    }
                    if (c.clientWidth === 0 || c.clientHeight === 0) {
                        setTimeout(() => this.centerCanvasOnNodes(), 50);
                        return;
                    }
                    let minX = Infinity,
                        maxX = -Infinity,
                        minY = Infinity,
                        maxY = -Infinity;
                    this.canvasState.nodes.forEach(n => {
                        const nx = n.x || 0;
                        const ny = n.y || 0;
                        if (nx < minX) minX = nx;
                        if (nx + this.NODE_W > maxX) maxX = nx + this.NODE_W;
                        if (ny < minY) minY = ny;
                        if (ny + 80 > maxY) maxY = ny + 80;
                    });
                    const pad = 40;
                    const nodeW = maxX - minX;
                    const nodeH = maxY - minY;
                    if (nodeW === 0 && nodeH === 0) {
                        this.scale = 1;
                        this.panX = c.clientWidth / 2 - minX - this.NODE_W / 2;
                        this.panY = c.clientHeight / 2 - minY - 40;
                    } else {
                        const fitScaleX = nodeW > 0 ? (c.clientWidth - pad) / nodeW : 999;
                        const fitScaleY = nodeH > 0 ? (c.clientHeight - pad) / nodeH : 999;
                        const fitScale = Math.min(fitScaleX, fitScaleY);
                        this.scale = Math.min(1.5, Math.max(0.3, fitScale));
                        const cx = (minX + maxX) / 2;
                        const cy = (minY + maxY) / 2;
                        this.panX = c.clientWidth / 2 - cx * this.scale;
                        this.panY = c.clientHeight * 0.35 - cy * this.scale;
                    }
                    this.applyViewTransform();
                },

                centerCanvasOnOrigin() {
                    const c = document.getElementById('comfyCanvasContainer');
                    if (!c) return;
                    if (c.clientWidth === 0 || c.clientHeight === 0) {
                        setTimeout(() => this.centerCanvasOnOrigin(), 50);
                        return;
                    }
                    this.panX = c.clientWidth / 2 - WORLD_CENTER_X * this.scale;
                    this.panY = c.clientHeight / 2 - WORLD_CENTER_Y * this.scale;
                    this.clampPan();
                    this.applyViewTransform();
                },

                renderAssociationCanvas({ center = false } = {}) {
                    if (this.isDragging) return;
                    const canvas = document.getElementById('associationCanvas');
                    if (!canvas) return;
                    document.querySelectorAll('.comfy-node').forEach(el => {
                        el.getAnimations().forEach(anim => anim.cancel());
                    });

                    let nodesContainer = document.getElementById('comfyCanvasNodes');
                    if (!nodesContainer) {
                        canvas.innerHTML =
                            `<div class="comfy-canvas" id="comfyCanvasContainer">
                        <div class="comfy-canvas-world" id="comfyCanvasWorld" style="transform:translate(${this.panX}px,${this.panY}px)">
                            <svg class="comfy-lines-svg" id="comfyLinesSvg" style="transform:scale(${this.scale});transform-origin:0 0;"></svg>
                            <div class="comfy-canvas-nodes" id="comfyCanvasNodes" style="transform:scale(${this.scale});transform-origin:0 0;"></div>
                        </div>
                        <div class="comfy-sel-overlay" id="boxSelectOverlay" style="display:none;"></div>
                        <div class="comfy-coord" id="comfyCoord">0, 0</div>
                    </div>`;
                        nodesContainer = document.getElementById('comfyCanvasNodes');
                    } else {
                        const world = document.getElementById('comfyCanvasWorld');
                        if (world) world.style.transform = `translate(${this.panX}px,${this.panY}px)`;
                        const svg = document.getElementById('comfyLinesSvg');
                        if (svg) svg.style.transform = `scale(${this.scale})`;
                        const nodesEl = document.getElementById('comfyCanvasNodes');
                        if (nodesEl) nodesEl.style.transform = `scale(${this.scale})`;
                        const currentIds = new Set(this.canvasState.nodes.map(n => n.id));
                        nodesContainer.querySelectorAll('.comfy-node').forEach(el => {
                            if (!currentIds.has(el.dataset.nodeId)) el.remove();
                        });
                    }

                    const container = document.getElementById('comfyCanvasContainer');
                    const self = this;
                    const fragment = document.createDocumentFragment();

                    this.canvasState.nodes.forEach(node => {
                        let nodeEl = nodesContainer.querySelector(`.comfy-node[data-node-id="${node.id}"]`);
                        if (!nodeEl) {
                            nodeEl = document.createElement('div');
                            nodeEl.dataset.nodeId = node.id;
                            fragment.appendChild(nodeEl);
                        }
                        nodeEl.className = 'comfy-node' + (this.selectedNodeIds.has(node.id) ? ' selected' : '') + (node._notFound ? ' model-not-found' : '');

                        const typeClass = node.type;
                        const label = { prompt: '提示词', question: '问题', model: '模型' } [node.type] || node
                            .type;
                        const icon = {
                            prompt: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>',
                            question: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
                            model: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 2 7 2 17 12 22 22 17 22 7 12 2"/><line x1="12" y1="22" x2="12" y2="2"/><line x1="2" y1="7" x2="22" y2="7"/></svg>'
                        } [node.type] || '';
                        const isAggregate = !!node.tag;
                        let bodyHtml;
                        if (isAggregate) {
                            bodyHtml =
                                `<span class="comfy-node-val">${self.escapeHtml(node.display || node.value || '')}</span><span class="comfy-node-clear" onclick="event.stopPropagation();App.clearNodeValue('${node.id}')">×</span>`;
                        } else if (!node.value) {
                            bodyHtml = `<span class="comfy-node-empty">点击选择…</span>`;
                        } else {
                            const warnIcon = node._notFound ? '<span class="comfy-node-warn" title="该文件已不存在">⚠</span>' : '';
                            bodyHtml =
                                `<span class="comfy-node-val">${self.escapeHtml(node.value)}</span>${warnIcon}<span class="comfy-node-clear" onclick="event.stopPropagation();App.clearNodeValue('${node.id}')">×</span>`;
                        }

                        const hasSocketIn = node.type === 'question' || node.type === 'model';
                        const hasSocketOut = node.type === 'prompt' || node.type === 'question';
                        const socketOutClass = node.type === 'prompt' ? 's-question' : 
                                               node.type === 'question' ? 's-model' : `s-${typeClass}`;
                        const socketInHtml = hasSocketIn ?
                            `<div class="comfy-socket in s-${typeClass}" data-node="${node.id}" data-type="${node.type}" data-dir="in" onmousedown="event.stopPropagation();App.startSocketDrag(event,'${node.id}','${node.type}','in','${typeClass}')"><div class="comfy-socket-inner"></div></div>` :
                            '';
                        const socketOutHtml = hasSocketOut ?
                            `<div class="comfy-socket out ${socketOutClass}" data-node="${node.id}" data-type="${node.type}" data-dir="out" onmousedown="event.stopPropagation();App.startSocketDrag(event,'${node.id}','${node.type}','out','${socketOutClass.replace('s-', '')}')"><div class="comfy-socket-inner"></div></div>` :
                            '';
                        const closeBtnHtml =
                            `<div class="comfy-node-close" onclick="App.removeNode('${node.id}')">&times;</div>`;

                        const ownColor = { prompt: '#4F8CFF', question: '#20C997', model: '#FBBF24' } [typeClass];
                        const outSocketColor = hasSocketOut ? { prompt: '#20C997', question: '#FBBF24' } [typeClass] : null;
                        const headerGradient = outSocketColor
                            ? `background:linear-gradient(160deg, ${ownColor} 0%, ${ownColor} 50%, ${outSocketColor} 100%);`
                            : '';

                        nodeEl.innerHTML = `
                        ${closeBtnHtml}
                        <div class="comfy-node-header ${typeClass}" ${headerGradient ? `style="${headerGradient}"` : ''} onmousedown="App.startNodeDrag(event,'${node.id}')">${icon}${label}</div>
                        <div class="comfy-node-body" onclick="App.openNodeSelector('${node.id}','${node.type}')">
                            ${bodyHtml}
                        </div>
                        ${socketInHtml}
                        ${socketOutHtml}
                    `;
                        nodesContainer.appendChild(nodeEl);
                    });

                    this.updateNodePositions();
                    this.renderLines();
                    if (center) {
                        if (this.canvasState.nodes.length > 0) {
                            requestAnimationFrame(() => this.centerCanvasOnNodes());
                        } else {
                            requestAnimationFrame(() => this.centerCanvasOnOrigin());
                        }
                    }

                    container.onmousedown = (e) => this.onCanvasMouseDown(e);
                    container.onwheel = (e) => this.onCanvasWheel(e);
                    container.oncontextmenu = () => false;
                    this.updateCoordDisplay();
                },

                onCanvasMouseDown(e) {
                    const container = document.getElementById('comfyCanvasContainer');
                    if (e.button === 0 && e.shiftKey) {
                        e.preventDefault();
                        if (this.canvasBoxState) {
                            this.finalizeBoxSelect();
                            return;
                        }
                        const wp = this.getWorldPos(e.clientX, e.clientY);
                        this.canvasBoxState = { startX: wp.x, startY: wp.y, curX: wp.x, curY: wp.y };
                        const overlay = document.getElementById('boxSelectOverlay');
                        overlay.style.display = 'block';
                    } else if (e.button === 0) {
                        this.canvasPanState = { startX: e.clientX, startY: e.clientY, origPanX: this.panX,
                            origPanY: this.panY };
                        container.classList.add('grabbing');
                    } else if (e.button === 1) {
                        e.preventDefault();
                        this.canvasPanState = { startX: e.clientX, startY: e.clientY, origPanX: this.panX,
                            origPanY: this.panY };
                        container.classList.add('grabbing');
                    }
                },

                finalizeBoxSelect() {
                    if (!this.canvasBoxState) return;
                    const lx = Math.min(this.canvasBoxState.startX, this.canvasBoxState.curX);
                    const ly = Math.min(this.canvasBoxState.startY, this.canvasBoxState.curY);
                    const rx = Math.max(this.canvasBoxState.startX, this.canvasBoxState.curX);
                    const ry = Math.max(this.canvasBoxState.startY, this.canvasBoxState.curY);
                    this.selectedNodeIds.clear();
                    this.canvasState.nodes.forEach(n => {
                        const nx = n.x || 0;
                        const ny = n.y || 0;
                        if (nx + this.NODE_W >= lx && nx <= rx && ny + 80 >= ly && ny <= ry) {
                            this.selectedNodeIds.add(n.id);
                        }
                    });
                    this.canvasBoxState = null;
                    const overlay = document.getElementById('boxSelectOverlay');
                    if (overlay) overlay.style.display = 'none';
                    this.renderAssociationCanvas({ center: false });
                },

                onCanvasWheel(e) {
                    e.preventDefault();
                    this.closeAllSelectors();
                    const container = document.getElementById('comfyCanvasContainer');
                    const rect = container.getBoundingClientRect();
                    const mouseX = e.clientX - rect.left;
                    const mouseY = e.clientY - rect.top;
                    const oldScale = this.scale;
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    const newS = this.scale * delta;
                    if (newS < 0.15 || newS > 5) return;
                    this.scale = newS;
                    const worldMouseX = (mouseX - this.panX) / oldScale;
                    const worldMouseY = (mouseY - this.panY) / oldScale;
                    this.panX = mouseX - worldMouseX * this.scale;
                    this.panY = mouseY - worldMouseY * this.scale;
                    this.clampPan();
                    if (this.canvasPanState) {
                        this.canvasPanState.origPanX = this.panX;
                        this.canvasPanState.origPanY = this.panY;
                        this.canvasPanState.startX = e.clientX;
                        this.canvasPanState.startY = e.clientY;
                    }
                    if (this.dragState) {
                        const wp = this.getWorldPos(e.clientX, e.clientY);
                        this.dragState.startWorldX = wp.x;
                        this.dragState.startWorldY = wp.y;
                        for (const n of this.dragState.nodes) {
                            const cur = this.canvasState.nodes.find(nn => nn.id === n.id);
                            if (cur) { n.origX = cur.x; n.origY = cur.y; }
                        }
                    }
                    this.applyViewTransform();
                    this.renderLines();
                    this.debouncedAutoSave();
                },

                // 抖动 + 吸附 动画辅助函数（屏幕坐标系）
                _animateNodeToGrid(el, worldX, worldY, nodeId) {
                    const self = this;
                    const targetX = worldX;
                    const targetY = worldY;

                    const currentTransform = el.style.transform;
                    const match = currentTransform.match(/translate\(([^,]+)px,\s*([^)]+)px\)/);
                    const currentX = match ? parseFloat(match[1]) : targetX;
                    const currentY = match ? parseFloat(match[2]) : targetY;

                    const jitterAmount = 4;
                    const rand = () => (Math.random() - 0.5) * 2 * jitterAmount;

                    const jitterFrames = [
                        { transform: `translate(${currentX}px, ${currentY}px)` },
                        { transform: `translate(${currentX + rand()}px, ${currentY + rand()}px)`, offset: 0.25 },
                        { transform: `translate(${currentX + rand()}px, ${currentY + rand()}px)`, offset: 0.5 },
                        { transform: `translate(${currentX + rand()}px, ${currentY + rand()}px)`, offset: 0.75 },
                        { transform: `translate(${currentX}px, ${currentY}px)`, offset: 1 }
                    ];

                    const snapFrames = [
                        { transform: `translate(${currentX}px, ${currentY}px)` },
                        { transform: `translate(${targetX}px, ${targetY}px)` }
                    ];

                    const jitterTiming = {
                        duration: 30,
                        easing: 'ease-in-out',
                        fill: 'forwards'
                    };

                    const snapTiming = {
                        duration: 200,
                        easing: 'cubic-bezier(0.34, 2.0, 0.64, 1)',
                        fill: 'forwards'
                    };

                    const jitterAnimation = el.animate(jitterFrames, jitterTiming);
                    jitterAnimation.onfinish = () => {
                        const snapAnimation = el.animate(snapFrames, snapTiming);
                        snapAnimation.onfinish = () => {
                            el.style.transform = `translate(${worldX}px, ${worldY}px)`;
                            el.getAnimations().forEach(anim => anim.cancel());
                        };
                    };
                },

                startNodeDrag(e, nodeId) {
                    e.preventDefault();
                    e.stopPropagation();
                    this.canvasPanState = null;

                    // 清除所有节点的过渡/动画，确保拖动立即响应
                    document.querySelectorAll('.comfy-node').forEach(el => {
                        el.style.transition = 'none';
                        el.getAnimations().forEach(anim => anim.cancel());
                    });

                    if (!this.selectedNodeIds.has(nodeId)) {
                        this.selectedNodeIds.clear();
                    }
                    const nodeEl = e.target.closest('.comfy-node');
                    if (!nodeEl) return;
                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    const origX = node.x || 0;
                    const origY = node.y || 0;
                    const wp = this.getWorldPos(e.clientX, e.clientY);

                    const nodesToDrag = [];
                    if (this.selectedNodeIds.size > 1 && this.selectedNodeIds.has(nodeId)) {
                        this.selectedNodeIds.forEach(sid => {
                            const sn = this.canvasState.nodes.find(nn => nn.id === sid);
                            if (sn) {
                                nodesToDrag.push({ id: sid, origX: sn.x || 0, origY: sn.y || 0 });
                            }
                        });
                    } else {
                        nodesToDrag.push({ id: nodeId, origX: origX, origY: origY });
                    }

                    this.dragState = { nodeId, startWorldX: wp.x, startWorldY: wp.y, nodes: nodesToDrag };
                    this.isDragging = true;
                    nodeEl.classList.add('dragging');
                    const self = this;
                    let dragRafId = null;

                    function onMove(e2) {
                        if (!self.dragState) return;
                        if (dragRafId) return;
                        dragRafId = requestAnimationFrame(() => {
                            dragRafId = null;
                            const wp2 = self.getWorldPos(e2.clientX, e2.clientY);
                            const dx = wp2.x - self.dragState.startWorldX;
                            const dy = wp2.y - self.dragState.startWorldY;
                            for (const n of self.dragState.nodes) {
                                const nodeObj = self.canvasState.nodes.find(nn => nn.id === n.id);
                                const newX = n.origX + dx;
                                const newY = n.origY + dy;
                                if (nodeObj) {
                                    nodeObj.x = newX;
                                    nodeObj.y = newY;
                                }
                                const el = document.querySelector(`.comfy-node[data-node-id="${n.id}"]`);
                                if (el) {
                                    el.style.transform = `translate(${newX}px, ${newY}px)`;
                                }
                            }
                            self.renderLines();
                        });
                    }

                    function onUp() {
                        let positionChanged = false;
                        if (self.dragState && self.dragState.nodes) {
                            for (const n of self.dragState.nodes) {
                                const nodeObj = self.canvasState.nodes.find(nn => nn.id === n.id);
                                if (!nodeObj) continue;

                                const snappedX = nodeObj.type === 'model'
                                    ? Math.round((nodeObj.x + self.NODE_W) / self.GRID) * self.GRID - self.NODE_W
                                    : nodeObj.type === 'question'
                                    ? Math.round((nodeObj.x - 0.25 * self.GRID) / self.GRID) * self.GRID + 0.25 * self.GRID
                                    : Math.round(nodeObj.x / self.GRID) * self.GRID;
                                const snappedY = Math.round(nodeObj.y / self.GRID) * self.GRID;
                                if (snappedX !== n.origX || snappedY !== n.origY) {
                                    positionChanged = true;
                                }
                                nodeObj.x = snappedX;
                                nodeObj.y = snappedY;

                                const el = document.querySelector(`.comfy-node[data-node-id="${n.id}"]`);
                                if (!el) continue;

                                el.classList.remove('dragging');

                                self._animateNodeToGrid(el, snappedX, snappedY, n.id);
                            }
                        }
                        self.dragState = null;
                        self.isDragging = false;
                        self.renderLines();
                        if (positionChanged) {
                            self.saveCanvasSnapshot();
                            self.debouncedAutoSave();
                        }
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                    }

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                },

                startSocketDrag(e, nodeId, type, dir, typeClass) {
                    e.preventDefault();
                    const container = document.getElementById('comfyCanvasContainer');
                    const nodeEl = container.querySelector(`.comfy-node[data-node-id="${nodeId}"]`);
                    if (!nodeEl) return;
                    const fromSocket = nodeEl.querySelector(`.comfy-socket.${dir}`);
                    if (fromSocket) fromSocket.classList.add('dragging');

                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    this.socketDragState = { nodeId, type, dir, typeClass };
                    const self = this;
                    let rafId = null;

                    function onMove(e2) {
                        if (!self.socketDragState) return;
                        if (rafId) cancelAnimationFrame(rafId);
                        rafId = requestAnimationFrame(() => {
                            const x1 = (node.x || 0) + (dir === 'out' ? self.NODE_W : 0);
                            const y1 = (node.y || 0) + 40;
                            const wp = self.getWorldPos(e2.clientX, e2.clientY);
                            const dx2 = Math.abs(wp.x - x1) * 0.5;
                            self.socketDragState.tempLine =
                                `M${x1},${y1} C${x1 + dx2},${y1} ${wp.x - dx2},${wp.y} ${wp.x},${wp.y}`;
                            self.renderLines();
                            rafId = null;
                        });
                    }

                    function onUp(e2) {
                        let connectionAdded = false;
                        const target = document.elementFromPoint(e2.clientX, e2.clientY);
                        const socket = target ? target.closest('.comfy-socket') : null;
                        if (socket) {
                            const toNodeId = socket.dataset.node;
                            const toDir = socket.dataset.dir;
                            if (toNodeId !== nodeId && dir !== toDir) {
                                let fromId, toId;
                                if (dir === 'out' && toDir === 'in') {
                                    fromId = nodeId; toId = toNodeId;
                                } else if (dir === 'in' && toDir === 'out') {
                                    fromId = toNodeId; toId = nodeId;
                                } else {
                                    fromId = null;
                                }
                                if (fromId) {
                                    const fromNode = self.canvasState.nodes.find(n => n.id === fromId);
                                    const toNode = self.canvasState.nodes.find(n => n.id === toId);
                                    const fromType = fromNode ? fromNode.type : null;
                                    const toType = toNode ? toNode.type : null;

                                    const isValid = 
                                        (fromType === 'prompt' && toType === 'question') ||
                                        (fromType === 'question' && toType === 'model');

                                    if (!isValid) {
                                        showToast('无效连接：' + 
                                            (fromType === 'prompt' ? '提示词' : '问题') + ' → ' + 
                                            (toType === 'model' ? '模型' : '问题') + ' 不被允许', 'warning');
                                    } else {
                                        if (self.selectedNodeIds.size > 0 && self.selectedNodeIds.has(fromId)) {
                                            self.selectedNodeIds.forEach(sid => {
                                                const sNode = self.canvasState.nodes.find(n => n.id === sid);
                                                if (!sNode) return;
                                                const pairValid = 
                                                    (sNode.type === 'prompt' && toType === 'question') ||
                                                    (sNode.type === 'question' && toType === 'model');
                                                if (!pairValid) return;
                                                const exists = self.canvasState.connections.some(c => c.from === sid && c.to === toId);
                                                if (!exists) {
                                                    self.canvasState.connections.push({ from: sid, to: toId, _manual: true });
                                                    connectionAdded = true;
                                                }
                                            });
                                        } else {
                                            const exists = self.canvasState.connections.some(c => c.from === fromId && c.to === toId);
                                            if (!exists) {
                                                self.canvasState.connections.push({ from: fromId, to: toId, _manual: true });
                                                connectionAdded = true;
                                            }
                                        }
                                    }
                                }
                            }
                        }
                        if (fromSocket) fromSocket.classList.remove('dragging');
                        self.socketDragState = null;
                        self.renderLines();
                        if (connectionAdded) self.saveCanvasSnapshot();
                        document.removeEventListener('mousemove', onMove);
                        document.removeEventListener('mouseup', onUp);
                    }

                    document.addEventListener('mousemove', onMove);
                    document.addEventListener('mouseup', onUp);
                },

                async openNodeSelector(nodeId, type) {
                    this.closeAllSelectors();
                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;

                    if (node.tag) {
                        const tabType = type === 'prompt' ? 'prompts' : 'questions';
                        this.switchSidebarTab(tabType);
                        return;
                    }

                    let items = [];
                    if (type === 'prompt') {
                        this._markMissingPromptQuestions();
                        this.renderAssociationCanvas({ center: false });
                        items = this.prompts.map(p => `${p.testSet || ''} ${p.tag || ''} #${p.id}`);
                    } else if (type === 'question') {
                        this._markMissingPromptQuestions();
                        this.renderAssociationCanvas({ center: false });
                        items = this.questions.map(q => `${q.testSet || ''} ${q.tag || ''} #${q.id}`);
                    } else if (type === 'model') {
                        if (this.availableModels.length === 0 || (node.value && !this.availableModels.includes(node.value))) {
                            await this.loadModels();
                        }
                        this._markMissingModels();
                        this.renderAssociationCanvas({ center: false });
                        items = this.availableModels;
                    }

                    const block = document.querySelector(`.comfy-node[data-node-id="${nodeId}"] .comfy-node-body`);
                    if (!block) return;

                    const popup = document.createElement('div');
                    popup.className = 'comfy-sel-popup';
                    if (items.length === 0) {
                        popup.innerHTML =
                            '<div style="padding:10px;color:#bbb;font-size:11px;text-align:center">暂无可用选项</div>';
                    } else {
                        popup.innerHTML = items.map((item, idx) => {
                            const sel = node.value === item;
                            return `<div class="comfy-sel-item ${sel ? 'picked' : ''}" data-node-id="${nodeId}" data-type="${type}" data-index="${idx}"><span>${this.escapeHtml(item)}</span></div>`;
                        }).join('');
                        popup._items = items;
                    }
                    const rect = block.getBoundingClientRect();
                    popup.style.position = 'fixed';
                    let top = rect.bottom + 4;
                    let left = rect.left;
                    const popupH = Math.min(220, items.length * 32 + 8);
                    const popupW = Math.max(180, rect.width);
                    if (top + popupH > window.innerHeight) {
                        top = rect.top - popupH - 4;
                    }
                    if (left + popupW > window.innerWidth) {
                        left = window.innerWidth - popupW - 8;
                    }
                    popup.style.top = top + 'px';
                    popup.style.left = left + 'px';
                    popup.style.minWidth = popupW + 'px';
                    document.body.appendChild(popup);
                },

                onSelectorPick(nodeId, type, index) {
                    const popup = document.querySelector('.comfy-sel-popup');
                    const items = popup._items;
                    if (!items || index >= items.length) return;
                    const value = items[index];
                    const node = this.canvasState.nodes.find(n => n.id === nodeId);
                    if (!node) return;
                    const oldValue = node.value;
                    if (oldValue === value) return;
                    node.value = value;
                    if (type === 'model') {
                        if (oldValue) {
                            const oldIdx = this.selectedModels.indexOf(oldValue);
                            if (oldIdx !== -1) this.selectedModels.splice(oldIdx, 1);
                        }
                        if (!this.selectedModels.includes(value)) {
                            this.selectedModels.push(value);
                        }
                        this.persistSelectedModels();
                        this.updateSelectedModelCount();
                        this.autoConnectCanvas();
                    } else if (type === 'prompt') {
                        const oldP = this.prompts.find(p => `${p.testSet || ''} ${p.tag || ''} #${p.id}` === oldValue);
                        if (oldP) this.selectedPrompts.delete(`p_${oldP.testSet || '未分类'}_${oldP.id}_${oldP.file || ''}`);
                        const newP = this.prompts.find(p => `${p.testSet || ''} ${p.tag || ''} #${p.id}` === value);
                        if (newP) this.selectedPrompts.add(`p_${newP.testSet || '未分类'}_${newP.id}_${newP.file || ''}`);
                        this._saveSelectionToLocalStorage();
                    } else if (type === 'question') {
                        const oldQ = this.questions.find(q => `${q.testSet || ''} ${q.tag || ''} #${q.id}` === oldValue);
                        if (oldQ) this.selectedQuestions.delete(`q_${oldQ.testSet || '未分类'}_${oldQ.id}_${oldQ.file || ''}`);
                        const newQ = this.questions.find(q => `${q.testSet || ''} ${q.tag || ''} #${q.id}` === value);
