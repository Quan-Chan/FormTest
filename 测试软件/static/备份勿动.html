<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FormTest - AI结构化格式解析能力测试框架</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
    <style>
        :root {
            --bg-page: #f0f2f5;
            --bg-card: #ffffff;
            --bg-hover: #eef0f4;
            --bg-input: #f5f6f8;
            --border: #dde0e5;
            --border-light: #c8ccd3;
            --text-primary: #1a1d24;
            --text-secondary: #4a5568;
            --text-muted: #718096;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-light: rgba(59, 130, 246, 0.15);
            --accent-bg: rgba(59, 130, 246, 0.08);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 4px 16px rgba(0, 0, 0, 0.08);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            height: 100vh;
            overflow: hidden;
            margin: 0;
        }
        .global-transition * {
            transition: none !important;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-page);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.3s;
        }
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        .toast-container {
            position: fixed;
            bottom: 16px;
            left: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column-reverse;
            gap: 8px;
            pointer-events: none;
        }
        .toast {
            padding: 12px 20px;
            border-radius: var(--radius-sm);
            font-size: 15px;
            font-weight: 400;
            box-shadow: var(--shadow-md);
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.3s cubic-bezier(.4, 0, .2, 1);
            pointer-events: auto;
            max-width: 450px;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .toast.info {
            background: var(--bg-card);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
        }
        .toast.success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
            border-left: 3px solid #10b981;
        }
        .toast.error {
            background: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
            border-left: 3px solid #ef4444;
        }
        .toast.warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
            border-left: 3px solid #f59e0b;
        }
        .toast-close {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            color: inherit;
            opacity: 0.5;
            padding: 4px 6px;
            flex-shrink: 0;
            border-radius: 4px;
            transition: all 0.15s;
            font-family: inherit;
        }
        .toast-close:hover {
            opacity: 1;
            background: rgba(0,0,0,0.06);
        }
        .toast-close:active {
            transform: scale(0.9);
        }
        .toast-close:focus-visible {
            outline: none;
            box-shadow: 0 0 0 2px var(--accent-light);
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            font-weight: 400;
            background: var(--bg-page);
            color: var(--text-primary);
            height: 100%;
            display: flex;
            flex-direction: column;
            line-height: 1.5;
        }
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            height: 60px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }
        .header-brand svg {
            width: 24px;
            height: 24px;
            color: var(--accent);
        }
        .header-badge {
            font-size: 11px;
            padding: 4px 10px;
            background: var(--accent-bg);
            color: var(--accent);
            border-radius: 20px;
            font-weight: 500;
        }
        .header-badge.pulse {
            animation: pulse 1.5s ease-in-out;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .settings-toggle {
            padding: 6px 12px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-family: inherit;
            user-select: none;
        }
        .settings-toggle:hover {
            background: var(--bg-hover);
            border-color: var(--border-light);
            color: var(--text-primary);
        }
        .settings-toggle:active {
            background: var(--bg-input);
            transform: scale(0.97);
        }
        .settings-toggle:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .settings-toggle.active {
            background: var(--accent-bg);
            border-color: var(--accent);
            color: var(--accent);
        }
        .settings-toggle svg {
            width: 14px;
            height: 14px;
        }

        .confirm-dialog-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        .confirm-dialog {
            background: var(--bg-card);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-lg);
            padding: 24px;
            max-width: 400px;
            width: 90%;
        }
        .confirm-dialog-msg {
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .confirm-dialog-btns {
            display: flex;
            gap: 12px;
        }
        .params-modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .params-modal-overlay.show {
            display: flex;
        }
        .params-modal {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
        }
        .params-modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .params-modal-title {
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .params-modal-title svg {
            width: 18px;
            height: 18px;
            color: var(--accent);
        }
        .params-modal-close {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--text-muted);
            padding: 4px 8px;
            line-height: 1;
            border-radius: var(--radius-sm);
            transition: all 0.15s;
            font-family: inherit;
        }
        .params-modal-close:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
        }
        .params-modal-close:active {
            transform: scale(0.9);
        }
        .params-modal-close:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .params-modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }
        .params-modal-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }
        @media (max-width: 768px) {
            .params-modal-grid { grid-template-columns: 1fr; }
        }

        .main {
            display: flex;
            flex-direction: row;
            flex: 1;
            overflow: hidden;
            height: 100%;
        }

        .sidebar {
            width: 350px;
            height: 100%;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        .sidebar-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .sidebar-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        .search-box {
            position: relative;
        }
        .search-box input {
            width: 100%;
            padding: 8px 10px 8px 30px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 12px;
            transition: all 0.2s;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .search-box svg {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            color: var(--text-muted);
        }
        .sidebar-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .btn-ghost {
            flex: 1;
            padding: 6px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            user-select: none;
        }
        .btn-ghost:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }
        .btn-ghost:active {
            background: var(--bg-input);
            transform: scale(0.97);
        }
        .btn-ghost:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .tag-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 14px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .tag-chip {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--bg-input);
            color: var(--text-secondary);
            transition: all 0.15s;
            font-family: inherit;
            user-select: none;
        }
        .tag-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
        }
        .tag-chip:active {
            transform: scale(0.96);
        }
        .tag-chip:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .tag-chip.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .set-chip {
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 10px;
            cursor: pointer;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.15s;
            font-family: inherit;
            user-select: none;
        }
        .set-chip:hover {
            color: var(--text-primary);
            background: var(--bg-hover);
            border-color: var(--border);
        }
        .set-chip:active {
            transform: scale(0.96);
        }
        .set-chip:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .set-chip.active {
            color: var(--accent);
            background: var(--accent-bg);
            font-weight: 500;
        }

        .btn {
            padding: 10px 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s cubic-bezier(.4, 0, .2, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            line-height: 1.4;
            user-select: none;
        }
        .btn:active {
            transform: scale(0.97);
        }
        .btn:focus-visible {
            outline: none;
            box-shadow: 0 0 0 3px var(--accent-light);
        }
        .btn svg {
            width: 14px;
            height: 14px;
        }
        .btn-primary {
            background: var(--accent);
            color: white;
            border: 1px solid #c8ced6;
            box-shadow: 0 1px 3px rgba(59, 130, 246, 0.25);
        }
        .btn-primary:hover {
            background: #5294fa;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.35);
        }
        .btn-primary:active {
            background: #1d4ed8;
            box-shadow: none;
            transform: scale(0.97);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-secondary {
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-secondary:hover {
            background: var(--bg-hover);
            border-color: var(--border-light);
            color: var(--text-primary);
        }
        .btn-secondary:active {
            background: var(--border);
            transform: scale(0.97);
        }
        .result-item.result-error {
            border-left: 3px solid #ef4444;
            background: #fef2f2;
        }
        .btn-loading {
            position: relative;
            pointer-events: none;
            color: transparent !important;
        }
        .btn-loading::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            top: calc(50% - 8px);
            left: calc(50% - 8px);
            border: 2px solid var(--text-secondary);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }
        .file-list::-webkit-scrollbar {
            width: 4px;
        }
        .file-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .file-list::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 2px;
        }

        .entry-group {
            margin-bottom: 4px;
            border-radius: var(--radius-sm);
            overflow: hidden;
            background: var(--bg-input);
        }
        .entry-group-header {
            padding: 10px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 500;
            font-size: 14px;
            color: var(--text-primary);
            transition: background 0.15s;
            user-select: none;
        }
        .entry-group-header:hover {
            background: var(--bg-hover);
        }
        .entry-group-header:active {
            background: var(--bg-input);
        }
        .entry-group-name {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .entry-group-count {
            font-size: 12px;
            padding: 1px 7px;
            background: var(--accent-bg);
            color: var(--accent);
            border-radius: 8px;
            font-weight: 500;
        }
        .entry-group-chevron {
            transition: transform 0.2s;
            color: var(--text-muted);
            width: 10px;
            height: 10px;
        }
        .entry-group.open .entry-group-chevron {
            transform: rotate(180deg);
        }
        .entry-group-items {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            padding: 0 6px;
            transition: max-height 0.3s ease, opacity 0.3s ease, padding 0.3s ease;
        }
        .entry-group.open .entry-group-items {
            max-height: 2000px;
            opacity: 1;
            padding: 0 6px 6px;
        }
        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .entry-item {
            padding: 6px 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            border-radius: var(--radius-sm);
            margin-bottom: 1px;
            user-select: none;
        }
        .entry-item:active {
            transform: scale(0.98);
        }
        .entry-item:focus-visible {
            outline: none;
            box-shadow: inset 0 0 0 2px var(--accent-light);
        }
        .entry-checkbox {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-radius: 3px;
            flex-shrink: 0;
            position: relative;
        }
        .entry-checkbox.checked {
            background: var(--accent);
            border-color: var(--accent);
        }
        .entry-checkbox.checked::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 1px;
            width: 3px;
            height: 6px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }
        .entry-item:hover {
            background: var(--bg-hover);
        }
        .entry-item.selected {
            background: var(--accent-light);
        }
        .entry-info {
            flex: 1;
            min-width: 0;
        }
        .entry-name {
            font-weight: 400;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .entry-desc {
            font-size: 10px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            min-width: 0;
            align-items: stretch;
            position: relative;
        }
        .center-panel::before {
            content: '';
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            height: 1px;
            background: var(--border);
            z-index: 5;
        }
        .content {
            flex: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
        }
        .config-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            background: var(--bg-card);
        }

        .panel-header {
            flex-shrink: 0;
            padding: 0 18px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .panel-title {
            font-size: 15px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-primary);
            white-space: nowrap;
        }
        .panel-title svg {
            width: 18px;
            height: 18px;
            color: var(--accent);
        }
        .result-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            background: var(--bg-input);
            color: var(--text-secondary);
        }
        .panel-body {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .config-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .section-title {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-bottom: 8px;
            margin-bottom: 8px;
            position: relative;
        }
        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 15%;
            height: 2px;
            background: var(--accent);
        }
        .config-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .config-grid .form-group > :last-child {
            margin-top: auto;
        }
        .form-group label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .form-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-card);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .slider-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .slider-row {
            display: flex;

    <div class="model-modal-overlay" id="modelModal">
        <div class="model-modal">
            <div class="model-modal-header">
                <span class="model-modal-title">选择模型</span>
                <button class="model-modal-close" onclick="App.closeModelModal()">&times;</button>
            </div>
            <div class="model-modal-body" id="modelCheckboxList"></div>
            <div class="model-modal-footer">
                <button class="btn btn-secondary" onclick="App.closeModelModal()">取消</button>
                <button class="btn btn-primary" onclick="App.confirmModelSelection()">确定</button>
            </div>

    </div>

    <script>
        (function() {
            const $ = (sel, ctx = document) => ctx.querySelector(sel);
            const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

            let toastId = 0;
            const _toastMessages = new Set();

            function showToast(message, type = 'info', duration = 3000) {
                const container = document.getElementById('toastContainer');
                const key = `${type}:${message}`;
                if (_toastMessages.has(key)) return;
                const id = ++toastId;
                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.id = `toast-${id}`;
                toast.dataset.toastKey = key;
                _toastMessages.add(key);
                const escape = (text) => {
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                };
                toast.innerHTML =
                    `<span style="flex:1">${escape(message)}</span><button class="toast-close" onclick="App.dismissToast(${id})">&times;</button>`;
                container.appendChild(toast);
                requestAnimationFrame(() => { toast.classList.add('show'); });
                const dismissFn = () => App.dismissToast(id);
                if (duration > 0) { setTimeout(dismissFn, duration); }
            }

            function dismissToast(id) {
                const toast = document.getElementById(`toast-${id}`);
                if (!toast) return;
                const key = toast.dataset.toastKey;
                if (key) _toastMessages.delete(key);
                toast.classList.remove('show');
                setTimeout(() => { if (toast.parentNode) toast.remove(); }, 300);
            }

            function fetchWithTimeout(url, options = {}, timeout = 30000) {
                return fetch(url, { ...options, signal: options.signal || AbortSignal.timeout(timeout) });
            }

            function friendlyError(msg) {
                if (!msg) return '未知错误';
                const lower = msg.toLowerCase();
                if (lower.includes('failed to fetch') || lower.includes('networkerror') || lower.includes('network error')) return '无法连接服务器，请检查后端服务是否运行';
                if (lower.includes('401') || lower.includes('unauthorized') || lower.includes('403') || lower.includes('forbidden')) return 'API Key 无效或权限不足';
                if (lower.includes('500') || lower.includes('internal server error')) return '服务器内部错误，请查看后端日志';
                if (lower.includes('timeout') || lower.includes('timed out')) return '请求超时，请检查网络连接';
                if (lower.includes('404') || lower.includes('not found')) return '请求的资源不存在';
                return msg;
            }

            function debounce(fn, ms) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    const ctx = this;
                    timer = setTimeout(() => fn.apply(ctx, args), ms);
                };
            }

            function generateId() {
                if (typeof crypto !== 'undefined' && crypto.randomUUID) {
                    return crypto.randomUUID();
                }
                return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
            }

            const WORLD_CENTER_X = 5000;
            const WORLD_CENTER_Y = 5000;
            const PROMPT_X = WORLD_CENTER_X - 450;
            const QUESTION_X = WORLD_CENTER_X;
            const MODEL_X = WORLD_CENTER_X + 450;
            const START_Y = WORLD_CENTER_Y - 60;
            const NODE_GAP_Y = 100;


            const App = window.App = {
                testSets: [],
                currentTestSet: '',
                testSetNames: [],
                selectedTestSets: new Set(),
                prompts: [],
                questions: [],
                selectedPrompts: new Set(),
                selectedQuestions: new Set(),
                allTags: [],
                activeTags: new Set(),
                selectedModels: [],
                availableModels: [],
                allResults: {},
                abortController: null,
                isRunning: false,
                openGroups: new Set(),
                canvasState: { nodes: [], connections: [], history: [] },
                dragState: null,
                isDragging: false,
                socketDragState: null,
                panX: 0,
                panY: 0,
                scale: 1,
                selectedNodeIds: new Set(),
                canvasPanState: null,
                canvasBoxState: null,
                historyResultsList: [],
                undoStack: [],
                canvasHistoryIndex: -1,
                _canvasHistoryMax: 50,
                _canvasSyncDisabled: false,
                _sseChunkTimeout: 300000,
                _lastRemovedSelections: null,
                _tabSearchText: { prompts: '', questions: '' },
                _allStreamItems: [],
                _confirmResolve: null,
                _promptResolve: null,

                _saveSelectionToLocalStorage() {
                    try {
                        localStorage.setItem('ft_selectedPrompts', JSON.stringify(Array.from(this.selectedPrompts)));
                        localStorage.setItem('ft_selectedQuestions', JSON.stringify(Array.from(this.selectedQuestions)));
                    } catch (e) { /* ignore */ }
                },

                _loadSelectionFromLocalStorage() {
                    try {
                        const p = localStorage.getItem('ft_selectedPrompts');
                        const q = localStorage.getItem('ft_selectedQuestions');
                        if (p) { const arr = JSON.parse(p); if (Array.isArray(arr) && arr.length > 0) this.selectedPrompts = new Set(arr); }
                        if (q) { const arr = JSON.parse(q); if (Array.isArray(arr) && arr.length > 0) this.selectedQuestions = new Set(arr); }
                    } catch (e) { /* ignore */ }
                },

                NODE_W: 170,
                GRID: 20,

                showToast,
                dismissToast,

                getWorldPos(clientX, clientY) {
                    const el = document.getElementById('comfyCanvasContainer');
                    if (!el) return { x: 0, y: 0 };
                    const rect = el.getBoundingClientRect();
                    return {
                        x: (clientX - rect.left - this.panX) / this.scale,
                        y: (clientY - rect.top - this.panY) / this.scale
                    };
                },

                switchSidebarTab(tab) {
                    const currentActive = $$('.tab-btn.active');
                    const currentTab = currentActive.length ? currentActive[0].dataset.tab : null;
                    if (currentTab) {
                        this._tabSearchText[currentTab] = document.getElementById(currentTab + 'Search').value;
                    }
                    $$('.tab-btn').forEach(b => b.classList.remove('active'));
                    $$('.tab-panel').forEach(p => p.classList.remove('active'));
                    $(`.tab-btn[data-tab="${tab}"]`).classList.add('active');
                    $(`#tab-${tab}`).classList.add('active');
                    document.getElementById('promptSearch').value = this._tabSearchText.prompts;
                    document.getElementById('questionSearch').value = this._tabSearchText.questions;
                    this.computeCurrentTags();
                    if (tab === 'prompts') this.renderPromptList();
                    else this.renderQuestionList();
                },

                escapeHtml(text) {
                    if (!text) return '';
                    const div = document.createElement('div');
                    div.textContent = text;
                    return div.innerHTML;
                },

                _collectConfig() {
                    const p = (id) => parseFloat(document.getElementById(id + 'Input').value) || 0;
                    const pi = (id) => parseInt(document.getElementById(id + 'Input').value) || 0;
                    return {
                        test_set_dir: document.getElementById('testSetDir').value || '',
                        api_key: document.getElementById('apiKey').value,
                        base_url: document.getElementById('baseUrl').value,
                        temperature: p('modal-temperature'),
                        concurrency: pi('modal-concurrency'),
                        test_count: pi('modal-testCount'),
                        max_retries: pi('modal-maxRetries'),
                        context_size: pi('modal-contextSize'),
                        streaming: document.getElementById('modal-streaming').checked,
                        top_p: p('modal-topP'),
                        top_k: pi('modal-topK'),
                        min_p: p('modal-minP'),
                        models: this.selectedModels,
                        auto_append_v1: document.getElementById('autoAppendV1').checked,
                        auto_connect: document.getElementById('autoConnectToggle').checked
                    };
                },

                async saveConfig(config, silent = false) {
                    try {
                        const res = await fetchWithTimeout('/api/v1/config', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(config)
                        });
                        if (res.ok && !silent) { showToast('配置已保存', 'success'); }
                    } catch (error) { console.error('Failed to save config:', error);
                        showToast('配置保存失败', 'error'); }
                },

                async onBaseUrlBlur() {
                    const el = document.getElementById('baseUrl');
                    const autoV1 = document.getElementById('autoAppendV1').checked;
                    let val = el.value.trim();
                    if (autoV1 && val && !val.endsWith('/v1')) {
                        val = val.replace(/\/+$/, '') + '/v1';
                        el.value = val;
                    }
                    await this.onConfigChange();
                },

                async onConfigChange() {
                    const config = this._collectConfig();
                    await this.saveConfig(config, true);
                },

                async onTestSetDirChange() {
                    const newPath = document.getElementById('testSetDir').value || '';
                    const config = this._collectConfig();
                    await this.saveConfig(config, true);
                    if (newPath !== this._lastTestSetDir) {
                        this._lastTestSetDir = newPath;
                        await this.loadAllTestSets();
                    }
                },

                toggleParamsModal() {
                    const btn = document.getElementById('paramsToggle');
                    const modal = document.getElementById('paramsModal');
                    if (modal.classList.contains('show')) {
                        btn.classList.remove('active');
                        modal.classList.remove('show');
                    } else {
                        btn.classList.add('active');
                        modal.classList.add('show');
                    }
                },

                onModalSliderChange(id, value) {
                    const slider = document.getElementById('modal-' + id);
                    const input = document.getElementById('modal-' + id + 'Input');
                    if (slider) {
                        const native = slider.querySelector('.slider-native');
                        if (native) native.value = value;
                    }
                    if (input) input.value = parseFloat(value).toFixed(id === 'temperature' || id === 'topP' ? 1 : 0);
                    this.updateSliderVisual(id);
                },
                onModalSliderCommit(id, value) {
                    this.onModalSliderChange(id, value);
                    this.debouncedConfigChange();
                },

                onModalNumberChange(id, value) {
                    let num = parseFloat(value);
                    const slider = document.getElementById('modal-' + id);
                    if (slider) {
                        const native = slider.querySelector('.slider-native');
                        if (native) {
                            const min = parseFloat(native.min);
                            const max = parseFloat(native.max);
                            const clamped = Math.min(max, Math.max(min, num));
                            if (clamped !== num) {
                                const toastKey = `clamp-${id}`;
                                const existing = document.getElementById(`toast-${toastKey}`);
                                if (existing) existing.remove();
                                showToast(`数值已调整为 ${clamped}（有效范围 ${min}-${max}）`, 'warning', 2000);
                                num = clamped;
                            }
                        }
                    }
                    const input = document.getElementById('modal-' + id + 'Input');
                    if (input) input.value = num;
                    if (slider) {
                        const native = slider.querySelector('.slider-native');
                        if (native) native.value = num;
                    }
                    this.updateSliderVisual(id);
                    this.debouncedConfigChange();
                },

                async loadAllTestSets() {
                    try {
                        const scanResp = await fetchWithTimeout('/api/v1/test-set/scan');
                        const scanData = await scanResp.json();
                        this.testSetNames = (scanData.test_sets || []).map(ts => ts.name);
                        if (this.testSetNames.length === 0) {
                            document.getElementById('promptList').innerHTML =
                                '<div class="empty-state"><p>无测试集</p></div>';
                            document.getElementById('questionList').innerHTML =
                                '<div class="empty-state"><p>无测试集</p></div>';
                            return;
                        }
                        this.selectedTestSets = new Set(this.testSetNames);
                        this.openGroups.clear();
                        this.allTags = [];
                        this.activeTags.clear();
                        this.prompts = [];
                        this.questions = [];

                        const BATCH_SIZE = 5;
                        const names = this.testSetNames;
                        const total = names.length;

                        for (let i = 0; i < total; i += BATCH_SIZE) {
                            const batch = names.slice(i, i + BATCH_SIZE);
                            this.setLoadingPhase(`正在加载测试集 (${Math.min(i + BATCH_SIZE, total)}/${total})…`);

                            const batchResults = await Promise.allSettled(batch.map(async (name) => {
                                try {
                                    const [pResp, qResp] = await Promise.all([
                                        fetchWithTimeout(`/api/v1/test-set/prompts?test_set=${encodeURIComponent(name)}`),
                                        fetchWithTimeout(`/api/v1/test-set/questions?test_set=${encodeURIComponent(name)}`)
                                    ]);
                                    if (!pResp.ok) throw new Error(`提示词API错误: ${pResp.status}`);
                                    if (!qResp.ok) throw new Error(`问题API错误: ${qResp.status}`);
                                    const pData = await pResp.json();
                                    const qData = await qResp.json();
                                    const taggedPrompts = (pData.prompts || []).map(p => ({ ...p, testSet: name }));
                                    const taggedQuestions = (qData.questions || []).map(q => ({ ...q, testSet: name }));
                                    return { prompts: taggedPrompts, questions: taggedQuestions };
                                } catch (e) {
                                    console.error('Failed to load test set:', name, e);
                                    showToast('无法连接服务器，请检查后端', 'error');
                                    return { prompts: [], questions: [] };
                                }
                            }));

                            batchResults.filter(r => r.status === 'fulfilled').map(r => r.value).forEach(r => {
                                if (r) {
                                    this.prompts.push(...r.prompts);
                                    this.questions.push(...r.questions);
                                }
                            });
                        }

                        console.log('Total prompts:', this.prompts.length, 'Total questions:', this.questions.length);
                        const testSetCounts = {};
                        this.questions.forEach(q => {
                            const ts = q.testSet || '(undefined)';
                            testSetCounts[ts] = (testSetCounts[ts] || 0) + 1;
                        });
                        console.log('[loadAllTestSets] testSet distribution in questions:', JSON.stringify(testSetCounts));
                        const qWithoutTestSet = this.questions.filter(q => !q.testSet);
                        if (qWithoutTestSet.length > 0) {
                            console.warn('[loadAllTestSets] WARNING: questions without testSet:', qWithoutTestSet.length, qWithoutTestSet.slice(0, 3));
                        }
                        const qWithoutFile = this.questions.filter(q => !q.file);
                        if (qWithoutFile.length > 0) {
                            console.warn('[loadAllTestSets] WARNING: questions without file:', qWithoutFile.length, qWithoutFile.slice(0, 3));
                        }
                        this.openGroups.clear();
                        this.onTestSetChange();
                        this.computeCurrentTags();
                        this.renderSetFilterPanel();
                        if (total > 0) {
                            showToast(`加载完成：${this.prompts.length} 个提示词，${this.questions.length} 个问题`, 'success');
                        }
                    } catch (error) {
                        console.error('Failed to load test sets:', error);
                        this.showToast('加载测试集失败，请检查后端服务是否运行', 'error');
                    }
                },

                async onTestSetChange() {
                    const validPromptKeys = new Set(this.prompts.map(p =>
                        `p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`));
                    const validQuestionKeys = new Set(this.questions.map(q =>
                        `q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`));
                    const removedKeys = { prompts: [], questions: [] };
                    for (const key of this.selectedPrompts) {
                        if (!validPromptKeys.has(key)) { removedKeys.prompts.push(key); }
                    }
                    for (const key of this.selectedQuestions) {
                        if (!validQuestionKeys.has(key)) { removedKeys.questions.push(key); }
                    }
                    for (const key of removedKeys.prompts) { this.selectedPrompts.delete(key); }
                    for (const key of removedKeys.questions) { this.selectedQuestions.delete(key); }
                    const totalRemoved = removedKeys.prompts.length + removedKeys.questions.length;
                    if (totalRemoved > 0) {
                        const detailParts = [];
                        if (removedKeys.prompts.length > 0) {
                            detailParts.push(`${removedKeys.prompts.length} 个提示词`);
                        }
                        if (removedKeys.questions.length > 0) {
                            detailParts.push(`${removedKeys.questions.length} 个问题`);
                        }
                        const detailStr = detailParts.join('，');
                        const msg = `测试集切换，已移除 ${totalRemoved} 项无效选中项（${detailStr}）`;
                        const container = document.getElementById('toastContainer');
                        if (container) {
                            const id = ++toastId;
                            const toast = document.createElement('div');
                            toast.className = 'toast warning';
                            toast.id = `toast-${id}`;
                            const esc = (t) => { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; };
                            toast.innerHTML = `<span style="flex:1">${esc(msg)}</span>` +
                                `<button class="toast-close" onclick="App.undoRemovedSelections()" style="font-weight:600;color:var(--accent);opacity:1;margin-right:4px;">撤销</button>` +
                                `<button class="toast-close" onclick="App.dismissToast(${id})">&times;</button>`;
                            container.appendChild(toast);
                            requestAnimationFrame(() => { toast.classList.add('show'); });
                            setTimeout(() => { this.dismissToast(id); }, 8000);
                        }
                        this._lastRemovedSelections = removedKeys;
                    }
                    this.syncCanvasFromSelection();
                    this.renderPromptList();
                    this.renderQuestionList();
                    this._saveSelectionToLocalStorage();
                },

                undoRemovedSelections() {
                    if (!this._lastRemovedSelections) return;
                    const rk = this._lastRemovedSelections;
                    for (const key of rk.prompts) { this.selectedPrompts.add(key); }
                    for (const key of rk.questions) { this.selectedQuestions.add(key); }
                    this._lastRemovedSelections = null;
                    document.querySelectorAll('.toast.warning .toast-close').forEach(el => {
                        const t = el.closest('.toast');
                        if (t && t.querySelector('button[onclick*="undoRemovedSelections"]')) {
                            t.classList.remove('show'); setTimeout(() => t.remove(), 300);
                        }
                    });
                    this.syncCanvasFromSelection();
                    this.renderPromptList();
                    this.renderQuestionList();
                    this._saveSelectionToLocalStorage();
                    showToast('已恢复被移除的选中项', 'success', 2000);
                },

                showConfirm(msg) {
                    return new Promise(resolve => {
                        this._confirmResolve = resolve;
                        document.getElementById('confirmDialogMsg').textContent = msg;
                        document.getElementById('confirmDialog').style.display = 'flex';
                    });
                },

                _confirmResult(result) {
                    document.getElementById('confirmDialog').style.display = 'none';
                    if (this._confirmResolve) {
                        this._confirmResolve(result);
                        this._confirmResolve = null;
                    }
                },

                showPrompt(title, defaultValue) {
                    return new Promise(resolve => {
                        this._promptResolve = resolve;
                        document.getElementById('promptDialogTitle').textContent = title;
                        document.getElementById('promptDialogInput').value = defaultValue || '';
                        document.getElementById('promptDialog').style.display = 'flex';
                        setTimeout(() => document.getElementById('promptDialogInput').focus(), 50);
                    });
                },

                _promptResult(result) {
                    document.getElementById('promptDialog').style.display = 'none';
                    if (this._promptResolve) {
                        const value = result ? document.getElementById('promptDialogInput').value : null;
                        this._promptResolve(value);
                        this._promptResolve = null;
                    }
                },

                toggleDropdown(id) {
                    const dropdown = document.getElementById(id + 'Dropdown');
                    const trigger = dropdown?.previousElementSibling;
                    if (!dropdown) return;
                    const isOpen = dropdown.classList.contains('show');
                    document.querySelectorAll('.custom-select-dropdown.show').forEach(d => {
                        d.classList.remove('show');
                        d.previousElementSibling?.classList.remove('open');
                    });
                    if (!isOpen) {
                        dropdown.classList.add('show');
                        trigger?.classList.add('open');
                    }
                },

                async selectDropdownOption(id, value, text) {
                    const hidden = document.getElementById(id);
                    const textEl = document.querySelector(`#${id}Wrap .custom-select-text`);
                    const dropdown = document.getElementById(id + 'Dropdown');
                    if (hidden) hidden.value = value;
                    if (textEl) textEl.textContent = text;
                    dropdown?.querySelectorAll('.custom-select-option').forEach(opt => {
                        opt.classList.toggle('selected', opt.dataset.value === value);
                    });
                    this.toggleDropdown(id);
                    if (id === 'archiveSelector') await this.loadArchive(value);
                    else if (id === 'historySelector') this.loadHistoryResult();
                    else if (id === 'resultFilterStatus' || id === 'resultFilterModel') this.applyStreamFilter();
                },

                initDropdowns() {
                    document.addEventListener('click', (e) => {
                        if (!e.target.closest('.custom-select')) {
                            document.querySelectorAll('.custom-select-dropdown.show').forEach(d => {
                                d.classList.remove('show');
                                d.previousElementSibling?.classList.remove('open');
                            });
                        }
                    });
                },

                stepperChange(param, delta) {
                    const slider = document.getElementById('modal-' + param);
                    const input = document.getElementById('modal-' + param + 'Input');
                    if (!slider || !input) return;
                    const native = slider.querySelector('.slider-native');
                    if (!native) return;
                    const min = parseFloat(native.min);
                    const max = parseFloat(native.max);
                    const step = parseFloat(native.step);
                    let current = parseFloat(input.value) || 0;
                    let newVal = current + delta;
                    newVal = Math.round(newVal / step) * step;
                    newVal = Math.min(max, Math.max(min, newVal));
                    if (step < 1) newVal = parseFloat(newVal.toFixed(2));
                    this.onModalSliderChange(param, newVal);
                    this.onModalSliderCommit(param, newVal);
                },

                updateSliderVisual(param) {
                    const slider = document.getElementById('modal-' + param);
                    if (!slider) return;
                    const native = slider.querySelector('.slider-native');
                    const fill = slider.querySelector('.slider-fill');
                    const thumb = slider.querySelector('.slider-thumb');
                    if (!native || !fill || !thumb) return;
                    const min = parseFloat(native.min);
                    const max = parseFloat(native.max);
                    const val = parseFloat(native.value);
                    const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
                    fill.style.width = pct + '%';
                    thumb.style.left = pct + '%';
                },

                toggleSetFilterPanel() {
                    const panel = document.getElementById('setFilterPanel');
                    const btn = document.getElementById('setFilterBtn');
                    if (!panel) return;
                    const open = panel.style.display === 'block';
                    panel.style.display = open ? 'none' : 'block';
                    if (btn) btn.classList.toggle('active', !open);
                    if (!open) this.renderSetFilterPanel();
                },

                renderSetFilterPanel() {
                    const panel = document.getElementById('setFilterPanel');
                    if (!panel) return;
                    let html =
                        '<div style="font-size:10px;font-weight:600;color:var(--text-muted);margin-bottom:6px;">测试集</div>';
                    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px;">';
                    html += '<span class="set-chip' + (this.selectedTestSets.size === this.testSetNames.length ?
                        ' active' : '') + '" onclick="App.toggleSetFilter(\'\')">全部</span>';
                    html += this.testSetNames.map(n => {
                        const act = this.selectedTestSets.has(n) ? ' active' : '';
                        return '<span class="set-chip' + act + '" onclick="App.toggleSetFilter(\'' + n.replace(/'/g,
                            "\\'") + '\')">' + this.escapeHtml(n) + '</span>';
                    }).join('');
                    html += '</div>';
                    html +=
                        '<div style="font-size:10px;font-weight:600;color:var(--text-muted);margin-bottom:6px;">标签</div>';
                    html += '<div style="display:flex;flex-wrap:wrap;gap:4px;">';
                    html += '<span class="tag-chip' + (this.activeTags.size === 0 ? ' active' : '') +
                        '" onclick="App.toggleTagFromFilter(\'\')" style="cursor:pointer;">全部</span>';
                    html += this.allTags.map(tag => {
                        const act = this.activeTags.has(tag) ? ' active' : '';
                        return '<span class="tag-chip' + act + '" onclick="App.toggleTagFromFilter(\'' + tag.replace(/'/g,
                            "\\'") + '\')" style="cursor:pointer;">' + this.escapeHtml(tag) + '</span>';
                    }).join('');
                    html += '</div>';
                    panel.innerHTML = html;
                },

                toggleSetFilter(name) {
                    if (!name) {
                        if (this.selectedTestSets.size === this.testSetNames.length) {
                            this.selectedTestSets = new Set();
                        } else {
                            this.selectedTestSets = new Set(this.testSetNames);
                        }
                    } else if (this.selectedTestSets.has(name)) {
                        this.selectedTestSets.delete(name);
                    } else {
                        this.selectedTestSets.add(name);
                    }
                    this.renderSetFilterPanel();
                    this.computeCurrentTags();
                    const aTab = $('.tab-btn.active');
                    const t = aTab ? aTab.dataset.tab : 'prompts';
                    if (t === 'prompts') this.renderPromptList();
                    else this.renderQuestionList();
                },

                toggleTagFromFilter(tag) {
                    if (!tag) { this.activeTags.clear(); } else if (this.activeTags.has(tag)) { this.activeTags.delete(
                        tag); } else { this.activeTags.add(tag); }
                    this.renderSetFilterPanel();
                    const aTab = $('.tab-btn.active');
                    const t = aTab ? aTab.dataset.tab : 'prompts';
                    if (t === 'prompts') this.renderPromptList();
                    else this.renderQuestionList();
                },

                matchesTestSet(item) {
                    if (this.selectedTestSets.size === 0) return false;
                    return this.selectedTestSets.has(item.testSet);
                },

                matchesTag(entry) {
                    if (this.activeTags.size === 0) return true;
                    return this.activeTags.has(entry.tag);
                },

                matchesSearch(entry, searchText) {
                    if (!searchText) return true;
                    const tag = (entry.tag || '').toLowerCase();
                    const id = String(entry.id || '');
                    const question = (entry.question || '').toLowerCase();
                    const content = (entry.content || '').toLowerCase();
                    return tag.includes(searchText) || id.includes(searchText) || question.includes(searchText) || content.includes(searchText);
                },

                computeCurrentTags() {
                    const aTab = $('.tab-btn.active');
                    const t = aTab ? aTab.dataset.tab : 'prompts';
                    const source = t === 'questions' ? this.questions : this.prompts;
                    const ts = new Set();
                    const activeSearch = document.getElementById(t === 'questions' ? 'questionSearch' : 'promptSearch')
                        .value.toLowerCase();
                    source.forEach(item => {
                        if (!this.matchesTestSet(item)) return;
                        if (this.activeTags.size > 0 && !this.activeTags.has(item.tag || '未分类')) return;
                        if (!this.matchesSearch(item, activeSearch)) return;
                        const tag = item.tag || '未分类';
                        ts.add(tag);
                    });
                    const newTags = Array.from(ts).sort();
                    const tagsChanged = newTags.length !== this.allTags.length || newTags.some((t, i) => t !== this.allTags[i]);
                    if (tagsChanged) {
                        const oldActive = new Set(this.activeTags);
                        this.allTags = newTags;
                        const newTagSet = new Set(newTags);
                        const toKeep = [];
                        this.activeTags.forEach(tg => { if (newTagSet.has(tg)) toKeep.push(tg); });
                        this.activeTags = new Set(toKeep);
                        const removedTags = [...oldActive].filter(t => !newTagSet.has(t));
                        if (removedTags.length > 0) {
                            this.showToast('标签自动剔除: ' + removedTags.join(', '), 'warning');
                        }
                        this.renderSetFilterPanel();
                        if (t === 'prompts') this.renderPromptList();
                        else this.renderQuestionList();
                    } else {
                        this.renderSetFilterPanel();
                    }
                },

                renderPromptList() {
                    const container = document.getElementById('promptList');
                    const searchText = document.getElementById('promptSearch').value.toLowerCase();
                    const filtered = this.prompts.filter(p => this.matchesTestSet(p) && this.matchesTag(p) && this
                        .matchesSearch(p, searchText));
                    const groups = {};
                    filtered.forEach(p => {
                        const ts = p.testSet || '未知';
                        if (!groups[ts]) groups[ts] = {};
                        const tag = p.tag || '未分类';
                        if (!groups[ts][tag]) groups[ts][tag] = [];
                        groups[ts][tag].push(p);
                    });

                    const tsEntries = Object.entries(groups);
                    if (tsEntries.length === 0) {
                        container.innerHTML = '<div class="empty-state"><p>暂无提示词</p></div>';
                        return;
                    }
                    const emptyEl = container.querySelector('.empty-state');
                    if (emptyEl) emptyEl.remove();

                    const groupMap = new Map();
                    container.querySelectorAll('.entry-group').forEach(el => {
                        groupMap.set(el.dataset.groupId, el);
                    });
                    const desiredIds = new Set(tsEntries.map(([ts]) => 'p_' + ts));

                    tsEntries.forEach(([testSet, tags]) => {
                        const groupId = 'p_' + testSet;
                        const isOpen = this.openGroups.has(groupId);
                        const tagEntries = Object.entries(tags);

                        const existingEl = groupMap.get(groupId);
                        if (existingEl) {
                            existingEl.className = 'entry-group' + (isOpen ? ' open' : '');
                            const nameSpan = existingEl.querySelector('.entry-group-name');
                            if (nameSpan) {
                                const countSpan = nameSpan.querySelector('.entry-group-count');
                                if (countSpan) countSpan.textContent = tagEntries.length;
                            }
                            const itemsContainer = existingEl.querySelector('.entry-group-items');
                            if (itemsContainer) {
                                this._syncPromptItems(itemsContainer, testSet, tagEntries);
                            }
                            container.appendChild(existingEl);
                        } else {
                            const div = document.createElement('div');
                            div.className = 'entry-group' + (isOpen ? ' open' : '');
                            div.dataset.groupId = groupId;
                            const header = document.createElement('div');
                            header.className = 'entry-group-header';
                            header.dataset.groupKey = 'p_' + testSet;
                            header.innerHTML =
                                `<span class="entry-group-name">${this.escapeHtml(testSet)}<span class="entry-group-count">${tagEntries.length}</span></span>
                            <svg class="entry-group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>`;
                            header.addEventListener('click', () => App.toggleEntryGroup('p_' + testSet));
                            const itemsContainer = document.createElement('div');
                            itemsContainer.className = 'entry-group-items';
                            div.appendChild(header);
                            div.appendChild(itemsContainer);
                            this._syncPromptItems(itemsContainer, testSet, tagEntries);
                            container.appendChild(div);
                        }
                    });

                    container.querySelectorAll('.entry-group').forEach(el => {
                        if (!desiredIds.has(el.dataset.groupId)) el.remove();
                    });
                },

                renderQuestionList() {
                    const container = document.getElementById('questionList');
                    const searchText = document.getElementById('questionSearch').value.toLowerCase();
                    const filtered = this.questions.filter(q => this.matchesTestSet(q) && this.matchesTag(q) && this
                        .matchesSearch(q, searchText));
                    const groups = {};
                    filtered.forEach(q => {
                        const ts = q.testSet || '未知';
                        if (!groups[ts]) groups[ts] = [];
                        groups[ts].push(q);
                    });

                    if (Object.keys(groups).length === 0) {
                        container.innerHTML = '<div class="empty-state"><p>暂无问题</p></div>';
                        return;
                    }
                    const emptyEl = container.querySelector('.empty-state');
                    if (emptyEl) emptyEl.remove();

                    const groupMap = new Map();
                    container.querySelectorAll('.entry-group').forEach(el => {
                        groupMap.set(el.dataset.groupId, el);
                    });
                    const desiredIds = new Set(Object.keys(groups).map(ts => 'q_' + ts));

                    Object.entries(groups).forEach(([testSet, items]) => {
                        const groupId = 'q_' + testSet;
                        const isOpen = this.openGroups.has(groupId);

                        const existingEl = groupMap.get(groupId);
                        if (existingEl) {
                            existingEl.className = 'entry-group' + (isOpen ? ' open' : '');
                            const nameSpan = existingEl.querySelector('.entry-group-name');
                            if (nameSpan) {
                                const countSpan = nameSpan.querySelector('.entry-group-count');
                                if (countSpan) countSpan.textContent = items.length;
                            }
                            const itemsContainer = existingEl.querySelector('.entry-group-items');
                            if (itemsContainer) {
                                this._syncQuestionItems(itemsContainer, items);
                            }
                            container.appendChild(existingEl);
                        } else {
                            const div = document.createElement('div');
                            div.className = 'entry-group' + (isOpen ? ' open' : '');
                            div.dataset.groupId = groupId;
                            const header = document.createElement('div');
                            header.className = 'entry-group-header';
                            header.dataset.groupKey = 'q_' + testSet;
                            header.innerHTML =
                                `<span class="entry-group-name">${this.escapeHtml(testSet)}<span class="entry-group-count">${items.length}</span></span>
                            <svg class="entry-group-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>`;
                            header.addEventListener('click', () => App.toggleEntryGroup('q_' + testSet));
                            const itemsContainer = document.createElement('div');
                            itemsContainer.className = 'entry-group-items';
                            div.appendChild(header);
                            div.appendChild(itemsContainer);
                            this._syncQuestionItems(itemsContainer, items);
                            container.appendChild(div);
                        }
                    });

                    container.querySelectorAll('.entry-group').forEach(el => {
                        if (!desiredIds.has(el.dataset.groupId)) el.remove();
                    });
                },

                _syncPromptItems(container, testSet, tagEntries) {
                    const existingMap = new Map();
                    Array.from(container.children).forEach(el => {
                        const key = el.dataset.itemKey;
                        if (key) existingMap.set(key, el);
                    });
                    const desiredKeys = new Set(tagEntries.map(([tag]) => 'pt_' + tag));
                    existingMap.forEach((el, key) => {
                        if (!desiredKeys.has(key)) el.remove();
                    });
                    tagEntries.forEach(([tag, items]) => {
                        const key = 'pt_' + tag;
                        const sel = items.some(p => this.selectedPrompts.has(`p_${p.testSet || '未分类'}_${p.id}_${p.file || ''}`));
                        const el = existingMap.get(key);
                        if (el) {
                            el.className = 'entry-item' + (sel ? ' selected' : '');
                            const cb = el.querySelector('.entry-checkbox');
                            if (cb) cb.className = 'entry-checkbox' + (sel ? ' checked' : '');
                            container.appendChild(el);
                        } else {
                            const div = document.createElement('div');
                            div.className = 'entry-item' + (sel ? ' selected' : '');
                            div.dataset.itemKey = key;
                            div.onclick = () => this.togglePromptByTestSetTag(testSet, tag);
                            div.innerHTML =
                                `<span class="entry-checkbox ${sel ? 'checked' : ''}"></span>
                            <div class="entry-info">
                                <div class="entry-name">${this.escapeHtml(tag)}</div>
                                <div class="entry-desc">${items.length}个提示词</div>
                            </div>`;
                            container.appendChild(div);
                        }
                    });
                },

                _syncQuestionItems(container, items) {
                    const existingMap = new Map();
                    Array.from(container.children).forEach(el => {
                        const key = el.dataset.itemKey;
                        if (key) existingMap.set(key, el);
                    });
                    const desiredKeys = new Set(items.map(q => 'qi_' + q.id + '_' + (q.file || '')));
                    existingMap.forEach((el, key) => {
                        if (!desiredKeys.has(key)) el.remove();
                    });
                    items.forEach(q => {
                        const key = 'qi_' + q.id + '_' + (q.file || '');
                        const selKey = `q_${q.testSet || '未分类'}_${q.id}_${q.file || ''}`;
                        const sel = this.selectedQuestions.has(selKey);
                        const preview = (q.question || '').substring(0, 60);
                        const el = existingMap.get(key);
                        if (el) {
                            el.className = 'entry-item' + (sel ? ' selected' : '');
                            const cb = el.querySelector('.entry-checkbox');
                            if (cb) cb.className = 'entry-checkbox' + (sel ? ' checked' : '');
                            container.appendChild(el);
                        } else {
                            const div = document.createElement('div');
                            div.className = 'entry-item' + (sel ? ' selected' : '');
                            div.dataset.itemKey = key;
                            div.onclick = () => this.toggleQuestion(selKey);
                            div.innerHTML = `<span class="entry-checkbox ${sel ? 'checked' : ''}"></span>
                            <div class="entry-info">
                                <div class="entry-name">#${q.id} ${preview}${q.question && q.question.length > 60 ? '...' : ''}</div>
                                <div class="entry-desc">${this.escapeHtml(q.tag || '')}</div>
                            </div>`;
                            container.appendChild(div);
                        }
                    });
                },

                toggleEntryGroup(id) {
                    if (this.openGroups.has(id)) this.openGroups.delete(id);
                    else this.openGroups.add(id);
                    const activeTab = $('.tab-btn.active');
                    const tab = activeTab ? activeTab.dataset.tab : 'prompts';
                    if (tab === 'prompts') this.renderPromptList();
                    else this.renderQuestionList();
                },

                saveUndoSnapshot() {
                    this.undoStack.push({
                        prompts: new Set(this.selectedPrompts),
                        questions: new Set(this.selectedQuestions)
                    });
                    if (this.undoStack.length > 20) this.undoStack.shift();
                },

                undoSelection() {
                    if (this.undoStack.length === 0) {
                        showToast('没有可撤销的操作', 'warning');
                        return;
                    }
                    const snapshot = this.undoStack.pop();
                    this.selectedPrompts = new Set(snapshot.prompts);
                    this.selectedQuestions = new Set(snapshot.questions);
                    this.renderPromptList();
                    this.renderQuestionList();
                    this.syncCanvasFromSelection();
                    this._saveSelectionToLocalStorage();
                },

                saveCanvasSnapshot() {
                    const snapshot = {
                        nodes: JSON.parse(JSON.stringify(this.canvasState.nodes)),
                        connections: JSON.parse(JSON.stringify(this.canvasState.connections)),
                        selectedPrompts: Array.from(this.selectedPrompts),
                        selectedQuestions: Array.from(this.selectedQuestions),
                        selectedModels: [...this.selectedModels]
                    };
                    if (this.canvasHistoryIndex < this.canvasState.history.length - 1) {
                        this.canvasState.history = this.canvasState.history.slice(0, this.canvasHistoryIndex + 1);
                    }
                    this.canvasState.history.push(snapshot);
                    if (this.canvasState.history.length > this._canvasHistoryMax) {
                        this.canvasState.history.shift();
                    }
                    this.canvasHistoryIndex = this.canvasState.history.length - 1;
                    this.updateCanvasUndoButtons();
                },

                canvasUndo() {
                    if (this.canvasHistoryIndex <= 0) return;
                    this.canvasHistoryIndex--;
                    this._restoreCanvasSnapshot(this.canvasState.history[this.canvasHistoryIndex]);
                    this.updateCanvasUndoButtons();
                },

                canvasRedo() {
                    if (this.canvasHistoryIndex >= this.canvasState.history.length - 1) return;
                    this.canvasHistoryIndex++;
                    this._restoreCanvasSnapshot(this.canvasState.history[this.canvasHistoryIndex]);
                    this.updateCanvasUndoButtons();
                },

                _restoreCanvasSnapshot(snapshot) {
                    this._canvasSyncDisabled = true;
                    this.canvasState.nodes = JSON.parse(JSON.stringify(snapshot.nodes));
                    this.canvasState.connections = JSON.parse(JSON.stringify(snapshot.connections));
                    if (snapshot.selectedPrompts) {
                        this.selectedPrompts = new Set(snapshot.selectedPrompts);
                    }
                    if (snapshot.selectedQuestions) {
                        this.selectedQuestions = new Set(snapshot.selectedQuestions);
                    }
                    if (snapshot.selectedModels) {
                        this.selectedModels = [...snapshot.selectedModels];
                        document.getElementById('selectedModelCount').textContent = this.selectedModels.length;
                    }
                    this.renderAssociationCanvas({ center: false });
                    this.renderPromptList();
                    this.renderQuestionList();
                    this._canvasSyncDisabled = false;
                },

                updateCanvasUndoButtons() {
                    const undoBtn = document.getElementById('canvasUndoBtn');
                    const redoBtn = document.getElementById('canvasRedoBtn');
                    if (undoBtn) {
                        undoBtn.disabled = !(this.canvasHistoryIndex > 0);
                    }
                    if (redoBtn) {
                        redoBtn.disabled = !(this.canvasHistoryIndex < this.canvasState.history.length - 1);
                    }
                },

                async clearCanvas() {
                    if (this.canvasState.nodes.length === 0) return;
                    if (!(await this.showConfirm('确定清空画布？所有节点和连线将被删除。'))) return;
                    this.canvasState.nodes = [];
                    this.canvasState.connections = [];
                    this.selectedPrompts.clear();
                    this.selectedQuestions.clear();
                    this.selectedModels = [];
                    this.updateSelectedModelCount();
                    this.renderPromptList();
                    this.renderQuestionList();
